<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Games Hub</title>
<style>
:root{--scale:1;--bg:#fbf7ee;--ink:#1d2433;--mute:#5b6478;--card:#fff;--line:#e6dfcd;--good:#1f9d55;--bad:#d64545;--c:#1d2433}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--scale))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
header.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;display:flex;gap:.5rem;align-items:center;padding:.55rem 1rem;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0;flex:1;min-width:9rem}
.tb{background:#ffffff26;border:0;color:#fff;border-radius:.5rem;padding:.35rem .7rem;cursor:pointer}
.tb:hover{background:#ffffff40}
main{max-width:74rem;margin:0 auto;padding:1rem}
.hero h2{font-size:1.9rem;margin:.3rem 0}
.hero p{color:var(--mute);margin:.2rem 0 .9rem}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.controls input{flex:1;min-width:12rem;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.7rem;background:#fff}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:2rem;padding:.25rem .8rem;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.catname{margin:1.2rem 0 .5rem;font-size:1.05rem;color:var(--c);border-bottom:2px solid var(--c);padding-bottom:.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.9rem}
.gcard{background:var(--card);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:1rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.2rem}
.gcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0001}
.gcard .n{font-size:.8rem;color:var(--c);font-weight:700}
.gcard .t{font-size:1.15rem;font-weight:700}
.gcard .p{font-size:.85rem;color:var(--mute)}
.gcard .d{font-size:.9rem}
.ghead{background:var(--c);color:#fff;border-radius:1rem;padding:1rem 1.2rem;margin-bottom:1rem}
.ghead h2{margin:0;font-size:2rem}
.ghead .meta{opacity:.92}
.nav{display:flex;justify-content:space-between;gap:.5rem;margin:.6rem 0;flex-wrap:wrap}
.nav a,.back{background:#fff;border:2px solid var(--line);border-radius:.6rem;padding:.3rem .8rem;font-size:.9rem;display:inline-block}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:.8rem;padding:.6rem;cursor:pointer;font-weight:700}
.tab.on{background:var(--c);color:#fff;border-color:var(--c)}
.steps{font-size:1.25rem;padding-left:1.6rem}
.steps li{margin:.5rem 0}
.note{background:#fff;border-left:6px solid var(--c);border-radius:.5rem;padding:.6rem .9rem;margin:.7rem 0;font-size:1.05rem}
.toolgrid{display:grid;grid-template-columns:1fr 19rem;gap:1rem;align-items:start}
@media(max-width:820px){.toolgrid{grid-template-columns:1fr}}
.panel{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.8rem;margin-bottom:.9rem}
.panel h4{margin:0 0 .4rem;font-size:.95rem;color:var(--mute)}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.btn{background:var(--c);color:#fff;border:0;border-radius:.7rem;padding:.6rem 1.1rem;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#fff;color:var(--c);border:2px solid var(--c)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bigcard{background:#fff;border:3px solid var(--c);border-radius:1.2rem;padding:1.4rem;min-height:12rem;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:.8rem}
.bigcard.empty{color:var(--mute);border-style:dashed;font-size:1.2rem}
.big{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;line-height:1.1}
.mid{font-size:clamp(1.3rem,3.5vw,2.1rem);font-weight:700}
.ph{font-size:1.4rem;color:var(--mute)}
.muted{color:var(--mute)}
.ans{font-size:1.5rem;color:var(--good);font-weight:700}
.tag{display:inline-block;border-radius:2rem;padding:.2rem .8rem;margin:.15rem;font-size:1.2rem;background:#eee}
.tag.bad{background:#fde4e4;color:#a12525;font-weight:700}
.forbid{display:flex;flex-wrap:wrap;justify-content:center}
.catlabel{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--c);font-weight:700}
.time{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:.5rem;background:#eee;border-radius:1rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.timer.low .time{color:var(--bad)}
.timer.done{animation:flash .6s 4}
@keyframes flash{50%{background:#fde4e4}}
.team{display:flex;align-items:center;gap:.4rem;margin:.3rem 0}
.team input{flex:1;min-width:0;border:2px solid var(--line);border-radius:.5rem;padding:.3rem .5rem}
.team .pts{font-size:1.6rem;font-weight:800;min-width:2.2rem;text-align:center}
.team button,.sbtn{border:2px solid var(--line);background:#fff;border-radius:.5rem;width:2.2rem;height:2.2rem;cursor:pointer;font-weight:800}
.cnum{font-size:3rem;font-weight:800;text-align:center}
.cmsg{text-align:center;color:var(--mute);margin:.3rem 0}
.low .cnum{color:var(--bad)}
details.bank{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.6rem .9rem;margin-top:1rem}
details.bank summary{cursor:pointer;font-weight:700}
details.bank ul{columns:2 14rem;padding-left:1.2rem;margin:.6rem 0 0}
details.bank li{margin:.2rem 0;break-inside:avoid}
.hands{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.8rem;margin-top:.8rem}
.cards{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
.cards.blur{filter:blur(8px);pointer-events:none;user-select:none}
.cd{border:2px solid var(--line);border-radius:.6rem;padding:.25rem .6rem;cursor:pointer;background:#fff;font-size:.95rem}
.cd.chr{background:#e8f0ff}.cd.itm{background:#fff4d6}.cd.plc{background:#e4f6e8}.cd.evt{background:#fde8f0}.cd.end{background:#2b2f3f;color:#ffd96a}.cd.red{background:#fde8e8}
.cd.vcb{background:#efe6ff}.cd.used{opacity:.35;text-decoration:line-through}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-width:26rem;margin:0 auto}
.bgrid.blur .tile{filter:blur(10px)}
.tile{aspect-ratio:1;background:#fffbe8;border:3px solid var(--c);border-radius:.8rem;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,6vw,3rem);font-weight:800}
.dice{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.die{width:6.4rem;min-height:6.4rem;border:3px solid var(--c);border-radius:1rem;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.3rem .2rem}.die .em{font-size:2.8rem;line-height:1.1}.die small{font-size:.8rem;font-weight:700;color:var(--mute)}.die.sel{background:var(--c)}.die.sel small{color:#fff}.sk{display:grid;grid-template-columns:8.5rem 1fr;gap:.2rem .8rem;align-items:start;font-size:1.25rem;margin:.55rem 0}.sk b{color:var(--c);font-size:1rem}@media(max-width:600px){.sk{grid-template-columns:1fr}}.vitem{border-bottom:1px solid var(--line)}.vitem .vrow{border-bottom:0;cursor:pointer}.vitem .vrow::after{content:none}.vdet{background:#faf7ee;border-radius:.6rem;padding:.4rem .9rem .7rem;margin:0 0 .5rem;font-size:1.05rem}.vdet .ok{color:var(--good)}
.cn{display:grid;gap:.4rem}
.cn-c{overflow-wrap:anywhere;border:2px solid var(--line);background:#fff;border-radius:.6rem;padding:.9rem .2rem;font-weight:700;font-size:clamp(.85rem,2.2vw,1.3rem);cursor:pointer;text-transform:uppercase}
.cn-c.key{border-width:5px}
.cn-c.red.key,.cn-c.red.up{border-color:#d64545}.cn-c.blue.key,.cn-c.blue.up{border-color:#2a6fd1}
.cn-c.neutral.key{border-color:#c8b88a}.cn-c.assassin.key{border-color:#111}
.cn-c.up.red{background:#d64545;color:#fff}.cn-c.up.blue{background:#2a6fd1;color:#fff}.cn-c.up.neutral{background:#e9dfc2}.cn-c.up.assassin{background:#111;color:#fff}
.gal{width:12rem;height:12rem;stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.gal .pt{stroke:var(--bad)}
.hw{display:inline-flex;gap:.25rem;margin:.3rem .8rem}
.hl{min-width:2rem;height:2.6rem;border-bottom:4px solid var(--ink);text-align:center;font-size:1.8rem;font-weight:800}
.hl.punct{border-bottom:0}.hl.miss{color:var(--bad)}
.kb{display:flex;flex-direction:column;align-items:center;gap:.3rem;margin:.6rem 0}
.kb div{display:flex;gap:.3rem}
.kb button{width:2.4rem;height:2.8rem;border:2px solid var(--line);background:#fff;border-radius:.5rem;font-weight:800;cursor:pointer}
.kb button.ok{background:#d9f4e2}.kb button.no{background:#fde4e4;opacity:.6}
.chain{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chain span{background:#fff;border:2px solid var(--c);border-radius:2rem;padding:.2rem .8rem;font-size:1.2rem}
.fu{font-size:clamp(2rem,7vw,4rem);font-weight:800}
.fu.f{color:var(--good)}.fu.u{color:var(--bad)}
.sent{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:700;min-height:4rem}
input.txt{padding:.6rem .8rem;border:2px solid var(--line);border-radius:.7rem;font-size:1.1rem;flex:1;min-width:8rem}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:.35rem .6rem;text-align:left}
.vrow{display:grid;grid-template-columns:2.6rem 11rem 1fr;gap:.6rem;border-bottom:1px solid var(--line);padding:.45rem .2rem;font-size:1.05rem}.vrow b{font-size:1.15rem}.vd.blur{filter:blur(7px);cursor:pointer}.vl{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.4rem .8rem}.lvl{font-size:.75rem;font-weight:700;border-radius:.4rem;padding:.1rem .4rem;color:#fff;align-self:start;text-align:center}.lvl5{background:#128a80}.lvl6{background:#6150d6}@media(max-width:600px){.vrow{grid-template-columns:2.6rem 1fr}.vrow .vd{grid-column:1/-1}}
.hint{color:var(--good);font-size:.95rem;margin-top:.25rem;font-weight:700}.hint span{font-weight:400;color:var(--ink)}
footer{text-align:center;color:var(--mute);padding:2rem 1rem;font-size:.85rem}
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/">📚 English Games Hub · P5/6</a></h1>
  <button class="tb" id="smaller" title="Smaller text">A−</button>
  <button class="tb" id="larger" title="Larger text">A+</button>
  <button class="tb" id="fs" title="Fullscreen">⛶ Fullscreen</button>
</header>
<main id="app"></main>
<footer>Instructions and resources for 20 classroom English games. Works offline — no sign-in, no data stored.</footer>

<script>
/* ---------- helpers ---------- */
const h=(tag,props,...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const kid of kids.flat(2)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}return e;};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const makeDeck=a=>{let q=[];return{next(){if(!q.length)q=shuffle(a);return q.pop();}};};
let cleanups=[];const onLeave=f=>cleanups.push(f);
let ac;const audio=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}};
const beep=()=>{try{audio();[0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.15);});}catch(e){}};
const chipRow=(opts,initial,onPick)=>{const row=h('div',{class:'chips'});opts.forEach(([k,t])=>{const b=h('button',{class:'chip'+(k===initial?' on':''),onclick:()=>{[...row.children].forEach(x=>x.classList.toggle('on',x===b));onPick(k);}},t);row.append(b);});return row;};

/* ---------- widgets ---------- */
function Timer(presets=[60],o={}){
  let total=presets[0],left=total,iv=null,running=false,endAt=0;
  const disp=h('div',{class:'time'}),bar=h('div',{class:'bar'},h('i')),btn=h('button',{class:'btn',onclick:()=>toggle()},'▶ Start');
  const lab=p=>p<60?p+'s':(p%60?Math.floor(p/60)+':'+String(p%60).padStart(2,'0'):(p/60)+' min');
  const chips=presets.length>1?chipRow(presets.map(p=>[p,lab(p)]),total,p=>reset(p)):null;
  const root=h('div',{class:'panel timer'},h('h4',{},o.title||'⏱ Timer'),disp,bar,chips,h('div',{class:'btnrow'},btn,h('button',{class:'btn ghost',onclick:()=>reset()},'↺ Reset')));
  const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  function paint(){disp.textContent=fmt(left);bar.firstChild.style.width=(total?left/total*100:0)+'%';root.classList.toggle('low',running&&left<=10&&total>10);btn.textContent=running?'⏸ Pause':(left<total&&left>0?'▶ Resume':'▶ Start');}
  function tick(){left=(endAt-Date.now())/1000;if(left<=0){left=0;clearInterval(iv);running=false;paint();root.classList.add('done');beep();o.onEnd&&o.onEnd();}else paint();}
  function start(sec){if(sec!=null){total=sec;left=sec;}if(left<=0)left=total;root.classList.remove('done');endAt=Date.now()+left*1000;clearInterval(iv);iv=setInterval(tick,100);running=true;audio();paint();}
  function pause(){if(!running)return;left=(endAt-Date.now())/1000;clearInterval(iv);running=false;paint();}
  function reset(sec){clearInterval(iv);running=false;if(sec!=null)total=sec;left=total;root.classList.remove('done');paint();}
  function toggle(){running?pause():start();}
  onLeave(()=>clearInterval(iv));paint();
  return{root,start,pause,reset,toggle,get running(){return running;}};
}
function Scoreboard(o={}){
  const label=o.label||'Team',teams=[];const root=h('div',{class:'panel'});
  function draw(){root.replaceChildren(h('h4',{},'🏆 Scoreboard'),...teams.map(t=>h('div',{class:'team'},h('input',{value:t.name,'aria-label':'Name',oninput:e=>{t.name=e.target.value;}}),h('button',{onclick:()=>{t.pts--;draw();}},'−'),h('div',{class:'pts'},String(t.pts)),h('button',{onclick:()=>{t.pts++;draw();}},'+'))),h('div',{class:'btnrow'},h('button',{class:'btn ghost',onclick:()=>{teams.push({name:label+' '+(teams.length+1),pts:0});draw();}},'+ '+label),teams.length>1&&h('button',{class:'btn ghost',onclick:()=>{teams.pop();draw();}},'− Remove'),h('button',{class:'btn ghost',onclick:()=>{teams.forEach(t=>t.pts=0);draw();}},'Zero')));}
  for(let i=0;i<(o.n||2);i++)teams.push({name:label+' '+(i+1),pts:0});draw();return{root};
}
function Counter(o){
  let n=0,max=o.maxes?o.maxes[0]:o.max;const num=h('div',{class:'cnum'}),msg=h('div',{class:'cmsg'});
  const chips=o.maxes?chipRow(o.maxes.map(x=>[x,x+' max']),max,x=>{max=x;n=0;paint();}):null;
  const root=h('div',{class:'panel'},h('h4',{},o.title),chips,num,msg,h('div',{class:'btnrow'},h('button',{class:'btn',onclick:()=>{if(n<max){n++;paint();}}},o.btn||'+1'),h('button',{class:'btn ghost',onclick:()=>{n=0;paint();}},'↺ Reset')));
  function paint(){num.textContent=o.down?(max-n):n+' / '+max;msg.textContent=o.down?(n>=max?(o.endMsg||'Out of questions!'):'Asked '+n+' of '+max):(n>=max?(o.endMsg||'Limit reached!'):'');root.classList.toggle('low',n>=max);}
  paint();return{root};
}
function bank(m,title,list){m.append(h('details',{class:'bank'},h('summary',{},title+' ('+list.length+')'),h('ul',{},list.map(x=>h('li',{html:x})))));}
function cardTool(m,s,o){
  let items=o.items,deck=makeDeck(items),cur=null,shown=true;const refs={};
  if(o.cats)m.append(chipRow([['All','All'],...o.cats.map(c=>[c,c])],'All',c=>{items=c==='All'?o.items:o.items.filter(i=>i.c===c);deck=makeDeck(items);cur=null;paint();}));
  const card=h('div',{class:'bigcard'});
  const next=h('button',{class:'btn',onclick:()=>{const it=deck.next();cur=o.prep?o.prep(it):it;shown=!o.hidden;paint();}},o.btn||'Next card ▶');
  const rev=(o.hidden||o.partial)?h('button',{class:'btn alt',onclick:()=>{shown=!shown;paint();}},o.revealLabel||'👁 Reveal / hide'):null;
  function paint(){card.classList.toggle('empty',!cur);if(!cur){card.textContent=o.empty||'Press “'+(o.btn||'Next card ▶')+'” to begin';return;}card.replaceChildren(o.hidden&&!o.partial&&!shown?h('div',{class:'ph'},'🙈 Card hidden — only the player should look!'):o.render(cur,shown));}
  m.append(card,h('div',{class:'btnrow'},next,rev));paint();refs.paint=paint;
  if(o.timer){refs.timer=Timer(o.timer);s.append(refs.timer.root);}
  if(o.score){refs.score=Scoreboard(o.score);s.append(refs.score.root);}
  if(o.counter){refs.counter=Counter(o.counter);s.append(refs.counter.root);}
  if(o.bank)bank(m,o.bank.title,(o.bankItems||o.items).map(o.bank.fmt));
  return refs;
}
function dealer(m,o){
  let np=o.minP;
  const sel=h('select',{class:'chip',onchange:e=>{np=+e.target.value;}},range(o.minP,o.maxP).map(n=>h('option',{value:n},n+' players')));
  const out=h('div',{class:'hands'});
  function deal(){
    const per=o.perFn?o.perFn(np):o.per;const pool=shuffle(typeof o.pool==='function'?o.pool():o.pool),ex=o.extra?shuffle(o.extra):[],bn=o.bonus?shuffle(o.bonus.items):[];
    out.replaceChildren(...range(1,np).map(i=>{
      const cards=pool.splice(0,per).concat(bn.splice(0,o.bonus?o.bonus.per:0),ex.splice(0,1));
      const box=h('div',{class:'cards blur'},cards.map(c=>h('div',{class:'cd '+c.cls,onclick:e=>e.currentTarget.classList.toggle('used')},c.d?[c.t,h('small',{style:'display:block;opacity:.75;max-width:14rem'},c.d)]:c.t)));
      const b=h('button',{class:'btn ghost',onclick:()=>{box.classList.toggle('blur');b.textContent=box.classList.contains('blur')?'👁 Show hand':'🙈 Hide hand';}},'👁 Show hand');
      return h('div',{class:'panel'},h('h4',{},'Player '+i+' · '+cards.length+' cards'),box,b);
    }));
  }
  m.append(h('div',{class:'btnrow'},sel,h('button',{class:'btn',onclick:deal},'🃏 Deal cards')),h('div',{class:'muted'},'Tap a card to cross it off when it is played.'),out);
}

ast, the clock ticked again, and the hero walked home with one extra hour of free time in a pocket.","s":"Describe the ticking of the clock and how it feels when time drags without using the word slow."},"19":{"h":"The hero sat beneath the old tree in the neighbourhood park, sharing a packet of kaya toast with the sparrows.","p":"But the tree was to be cut down on Monday, and the hero had only one weekend to save it.","t":"Out of nowhere, the tree dropped a rain of golden leaves that spelled out a message for the hero.","e":"From that day on, the tree stood proudly in the park, and the neighbours gathered around it every evening.","s":"Describe the rustle of leaves and the dappled shade of the tree without using the words green or nice."},"20":{"h":"The hero met a wrinkly turtle on the beach at East Coast, plodding steadily towards the sparkling waves.","p":"But the turtle was very slow, and the tide was rushing in faster than the hero had expected.","t":"Just then, the turtle tucked in its head and rolled down the sand like a bowling ball, giggling all the way.","e":"By the end, the turtle reached the sea, and the hero waved until its little head disappeared beneath the waves.","s":"Describe the turtle's patient steps across the sand without using the words slow or slowly."},"21":{"h":"The hero found a magic wand in the lost property box, with a tiny silver star glimmering at its tip.","p":"But the wand only worked backwards, so every spell the hero cast made things grow smaller or vanish.","t":"All at once, the wand zapped the hero's homework into a flock of paper birds that flew out of the window.","e":"In the end, the wand taught the hero that kindness was the best magic, and the whole class agreed.","s":"Describe the moment the wand glows and tingles in the hero's hand without using the words magic or magical."},"22":{"h":"The hero stepped into the quiet hotel lobby on a family holiday and spotted a bell on the counter.","p":"But the bell would not ring, and the hero needed to find the missing key before the lights went out.","t":"Suddenly, the bell chimed by itself, and a tiny doorman popped out of the counter to greet the hero.","e":"At last, the bell rang out in a bright, clear tone, and the hero's family cheered from the lift.","s":"Describe the clear sound of the bell echoing through the empty lobby without using the word ring."},"23":{"h":"The hero strolled through the pasar malam when a single music note floated past, glittering in the lantern light.","p":"But the music note kept dodging the hero's hands, and it drifted farther away with every step.","t":"Out of nowhere, the music note burst into a tune that made all the stall owners start to dance.","e":"By the end, the music note settled into the hero's pocket, and the hero hummed it all the way home.","s":"Describe the tune of a music note drifting through the night market without using the word sound."},"24":{"h":"The hero discovered a golden crown on the school stage, sparkling beneath the stage lights like a tiny sun.","p":"But the crown was far too heavy, and it kept slipping over the hero's eyes whenever there was a step to climb.","t":"Then, the crown whispered that it belonged to the kindest person in the school, and the hero blushed.","e":"In the end, the crown was passed on to another pupil, and the hero clapped the loudest of all.","s":"Describe how the crown feels as it is placed on the hero's head without using the words heavy or shiny."},"25":{"h":"The hero emptied the box on the floor and found a thousand pieces of a puzzle spread across the carpet.","p":"But the last puzzle piece was missing, and the picture of the harbour had a hole where the sun should be.","t":"Just then, the missing puzzle piece rolled out from under the sofa and clicked into place all by itself.","e":"From that day on, the finished puzzle hung above the hero's bed, and the family called it a team effort.","s":"Describe the tiny clack of a puzzle piece fitting into place without using the words click or small."},"26":{"h":"The hero tiptoed into the attic and found a tall mirror covered with a dusty sheet and a faint glow.","p":"But the mirror showed the room exactly as it was, except that the hero was missing from the reflection.","t":"Without warning, the mirror rippled like water, and the hero's reflection waved and winked back with a grin.","e":"By the end, the mirror had shown the hero that the bravest self was already inside, and the hero smiled.","s":"Describe the hero's surprised face in the mirror without using the words surprised or shocked."},"27":{"h":"The hero paddled ashore on a tiny island no bigger than a school field, with one coconut and a very loud stomach.","p":"But the tide was rising fast, and the island shrank a little more with every wave.","t":"Suddenly, the whole island gave a gentle shudder and began to drift slowly out to sea.","e":"By the end, the island had a name, a flag and a rope ladder, and the hero was its proud mayor.","s":"Describe the heat of the sand on the island using touch and sound, without using the word hot."},"28":{"h":"An elephant wandered down the hero's HDB corridor one sleepy Sunday, politely sniffing at every door.","p":"But the elephant was far too wide to squeeze into the lift, and the hero had no idea how to get it home.","t":"Out of nowhere, the elephant sprayed water from its trunk and painted a glittering rainbow across the sky.","e":"At last, the elephant waved its trunk goodbye, and the hero felt very proud of being a gentle guide.","s":"Describe the rough, wrinkled skin of the elephant and the rumble of its footsteps without using the word big."},"29":{"h":"The hero stood on the school field with a borrowed bow, staring at the target that shimmered far away.","p":"But the wind kept tugging at every arrow, and the target seemed to wobble each time the hero aimed.","t":"Then, the target blinked twice and slid sideways, as if it were playing a cheeky game of hide and seek.","e":"In the end, the hero hit the target right in the centre, and the whole class cheered so loudly the birds flew off.","s":"Describe the hero's breathing and shaking hands just before the shot at the target, without using the word nervous."},"30":{"h":"On a breezy afternoon at the park, the hero unwrapped a brand new kite painted with tiny golden stars.","p":"But the string snarled into a hundred knots, and the kite flopped to the grass like a tired fish.","t":"All at once, a great gust lifted the kite high and carried the hero's feet right off the ground.","e":"From that day on, the kite hung above the hero's bed, a reminder that wind can be a friend.","s":"Describe the sound and feel of the kite fluttering against the wind without using the words fast or loud."},"31":{"h":"After the thunderstorm, the hero ran onto the balcony and saw a rainbow stretching over the whole housing estate.","p":"But the rainbow was fading fast, and the hero had only a few minutes to make a wish.","t":"Without warning, the rainbow dipped down like a slide, and its colours rippled invitingly at the hero's feet.","e":"By the end, the hero had painted every colour of the rainbow on the classroom wall for everyone to enjoy.","s":"Describe the colours of the rainbow to a friend who cannot see, without naming a single colour."},"32":{"h":"In the science room, the hero found a tiny magnet that tugged playfully at every paper clip nearby.","p":"But the magnet stuck fast to the metal teacher's desk, and no amount of pulling would set it free.","t":"Just then, the magnet began to drag the hero across the room, past chairs, bags and one surprised teacher.","e":"At last, the magnet let go, and the hero kept it as a lucky charm in a pencil case.","s":"Describe the strange pulling feeling of the magnet in the hero's fingers without using the words pull or strong."},"33":{"h":"During a sudden blackout, the hero lit a single candle and carried it carefully down the dark corridor.","p":"But a draught kept tickling the candle, and its small flame shivered as though it might give up.","t":"Out of nowhere, the candle flame stretched into the shape of a tiny dancing figure and beckoned the hero onward.","e":"From that day on, the candle sat on the windowsill, and its warm glow made the whole flat feel safe.","s":"Describe the smell and the soft light of the candle as it burned down, without using the word bright."},"34":{"h":"The hero wheeled a shiny red bicycle along the park connector, ready for the very first ride without help.","p":"But the bicycle wobbled like jelly, and the hero's knees trembled at the thought of tumbling into the bushes.","t":"Without warning, the bicycle sprouted two feathery wings and lifted gently over the heads of startled joggers.","e":"In the end, the hero rode the bicycle all the way to the beach and rang its bell in triumph.","s":"Describe the whirr of the bicycle wheels and the wind against the hero's face without using the word fast."},"35":{"h":"Late one evening, the hero heard a soft hoot and spotted an owl perched on the school gate.","p":"But the owl would not stop staring, and the hero felt that it knew a secret nobody else did.","t":"Then, the owl dropped a folded note from its beak, and the neat handwriting inside spelled out the hero's name.","e":"At last, the owl flew off into the night, and the hero finally understood its quiet message.","s":"Describe the eyes and silent wings of the owl in the dark, without using the words big or scary."},"36":{"h":"At the hawker centre, the hero queued patiently for a steaming bowl of noodles while the lunch crowd chattered.","p":"But the noodles arrived swimming in far too much chilli, and the hero's eyes began to water already.","t":"All at once, the noodles wriggled up out of the bowl and began to spell out a mysterious message.","e":"By the end, the hero had slurped the last of the noodles and left a tip for the cheerful uncle.","s":"Describe the smell and the steam of the noodles without using the words delicious or tasty."},"37":{"h":"It was a grey Monday morning, and the hero stood at the bus stop listening to the rain drumming on the roof.","p":"But the hero had forgotten the umbrella, and the rain showed no sign of stopping before the school bell.","t":"Suddenly, the rain stopped in mid-air, and every single drop hovered like a tiny glass bead around the hero.","e":"In the end, the hero danced in the rain, laughing, and arrived at school soaked but wonderfully happy.","s":"Describe the sound of the rain on the roof, and how the air smelled afterwards, without using the word wet."},"38":{"h":"On a sparkling Saturday, the hero stepped aboard a small sailboat at the marina, holding a map and a thermos of barley.","p":"But the sailboat's sail was tangled, and a sulky cloud was drifting right towards the harbour.","t":"Out of nowhere, a friendly dolphin nudged the sailboat and began pushing it towards a hidden, sunlit bay.","e":"At last, the sailboat bobbed safely home at sunset, and the hero tied it up with a proud grin.","s":"Describe how the sailboat rocks on the water and how the sea breeze tastes, without using the word salty."},"39":{"h":"Deep in the old storeroom, the hero switched on a torch and its beam swept across dusty shelves.","p":"But the torch flickered and dimmed, and the hero heard something shuffling softly behind the boxes.","t":"Just then, the torch beam landed on a pair of shining eyes, and a very sleepy kitten blinked back.","e":"From that day on, the torch stayed in the hero's school bag, ready for every dark corner ahead.","s":"Describe the circle of light from the torch and the shadows it chased away, without using the word dark."},"40":{"h":"The hero dragged a battered suitcase through Changi Airport, humming with excitement about the very first flight overseas.","p":"But the suitcase would not zip shut, and the check-in queue behind the hero grew longer and longer.","t":"Without warning, the suitcase popped open and a flock of paper birds flew out, fluttering above the startled crowd.","e":"By the end, the suitcase was filled with postcards and shells, each one telling its own story of the trip.","s":"Describe the muddle of sounds and smells around the hero's suitcase at the airport without using the word busy."},"41":{"h":"Late at night, the hero peered through a borrowed telescope and discovered a small purple planet shining all alone.","p":"But the planet was so far away that the hero could not tell whether anyone lived there.","t":"All at once, the planet blinked, and a long ladder of silver light unrolled down to the hero's window.","e":"In the end, the planet got a brand new name, chosen by the hero and the whole class.","s":"Describe how the surface of the planet might look and feel, using at least three senses and no word like strange."},"42":{"h":"At the aquarium, the hero pressed a nose to the glass and met the curious gaze of an octopus.","p":"But the octopus had wrapped all eight arms around the hero's lunch box, and refused to give it back.","t":"Then, the octopus changed colour like a chameleon and slipped through a crack nobody had noticed before.","e":"At last, the octopus waved a tentacle and returned the lunch box, now sparkling with a pretty shell.","s":"Describe the slippery, bendy movements of the octopus as it glides along the glass, without using the word slimy."},"43":{"h":"On the last day of the school holidays, the hero spotted a huge striped circus tent that had appeared overnight on the field.","p":"But the circus tent was completely silent, and the entrance flap was tied shut with a golden rope.","t":"Out of nowhere, the circus tent lit up from inside, and music began to drift through the canvas walls.","e":"From that day on, the hero told everyone about the circus tent that appeared once and never returned.","s":"Describe the smell of popcorn and the buzz around the circus tent without using the words exciting or fun."},"44":{"h":"In the dusty corner of a museum shop, the hero found a diamond glittering in a tiny glass jar.","p":"But the shopkeeper would only hand over the diamond to someone who could answer a riddle nobody had ever solved.","t":"Suddenly, the diamond cracked open, and a tiny, cheerful voice inside asked the hero for a bedtime story.","e":"At last, the diamond went back to its jar, and the hero left with a smile and a secret.","s":"Describe how the diamond catches the light and scatters it around the room, without using the words shiny or sparkly."},"45":{"h":"Under the sofa cushions, the hero found a single old coin stamped with a crown nobody recognised.","p":"But the coin was too small to buy anything, and the hero's pocket had a hole just large enough to lose it.","t":"Just then, the coin spun on the floor and kept spinning, humming a tune that grew louder each second.","e":"By the end, the coin lay safe in a glass jar, and the hero carried its story everywhere.","s":"Describe the weight and the cool ring of the coin as it spins on the table, without using the word metal."},"46":{"h":"Every night, the hero tucked a worn teddy bear under one arm before drifting off to sleep.","p":"But one morning the teddy bear was gone, and only a trail of fluffy stuffing led out of the bedroom.","t":"Out of nowhere, the teddy bear sat up, rubbed its button eyes and asked the hero for a bowl of porridge.","e":"From that day on, the teddy bear sat on the best chair at every family dinner.","s":"Describe how soft and worn the teddy bear feels, and the comfort it brings, without using the words cuddly or cute."},"47":{"h":"At dawn, the hero pushed a wooden canoe into a quiet river and dipped the paddle into the water.","p":"But the canoe had a tiny leak, and every few strokes a cold trickle crept around the hero's feet.","t":"Without warning, the canoe was lifted by a gentle current and swept around a bend into a hidden lagoon.","e":"In the end, the hero steered the canoe home, tired, happy and carrying a bright green feather.","s":"Describe the sounds of the paddle and the water as the canoe glides along, without using the word splash."},"48":{"h":"In the corner of the school garden, the hero watered a drooping sunflower and whispered a small encouraging promise.","p":"But the sunflower refused to turn its face to the sun, and its petals drooped sadly day after day.","t":"All at once, the sunflower swivelled towards the hero and burst into a golden blaze of petals.","e":"At last, the sunflower stood taller than the whole class, and its seeds were shared with every neighbour.","s":"Describe the colour and shape of the sunflower as it follows the sun, without using the words yellow or tall."},"49":{"h":"On a warm afternoon, the hero sat in a sunny garden when a fuzzy bee landed gently on a notebook.","p":"But the bee buzzed round and round the hero's head, and the hero was too frozen to move.","t":"Then, the bee flew in a neat zigzag, and the pattern it traced in the air looked like a tiny map.","e":"By the end, the bee had led the hero to a hidden flower patch, and they shared a quiet afternoon.","s":"Describe the buzzing of the bee as it hovers close to the hero's ear, without using the word noise."},"50":{"h":"The hero tied up scruffy hiking boots and gazed up at the misty mountain that waited beyond the village.","p":"But a thick fog rolled down the mountain, and the narrow path ahead vanished completely from sight.","t":"Just then, a lonely goat trotted out of the fog and began leading the hero up the mountain.","e":"In the end, the hero reached the top of the mountain and watched the sunrise paint the clouds.","s":"Describe the thin, cold air at the top of the mountain and the view below, without using the word high."},"51":{"h":"The old telephone in the hall rang at midnight, and the hero tiptoed over in pyjamas to answer it.","p":"But the telephone line was crackly, and the voice on the other end seemed to be calling from very far away.","t":"Suddenly, the telephone began to ring again, though the hero was still holding it, and a gentle voice whispered a riddle.","e":"At last, the telephone fell silent, and the hero smiled, knowing the mystery caller was a friend after all.","s":"Describe the sound of the telephone ringing in the quiet house, and the hero's racing heart, without using the word scared."},"52":{"h":"The hero stepped into the sleepy old hotel lobby and found a gleaming reception bell sitting on the empty counter.","p":"But no matter how many times the hero pressed the reception bell, no one came to the counter.","t":"Out of nowhere, the reception bell rang by itself, and every door along the corridor swung open together.","e":"By the end, the hero was named the hotel's honorary manager and was given the reception bell to keep.","s":"Describe the clear ping of the reception bell echoing through the empty lobby, without using the word loud."},"53":{"h":"At the beach, the hero kicked off one flip-flop and let the warm waves tickle bare toes.","p":"But a cheeky wave snatched the flip-flop away, and it bobbed out of reach beyond the rocks.","t":"All at once, the flip-flop returned on the back of a friendly crab, wearing a tiny seaweed bow.","e":"In the end, the flip-flop became the hero's lucky shoe, worn at every beach trip afterwards.","s":"Describe the slap and squelch of a flip-flop on the wet sand, without using the words noisy or sound."}};
const BRIDGE={"0-1":["A caretaker hunts through every drawer in the old castle because the only key to the gift shop has gone missing.","A tiny golden key grows into a giant and carries the castle on its back across the land."],"0-2":["A girl watches the moon rise behind the castle and realises the evening night tour is about to begin.","The moon slips down from the sky and lands on the castle roof like a huge glowing hat."],"0-3":["A boy dressed as a dragon leads the parade through the castle gates on heritage festival day.","A shy dragon moves into the castle and keeps the whole place warm, but nobody dares to say hello."],"0-4":["A science club fires a model rocket over the castle wall, and everyone races across the lawn to find where it lands.","The castle turns out to be a rocket in disguise, and its towers blast off at midnight."],"0-5":["Tourists crowd under one umbrella while a guide explains the history of the castle during a sudden downpour.","A magic umbrella opens above the castle and lets the whole building drift away like a giant cloud."],"0-6":["A boy lets go of his balloon at the castle fair, and it drifts over the walls with a message tied on.","A huge balloon lifts the entire castle into the sky, with the surprised cook still stirring the soup."],"0-7":["A crackling fire in the great hearth of the castle warms the cold hall where the school camp sleeps.","The castle is built from living fire, and visitors must wear cool cloaks to cross its glowing bridge."],"0-8":["A fish keeps leaping in the moat, so a girl at the castle wonders who dropped it there.","Inside the castle, a talking fish rules the great hall and demands a bowl of crumbs every day."],"0-9":["A rare butterfly lands on the castle wall, and a young scientist follows it through the garden taking notes.","A butterfly flaps its glowing wings and paints a hidden map across the castle walls at dusk."],"0-10":["From the tower of the castle, a hiker spots smoke rising from the volcano and warns the village below.","The castle sits inside the volcano, and every time it erupts, the towers shoot out sparkling confetti."],"0-11":["A librarian finds a dusty book in the castle archive that explains why the clock tower stopped ticking.","Opening the book makes a tiny castle pop up from the pages and grow bigger with every turn."],"0-12":["Pupils put on theatre masks and act out a royal tale in the castle courtyard for visiting families.","Anyone who wears the theatre masks inside the castle can step into the paintings and join the story."],"0-13":["Lightning flashes over the castle during a storm, and the lights go out in the middle of a school sleepover.","A bolt of lightning strikes the castle and wakes up every sleeping suit of armour inside."],"0-14":["A hungry boy picks an apple from the castle orchard, and the friendly gardener lets him take two more.","The castle is made from one gigantic apple, and a curious worm tunnels in to find the throne room."],"0-15":["A tour guide unlocks a heavy door in the castle that has stayed shut since the museum first opened.","A tiny door appears in the castle wall, and behind it waits a room full of floating candles."],"0-16":["A girl uses a compass to find her way through the castle maze before her class leaves on the coach.","The compass needle spins wildly and points to a castle that only appears when the moon is full."],"0-17":["A boy hides a birthday gift inside the castle so his friend can find it on a treasure hunt.","A mysterious gift arrives at the castle all by itself, wrapped in ribbons that whisper secrets."],"0-18":["The clock on the castle tower is stuck at noon, so a repairer climbs up to fix it before the festival.","When the clock strikes thirteen, the castle slowly turns upside down and the hero must hold on tight."],"0-19":["A huge tree beside the castle gives shade to families having a picnic on a very hot afternoon.","A tree grows through the castle roof overnight, and its branches carry doors to other worlds."],"0-20":["A turtle crawls slowly across the castle lawn while a crowd waits to see if it can reach the pond.","The turtle carries a whole castle on its shell and strolls across the sea at sunrise."],"0-21":["At a magic show in a castle hall, a performer loses her magic wand and the audience helps search.","One flick of the magic wand turns the crumbling castle into a gleaming palace made of ice cream."],"0-22":["The bell in the castle tower rings at noon, and every pigeon on the roof flies off at once.","Each time the bell rings, a new room appears inside the castle, and the hero must explore it."],"0-23":["Beautiful music drifts from the castle, so a boy follows each note to find a student orchestra practising.","Every music note floats out of the castle window and turns into a tiny glowing star."],"0-24":["A guide realises the crown on display at the castle is a copy and sets off to find the real one.","Whoever wears the crown becomes ruler of the castle, but the stone walls start to grumble and give orders."],"0-25":["A girl completes a jigsaw of the castle but discovers one puzzle piece is missing under the sofa.","Each puzzle piece is a room of the castle, and fitting them together rebuilds a long-lost kingdom."],"0-26":["In the castle fun-house, a boy loses his friends until he spots one mirror that shows the way out.","A mirror in the castle shows the hall as it was long ago, filled with dancing knights and lanterns."],"0-27":["A ferry takes the class across the bay to an island where an old castle waits for them.","The island is really a sleeping giant, and the castle on its back wobbles whenever the giant yawns."],"0-28":["A circus elephant parades past the castle gate and blocks the road, so a coach full of pupils must wait.","The elephant lifts the castle with its trunk and carries it to a quieter, sunnier land."],"0-29":["Archery students shoot at a target in the castle grounds while visitors cheer for every bullseye.","A glowing target appears on the castle wall, and whoever hits it unlocks a secret passage."],"0-30":["A boy flies a kite above the castle hill, and the string snags on the tallest tower.","A giant kite tugs the castle off the ground and drags it around the sky on a ribbon."],"0-31":["After a heavy storm, a rainbow stretches behind the castle, and a photographer rushes up the hill to capture it.","The rainbow forms a slide from the castle tower down to a treasure hidden in the valley."],"0-32":["A girl on a school trip tests a magnet on the old cannon at the castle and learns it is made of iron.","A giant magnet under the castle pulls every spoon and shield in the kingdom towards the cellar."],"0-33":["The power cuts out at the castle, so a guide hands each pupil a candle for the evening tour.","A single candle burns in the castle window, and its flame shows lost travellers the way home."],"0-34":["A courier pedals up the hill on a bicycle to deliver a letter to the castle before the gates close.","A bicycle with golden wheels rolls itself into the castle and invites the hero for a ride across the sky."],"0-35":["An owl nests in the castle tower, and a nature club waits quietly at dusk to see it fly out.","The wise old owl is the secret ruler of the castle and gives riddles to anyone who wants to enter."],"0-36":["A hawker sets up beside the castle and sells noodles to hungry tourists while a queue snakes around the moat.","The castle cook stirs a bowl of noodles so long that the strands wind around every tower."],"0-37":["Heavy rain forces a school trip to move indoors, so everyone shelters in the great hall of the castle.","The rain falls upwards around the castle, lifting silver drops into a glittering cloud."],"0-38":["A sailboat glides past the castle on the lake, and a girl sketches both for her art project.","A sailboat made of paper floats up to the castle window and invites the hero aboard."],"0-39":["The cellar of the castle is pitch dark, so a guide lends a pupil her torch to find the exit.","The beam of the torch reveals hidden writing on the castle walls that nobody could see before."],"0-40":["A tourist drags a heavy suitcase up the hill to the castle, only to find it closed for repairs.","Out of a tiny suitcase pops a whole castle, and its owner must squeeze it back in before bedtime."],"0-41":["At a stargazing night in the castle grounds, a girl points a telescope at a bright planet.","A lonely planet circles the sky with a castle on top, and its king invites children to tea."],"0-42":["At the aquarium, a toy castle in the tank hides an octopus that keeps squeezing out at night.","An octopus builds a castle from shells, using each arm to stack a different tower."],"0-43":["A circus tent pops up in the field beside the castle, and a boy sells tickets at the gate.","The castle shrinks to fit inside a circus tent, and the ringmaster introduces it as the smallest star of the show."],"0-44":["A guide shows pupils a copy of the diamond kept in the castle treasury and explains how it was cut.","A giant diamond sits at the heart of the castle, and its light splits into a hundred colours."],"0-45":["A girl tosses a coin into the castle fountain and wishes for a sunny day for the school picnic.","A single coin rolls into the castle and magically buys anything the hero asks for, except time."],"0-46":["A girl finds a teddy bear left behind at the castle and hands it in to the lost property desk.","At night the teddy bear comes alive and guards the castle with a very tiny trumpet."],"0-47":["A boy paddles a canoe round the castle moat while his friends race along the bank.","The canoe sails up the castle wall and flows through the windows like a river."],"0-48":["A sunflower grows taller than the castle gate, so the gardener measures it for the school science fair.","Every sunflower in the castle garden turns to follow the hero and whispers a secret as she passes."],"0-49":["A bee finds its way into the castle kitchen, and the cook guides it out with a wooden spoon.","A queen bee rules a castle made of honeycomb and welcomes any visitor who brings flowers."],"0-50":["A long hike up the mountain ends at a castle that offers hikers hot drinks and a splendid view.","The mountain opens like a door, revealing a castle full of snoring giants."],"0-51":["A telephone rings in the empty castle office, and a cleaner must work out who is calling.","A telephone in the castle tower connects to the past, and a knight on the line asks for help."],"0-52":["A visitor taps the reception bell at the castle hotel desk, but nobody comes out to help.","When the reception bell dings, a butler pops up through the castle floor and has never seen guests before."],"0-53":["A tourist loses a flip-flop while climbing the castle steps, and a guide helps to hunt for it.","A runaway flip-flop hops through the castle halls and leads the hero to a secret garden."],"1-2":["A girl drops a key in the dark, and the moon is her only light for finding it.","The moon has a keyhole in its side, and only a silver key found on the beach can open it."],"1-3":["A pupil in a dragon costume cannot leave the hall until someone finds the key to the locked door.","The dragon guards a golden key in its belly, and only a really funny joke will make it cough it up."],"1-4":["Launch day at science club is delayed because the key to the equipment cupboard with the rocket has vanished.","A tiny key starts the rocket, but it only flies to the place where the hero last felt happy."],"1-5":["A key hangs from the handle of a forgotten umbrella on the MRT, and the owner hurries back to find it.","The umbrella opens into a hundred keyholes, and each one leads to a different rainy world."],"1-6":["A little boy ties a key to a balloon so he will not lose it, but a gust carries both away.","A balloon floats up carrying a key, and wherever the key lands, a new door grows."],"1-7":["Smoke from burnt toast sets off the alarm, and the caretaker rushes to find the key to the fire exit.","A key made of fire can melt any lock, but it grows too hot for anyone greedy to hold."],"1-8":["A girl drops a key into the pond and watches a fish swim round it while she fetches a net.","The fish in the aquarium wears a key as a necklace and blinks twice whenever someone asks the right riddle."],"1-9":["A butterfly lands on a key on the picnic blanket, and the children freeze so they can take a photo.","Each butterfly wing is a tiny key, and together they open a garden gate to a hidden land."],"1-10":["At the volcano museum, a girl spots an ancient key behind the glass and wonders what it once unlocked.","The volcano has a keyhole in its side, and turning the key makes the lava stop and flowers bloom."],"1-11":["A key slips out from between the pages of a library book, and a girl wonders who left it there.","Only a key made of ink can unlock the book, and the story inside changes every time it opens."],"1-12":["Backstage, the drama teacher locks up the theatre masks, then cannot remember where she put the key.","Each of the theatre masks hides a key behind its smile, and the actor who finds all of them opens a door to another world."],"1-13":["A flash of lightning lights up a key in the grass, and a girl spots it on her way home.","When lightning hits the golden key, it wakes up and runs down the street on tiny legs."],"1-14":["A girl hides a spare key under the apple basket so her brother can get in after school.","Biting into the magic apple reveals a silver key at its core that opens the royal vault."],"1-15":["A girl arrives home and finds the door will not open because she has picked up the wrong key.","A key with no lock appears, and the hero walks around town until a door shimmers into view."],"1-16":["On a treasure hunt, the clue says the key lies north, so a team follows a compass across the school field.","The compass needle points to wherever the key wants to go, and the key is always in a hurry."],"1-17":["A boy finds a key taped to a gift, and a note says the real surprise is waiting in the garage.","The gift jumps about on its own until the hero turns a golden key in its tiny lock."],"1-18":["A repairer winds a key into the back of an old clock, and the whole shop starts ticking again.","Turning the key in the clock makes time run backwards, so breakfast comes after bedtime."],"1-19":["A girl climbs a tree to rescue a key that the wind has blown onto a high branch.","Every leaf on the tree is a key, and each one opens a different door in the forest."],"1-20":["A turtle at the pet shop sits on a key, and the shopkeeper has to wait for it to move.","The turtle has carried a key on its shell for a hundred years and slowly plods towards the lock it fits."],"1-21":["Before his show, a magician searches his bag for the magic wand and finds only a car key.","The magic wand turns into a key and unlocks any door the hero draws in the air."],"1-22":["The caretaker cannot ring the bell for recess because the key to the cupboard has gone missing.","Ringing the bell makes a golden key rise out of the ground and float to the nearest locked door."],"1-23":["A boy plays the piano and one note sounds odd, because a house key has fallen inside.","Every time a music note floats out of the music box, a golden key appears in the air."],"1-24":["A girl making a paper crown for the school play hides the key to the props cupboard inside it, then forgets where.","Only the crown can open the king's key chest, and it chooses the kindest child to wear it."],"1-25":["A girl finishes a puzzle and finds the last puzzle piece, shaped just like a key, hidden in the box lid.","The key fits perfectly into the last gap of the puzzle, and the whole picture comes alive."],"1-26":["A mirror in the hallway shows a girl that she has left her key on the kitchen table.","A key slips through the mirror, and the hero must follow it into a backwards world."],"1-27":["On a camp treasure hunt, children paddle out to a small island to find a hidden key and a clue.","The island floats away whenever someone uses the key, and the hero must jump aboard in time."],"1-28":["A zookeeper searches the elephant yard because the key to the feed store has fallen into the straw.","The elephant remembers where every lost key has gone and sniffs one out for the hero."],"1-29":["A boy hangs his locker key on the target at archery club to keep it safe, then forgets where he put it.","Hitting the exact centre of the target makes a giant key rise from the ground."],"1-30":["A girl ties her house key to the kite string as a weight, and the wind lifts it above the playground.","A kite dangles a golden key in the sky, and the hero must climb the clouds to reach it."],"1-31":["A bright rainbow lights up a shiny key in a puddle, and a boy scoops it out to find a luggage tag.","Where the rainbow touches the ground, a golden key waits for whoever walks all the way to the end."],"1-32":["A boy uses a magnet on a string to fish a key out of a drain.","A giant magnet in the sky pulls every key in town towards it, and the hero must stop it by bedtime."],"1-33":["During a power cut, a girl searches for her key under the sofa by the light of a single candle.","The flame of the candle bends towards a keyhole in the air that only the hero can see."],"1-34":["A boy realises his bicycle lock key is missing, so he walks home and retraces every step.","The bicycle only moves when a golden key turns in its pedal, and then it can ride across the sea."],"1-35":["A girl hears an owl hooting at dusk and suddenly remembers she left her key on the park bench.","An owl delivers a rusty key to one child's window every full moon, along with a riddle."],"1-36":["A hawker loses the stall key and finally finds it in a pot beside the noodles.","The noodles twist themselves into the shape of a key and open a secret room at the back of the kopitiam."],"1-37":["The rain begins, and a girl fumbles for her key outside the flat, soaked and in a hurry.","Each drop of rain turns into a tiny silver key when it touches the roof."],"1-38":["A boy drops a key off the sailboat and marks the spot with a buoy so a diver can look for it.","The mast of the sailboat is a giant key that unlocks the sea gates at the edge of the world."],"1-39":["A girl shines a torch under the bed and finds the key her brother has been hunting for all week.","The beam of the torch makes a hidden keyhole glow on a blank wall."],"1-40":["A traveller cannot open her suitcase at the airport because the key is in the pocket of her other coat.","Inside the suitcase lies a key that opens a door in any city its owner can imagine."],"1-41":["A boy buys a key ring shaped like a planet at the museum shop and hangs his house key on it.","A faraway planet has a keyhole in its middle, and a rocket must carry the key there."],"1-42":["At the aquarium, a clever octopus slips the keeper's key into its den, and she has to coax it out with a treat.","The octopus holds eight keys, one in each arm, and each one opens a door in the deep sea."],"1-43":["A juggler cannot open the prop trunk inside the circus tent because he has dropped the key.","A key opens a tiny door in the circus tent pole, and behind it is a secret second circus."],"1-44":["A jeweller locks a diamond in the shop safe, then realises she has dropped the key in the street.","The diamond turns into a key at midnight and opens a door in a sparkling cave."],"1-45":["A boy digs for a coin in his pocket for the locker and pulls out his lost key instead.","A magic coin spins on the table and lands as a key whenever the hero flips it."],"1-46":["A girl sews a pocket into her teddy bear to hide the key to her diary.","The teddy bear unzips its tummy and shows a golden key that unlocks a toy-box kingdom."],"1-47":["A girl keeps the key to the camp storeroom in her pocket while paddling a canoe, and it nearly slips into the river.","The canoe has a keyhole on its bow, and turning the key makes it glide across the clouds."],"1-48":["A girl hides a spare key under the pot of a sunflower on the balcony, and a gust knocks it over.","The heart of the sunflower is a golden key that grows larger each morning at sunrise."],"1-49":["A bee lands on the key as the beekeeper opens the shed, and he waits patiently for it to fly away.","A bee carries a tiny key to the queen, and the whole hive hums with excitement."],"1-50":["A hiker finds an old key near the mountain trail and hands it in to the park ranger.","A lock sits at the peak of the mountain, and the hero needs the key to let the sun rise."],"1-51":["A girl locked out of her flat uses a neighbour's telephone to call her mother, who has the spare key.","A telephone rings inside a locked room, and the voice on the line says the hero is already holding the key."],"1-52":["A traveller taps the reception bell for a hotel key and waits while the clerk hurries from the back.","Tapping the reception bell makes a glowing key float down from the ceiling."],"1-53":["A boy ties his house key to his flip-flop so he never loses it, then leaves the flip-flop at the pool.","A magic flip-flop slaps the ground, and a key pops out whenever someone says please."],"2-3":["At the lantern festival, a boy dances in a dragon costume under the full moon while the crowd claps.","The dragon mistakes the moon for a pearl and flies up to catch it."],"2-4":["A science class launches a water rocket on the field at dusk while a pale moon rises overhead.","A rocket flies to the moon and finds moon-mice who invite the hero to dinner."],"2-5":["A girl holds an umbrella at the bus stop, and the moon peeks out as the clouds drift away.","The moon hides under an umbrella during the daytime so the sun cannot find it."],"2-6":["A balloon escapes from a party and floats up until it looks like a tiny second moon.","A boy ties a balloon to the moon and is pulled up above the rooftops."],"2-7":["Campers sit around a fire and tell stories while the moon climbs above the trees.","The moon catches a spark from the fire and glows red for one magical night."],"2-8":["A fish leaps in the pond, and its ripples break the reflection of the moon into silver pieces.","A fish swims up out of the sea and nibbles at the moon, which shrinks night after night."],"2-9":["A butterfly rests on the window at night, and a child sketches it by the light of the moon.","A butterfly with moon-white wings only appears at midnight and leads lost children home."],"2-10":["A class compares a model volcano with photos of craters on the moon to see how they differ.","The volcano erupts silver dust that sticks to the moon and makes it shine brighter."],"2-11":["A girl reads a book by the light of the moon because the lamp in her room has stopped working.","A book about the moon falls open, and a tiny moon rises from its pages."],"2-12":["Before the school drama show, a boy practises in his theatre masks while the moon shines on the empty stage.","When the moon shines through the theatre masks, they begin to sing a lullaby of their own."],"2-13":["Lightning flashes across the sky, lighting up the pale face of the moon for a split second.","The moon gets cross and flings a bolt of lightning at the clouds to make them move."],"2-14":["A girl cuts an apple in half and notices the seeds form a shape like a crescent moon.","The moon takes a crescent-shaped bite out of every apple in the orchard."],"2-15":["A boy peeks through the door at night and sees the moon so bright that he thinks the light is on.","A silver door appears on the moon, and the hero knocks three times to see who answers."],"2-16":["Campers use a compass and the moon to find their way back to the tent after a night walk.","The compass needle points to the moon instead of north, and the hero must follow it."],"2-17":["On Mid-Autumn night, a boy gives his friend a gift as they watch the full moon together.","A gift falls from the moon each night, and every morning it holds a different surprise."],"2-18":["A girl stays up past bedtime and watches the clock tick towards midnight as the moon rises.","The moon is a giant clock face, and when its hands reach twelve, the stars start dancing."],"2-19":["Lying under a tall tree, a boy counts how the moon moves behind its branches.","The moon gets tangled in the branches of the tree, and the hero must climb up to free it."],"2-20":["On the beach at night, a baby turtle crawls towards the sea, guided by the glow of the moon.","A turtle with a moon painted on its shell takes children for rides across the night sky."],"2-21":["A boy waves a magic wand at the night sky during his birthday party, pretending to make the moon grow.","With one swish of the magic wand, the moon turns into a glowing orange."],"2-22":["A night cyclist rings her bell on the quiet road as the moon lights the way.","Each time the bell rings, the moon changes shape: crescent, half, full, then a smiling face."],"2-23":["A pupil composes a song about the moon and writes each music note on the staff before bed.","Every music note the hero plays on the flute climbs up to the moon, which hums along."],"2-24":["In the school play, a girl wears a crown decorated with a silver moon and forgets her first line.","The moon wears a crown of stars, and one night the crown goes missing and the hero must find it."],"2-25":["A boy finishes a night-sky jigsaw but finds one puzzle piece missing from the moon.","A puzzle piece falls from the moon, and when matched with others, it forms a map of the stars."],"2-26":["A girl holds a mirror up to the window and catches the moon in it.","The mirror shows a second moon above a world where everything is upside down."],"2-27":["A ferry carries families to an island at night so they can watch the moon rise over the water.","The island floats up to the moon whenever the tide is high."],"2-28":["At the night safari, a keeper points out an elephant lit by the soft glow of the moon.","An elephant flaps its enormous ears and flies up to sit on the moon."],"2-29":["A pupil in the astronomy club uses the moon as a target to practise aiming a telescope.","A glowing target appears on the moon, and any paper plane that hits it wins a wish."],"2-30":["A boy flies his kite at the beach as the moon rises above the water.","A kite flies so high that it hooks the moon, and the hero must reel it back down."],"2-31":["After a rainy night, a boy sees a faint rainbow around the moon and tells everyone at school.","The moon paints a rainbow in silver at midnight, and the colours vanish when the sun wakes."],"2-32":["A magnet on the fridge holds up a drawing of the moon, and a little sister adds stars.","A giant magnet inside the moon pulls the ocean tides up and down."],"2-33":["When the lights go out, a girl lights a candle and sees the moon through the window.","A candle burns on the moon, and its tiny flame is the reason the stars sparkle."],"2-34":["A boy rides his bicycle home along the park connector as the moon follows above the trees.","A bicycle pedals up a moonbeam and lands on the moon, where the hero is welcomed."],"2-35":["At dusk, an owl hoots from the tree outside the window as the moon climbs into view.","An owl polishes the moon every night with its wing so it never gets dusty."],"2-36":["A hawker closes up late and eats a bowl of noodles under the moon, tired but happy.","The moon dips into a giant bowl of noodles, and the stars are the sesame seeds."],"2-37":["A girl waits for the rain to stop so she can see the moon on the lantern walk.","Raindrops catch the moon and carry tiny silver reflections down to the pavement."],"2-38":["A sailboat drifts across the bay at night, steered by the glow of the moon.","The moon turns into a sailboat and sails past every star, with the sky as its sail."],"2-39":["On a night walk, a boy switches off his torch to see how bright the moon really is.","A magic torch can switch the moon on and off, and one night the hero flicks it by mistake."],"2-40":["Before a night flight, a girl packs her suitcase while the moon rises over the runway.","The hero packs the moon in a suitcase to take it on holiday, and the night sky goes dark."],"2-41":["A girl uses a telescope to find a bright planet near the moon.","The moon and a planet swap places for a day, and nobody on Earth can tell."],"2-42":["A girl visits the aquarium after dark, where moonlight from the skylight makes the octopus swirl its arms in a slow dance.","The octopus stretches eight long arms out of the sea to hang the moon back in the sky after it slips into the waves."],"2-43":["Under a bright moon, the circus tent glows silver as the performers sneak out for one last rehearsal before the big show.","The moon lands on top of the circus tent like a giant spotlight and decides to join the show as the star act."],"2-44":["A jeweller holds a small diamond up in the moonlight to check that it really sparkles before selling it to a customer.","When the moon loses its shine, a hero climbs a ladder of stars to replace it with a giant diamond."],"2-45":["A girl tosses a coin into the fountain and makes a wish on the moon reflected in the water.","A cheeky boy tries to buy the moon with a single coin, and it laughs so hard that it wobbles across the sky."],"2-46":["A little boy cannot sleep, so he cuddles his teddy bear by the window and counts the craters on the moon.","At midnight the moon winks down, and the teddy bear springs to life and hops onto a moonbeam for an adventure."],"2-47":["Campers paddle a canoe across a still lake at night, guided only by the glow of the full moon.","A canoe floats up from the lake on a silver moonbeam and sails through the sky until it bumps into the moon."],"2-48":["A girl waters the sunflower at dusk and wonders why it droops once the moon replaces the sun.","The sunflower misses the sun so much that it grows tall enough to tickle the moon and borrow a little light."],"2-49":["A lost bee stays out after dark and follows the glow of the moon until it finds its way back to the hive.","The queen sends one brave bee to the moon, because moon honey is said to make anyone who tastes it float."],"2-50":["Hikers set out before dawn to climb the mountain so they can watch the moon sink behind its peak.","The moon gets stuck on the tip of the mountain, and a clever hero must free it before the tides forget how to move."],"2-51":["A boy talks to his cousin overseas on the telephone, and they discover they are both looking at the same moon.","The old telephone rings in the middle of the night, and a voice on the line says it is calling from the moon."],"2-52":["Late at night, under a bright moon, a tired traveller taps the reception bell because nobody is waiting at the hotel desk.","Every time someone taps the reception bell, the moon blinks open one eye and sends a wish drifting down."],"2-53":["After a late walk along the beach, a girl finds that one flip-flop has gone missing, so she searches by the light of the moon.","A flip-flop kicked off at the beach bounces all the way to the moon and leaves a footprint nobody can explain."],"3-4":["At the science fair, a boy launches a toy rocket that lands inside the papier-mache dragon his classmate has built.","A dragon with a sore throat straps itself to a rocket and blasts off to find a cold, icy planet."],"3-5":["When the monsoon starts during the Chinese New Year parade, a dancer inside the dragon costume ducks under a big umbrella.","A tired young dragon opens an umbrella and uses it as a parachute to drift gently down from the cliffs."],"3-6":["At a party, a clown twists a dragon-shaped balloon, and it slips from a child's hand and floats away over the playground.","A dragon who is afraid of heights hides inside a huge balloon and accidentally floats up above the town."],"3-7":["The stage crew uses a fan and red silk ribbons to make the dragon in the school play look as if it breathes fire.","The dragon has lost its fire, so it must travel to a hidden cave to relight its breath before winter comes."],"3-8":["At the park pond, a girl feeds the fish beneath a stone dragon statue that seems to watch her.","A hungry dragon catches a fish that begs to be set free by promising to grant three wishes."],"3-9":["On a school trip, a butterfly lands on the head of a girl dressed as a dragon for the class parade.","A huge dragon runs in circles because a tiny butterfly keeps landing on its nose and tickling it."],"3-10":["For a science project, a boy builds a model volcano that fizzes with baking soda and places a clay dragon on its peak.","A dragon sleeps deep inside the volcano, and every time it snores, a puff of smoke rises from the top."],"3-11":["A boy borrows a library book about a dragon and finds a handwritten note tucked between the pages.","When a girl opens the book, a tiny dragon hops off the page and refuses to go back in."],"3-12":["In drama club, a girl wears one of the theatre masks to play a dragon but forgets all her lines.","Wanting to look friendly, the dragon borrows the smiling one of the theatre masks before it visits the village."],"3-13":["During a thunderstorm, a boy hides under his blanket and imagines that each flash of lightning is a dragon crossing the sky.","A dragon catches a bolt of lightning in a jar and uses it to light up its dark cave."],"3-14":["A teacher dressed as a dragon for Book Week hands a shiny apple to every child who answers a question correctly.","A dragon guards the only tree of golden apples, and a clever girl must trick it to take just one."],"3-15":["A boy finds a dragon painted on the door of the old school storeroom and decides to find out what is behind it.","A small door in the side of the mountain opens only when a dragon sneezes."],"3-16":["On a treasure hunt, children follow a compass to find a dragon drawn in chalk on the pavement.","The dragon owns an enchanted compass that points to whatever it wants most, and today it points to the nearest hawker centre."],"3-17":["A girl wraps a gift shaped like a dragon for her brother's birthday and hides it at the back of the wardrobe.","A friendly dragon leaves a gift on every doorstep at night, but one box is far too hot to hold."],"3-18":["At the science museum, a boy waits for a mechanical dragon to pop out of the giant clock on the hour.","The dragon swallows the town clock, and now time ticks and tocks inside its tummy."],"3-19":["A child climbs the old tree in the park, where someone has carved a small dragon into the trunk.","A shy dragon hides behind the tallest tree in the forest, pretending to be a leafy green bush."],"3-20":["On sports day, a boy in a dragon costume loses the race to a girl dressed as a turtle, who says slow and steady wins.","A turtle carries a tired dragon across the swamp and asks for one warm, fiery favour in return."],"3-21":["At a fancy-dress party, a child in a dragon costume finds a toy magic wand and waves it to make everyone laugh.","The dragon steals a magic wand and turns every pair of shoes in the village into jelly."],"3-22":["During the dragon dance, the leader rings a bell to tell the team when to leap and spin.","A sleepy dragon wakes whenever the village bell rings, and everyone wonders what it will do next."],"3-23":["The dragon dance team practises by reading every music note off a sheet before the big parade.","Whenever the dragon hums a high music note, flowers burst into bloom all over the hillside."],"3-24":["A girl making a dragon costume sticks a gold crown on its head so that it looks like a king.","A dragon finds a crown in a cave and discovers that wearing it lets it speak every language."],"3-25":["A boy finishes a huge jigsaw of a dragon, but the last puzzle piece is missing, chewed up by the puppy.","Each puzzle piece of the treasure map is guarded by a dragon, and the final piece lies under its tail."],"3-26":["A girl tries on her dragon mask in front of the mirror and practises her fiercest roar.","When the dragon peers into the magic mirror, it sees a tiny kitten and wonders who it really is."],"3-27":["A family takes a ferry to an island park where a giant dragon slide is the biggest attraction.","A dragon lives alone on a tiny island and sends message bottles out to sea, hoping to make a friend."],"3-28":["At the night fair, a boy cannot choose between a dragon lantern and a toy elephant, so he saves up for both.","A dragon and an elephant hold a contest to see whose roar is louder, and the whole jungle covers its ears."],"3-29":["At archery camp, a boy paints a green dragon on the target to make practice more fun.","A dragon draws a target on a cliff and practises breathing fire until it hits the bullseye every single time."],"3-30":["At the park, a girl flies a long dragon kite that twists and swirls above the field.","A kite gets tangled in the horns of a dragon, and it carries the surprised beast across the sky."],"3-31":["After a monsoon shower, a rainbow arches over the playground where the children are practising their dragon dance.","Each morning a dragon paints the rainbow with its breath, but today the colours are all muddled."],"3-32":["A boy's toy dragon is made of metal parts, so he uses a magnet to pick up the pieces he has dropped.","A magnet buried in the dragon's cave pulls every spoon and key in the village towards it."],"3-33":["During a power cut, a girl lights a candle and makes the shadow of a dragon on the wall with her hands.","The dragon has a cold and cannot spark, so it needs a candle to light its fire."],"3-34":["A boy wobbles along on his bicycle in a dragon costume, heading for the parade and waving to the neighbours.","A dragon learns to ride a bicycle, but its long tail keeps getting wrapped in the spokes."],"3-35":["In drama class, a girl plays an owl and a boy plays a dragon, and together they must make up a story.","A wise owl teaches a shy dragon how to roar by practising in an echoing cave."],"3-36":["At a hawker centre, a girl slurps her noodles beneath a dragon painting on the wall and wonders who painted it.","A hungry dragon steals a hawker's noodles, but the steam makes it puff out bubbles instead of flames."],"3-37":["The dragon dance rehearsal moves indoors when heavy rain starts to pour onto the school field.","Every drop of rain is a tear from a dragon crying on a cloud because it has lost its best friend."],"3-38":["A boy paints a dragon on the sail of his model sailboat and races it across the pond.","A sailboat is stuck far out at sea until a friendly dragon blows it home with one gentle puff."],"3-39":["On a camping trip, a boy uses a torch to read a story about a dragon inside his tent.","A dragon is afraid of the dark, so a small girl lends it her torch to explore the cave."],"3-40":["A girl packs her toy dragon at the top of her suitcase so she can hug it as soon as the plane lands.","A dragon shrinks to fit inside a suitcase and secretly travels to a faraway city to watch the fireworks."],"3-41":["On her science poster, a girl paints a dragon curled around an invented planet to win the creativity prize.","A lonely dragon guards a tiny planet made entirely of gold and longs for a visitor."],"3-42":["At the aquarium, a boy tells his sister that the octopus looks like a dragon with eight arms.","A dragon and an octopus swap bodies for a day, and the dragon cannot stop squirting ink."],"3-43":["A girl spots a dragon painted on the circus tent and begs her mum to buy tickets for the show.","A dragon joins the circus tent as the star act, juggling hoops of sparkles instead of flames."],"3-44":["A boy mistakes a shiny sticker on a dragon toy for a real diamond and tells his friends he is rich.","After a dragon swallows a huge diamond, its hiccups sparkle in the dark."],"3-45":["A boy drops every coin he saves into a dragon-shaped piggy bank until he can afford a present for his mum.","A dragon collects only one coin each year, and the oldest coin in its hoard can grant a wish."],"3-46":["A teddy bear falls from a girl's arms at the parade and ends up riding along on the dragon float.","A brave teddy bear tames a fierce dragon by offering it a big warm hug."],"3-47":["A boy paddles his canoe beside a dragon boat team and tries to keep up with their drumbeat.","A dragon rises from the river and asks a startled paddler in a canoe to carry it to the other bank."],"3-48":["A boy grows a sunflower beside his dragon drawing on the garden wall and tells everyone it is the dragon's snack.","A sunflower follows the flames of a flying dragon all day, mistaking them for a second sun."],"3-49":["A girl in a dragon costume runs away from a buzzing bee at the school picnic.","A bee builds its hive inside a sleeping dragon's ear, and the buzzing gives the dragon the funniest dreams."],"3-50":["On a hike, a boy imagines that the long ridge of the mountain is the sleeping back of a dragon.","Feeling homesick, the dragon flies away with a whole mountain on its back to make a new home."],"3-51":["A girl calls her friend on the telephone to ask her to bring the dragon costume to rehearsal.","A telephone rings inside the dragon's cave, and the dragon answers and orders a hundred bowls of soup."],"3-52":["In the hotel lobby, a boy in a dragon costume taps the reception bell and politely asks for room service.","A dragon taps the reception bell at a grand hotel for knights, hoping to book a room with a fireplace."],"3-53":["A boy loses a flip-flop in the middle of the dragon parade and has to hop along on one foot.","A tiny dragon mistakes a giant flip-flop for a boat and paddles it across the pond."],"4-5":["At the science fair, a boy tests whether an umbrella can slow down his toy rocket as it drops back to the ground.","When its engine runs out of fuel, a rocket crew pops open a giant umbrella to glide home."],"4-6":["A girl lets go of a blown-up balloon to show her class how a rocket launches.","A hero ties a thousand balloons to a rocket so it can float up to the stars without any fuel."
