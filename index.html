],"4-7":["A boy watches a firework rocket shoot into the night sky and burst into glittering stars of fire.","The rocket runs out of power in space, so the hero tosses a ball of fire into the engine to restart it."],"4-8":["A boy builds a rocket from a plastic bottle and launches it into the pond, startling the fish.","A fish in a bubble helmet pilots the rocket to find water on faraway planets."],"4-9":["A butterfly lands on the nose cone of a toy rocket just as a girl is about to launch it, so she waits.","A rocket carries a caterpillar into space, where it turns into a butterfly with glowing wings."],"4-10":["For the grand finale of the science show, a teacher launches a toy rocket from the crater of a model volcano.","A rocket crash-lands inside a sleepy volcano and wakes up everything living inside."],"4-11":["A girl reads a library book about space and builds a paper rocket by following its instructions.","A rocket lifts off from the middle of a book and carries the reader straight into the story."],"4-12":["For the class play, a boy builds a cardboard rocket and hands out theatre masks to the alien crew.","A rocket delivers a box of theatre masks to an alien planet where nobody has ever shown a feeling."],"4-13":["The model rocket launch is cancelled when lightning flashes on the horizon, so the whole class dashes indoors.","A rocket runs entirely on lightning, so its crew has to chase storms across the world."],"4-14":["A girl sets an apple on the launch pad as a pretend passenger and counts down for her toy rocket.","The rocket lands on a tiny planet made from one giant apple, and the crew sets off to find the worm."],"4-15":["A boy pins a drawing of a rocket on his bedroom door to show his family that he wants to be an astronaut.","A rocket crew finds a lonely door floating in space, and nobody can resist opening it."],"4-16":["At the launch field, a student checks a compass so that the model rocket points into the wind.","The rocket's compass spins in circles as it flies past the stars, because space has no north."],"4-17":["On his birthday, a boy unwraps a gift and finds the toy rocket he has wished for all year.","Someone has left a gift in the rocket's cargo bay, addressed to the very first person on Mars."],"4-18":["The class counts down on the clock for the water rocket launch at exactly noon.","The rocket flies so fast that the clock runs backwards, and the crew arrives before they set off."],"4-19":["A toy rocket gets stuck in the branches of a tree, and a girl must work out how to bring it down.","A tree grows so tall that its top brushes a passing rocket, and a family of squirrels hitches a ride."],"4-20":["For a poster about speed, a girl compares her rocket with her very slow pet turtle.","A turtle straps on a rocket to win the great race and zooms past the hare."],"4-21":["At a fancy-dress party, a girl swaps her magic wand for a cardboard rocket after changing her mind about being a wizard.","A wizard waves a magic wand and turns a rubbish bin into a rocket that smells of banana peel."],"4-22":["When the rocket countdown begins at the space museum, a bell rings to tell visitors to find their seats.","A tiny silver bell starts the rocket whenever it is rung, but the crew keeps ringing it by accident."],"4-23":["A composer writes each music note for a film about a rocket launch, tapping the beat on the desk.","Every music note the crew sings becomes fuel, so the rocket flies only when everybody joins in."],"4-24":["At a school pageant, a boy wearing a crown steps out of a cardboard rocket to play a king visiting the moon.","A rocket carries a crown to a distant planet to crown its very first alien king."],"4-25":["A family builds a jigsaw of a rocket on a rainy afternoon, but the last puzzle piece is missing.","To blast off, the crew must solve a giant puzzle whose final piece is hidden on the rocket's tail."],"4-26":["A girl stands in front of the mirror in her astronaut costume, practising a speech about the rocket launch.","A rocket lands in front of a magic mirror, and the crew steps through to find an upside-down world."],"4-27":["The rocket launch site sits on a remote island, and a boy travels there to watch the countdown with his family.","A rocket crash-lands on an island, and the crew builds a new home out of its shiny metal pieces."],"4-28":["A girl dresses her toy elephant as an astronaut and sends it skyward in a rocket made from a cardboard box.","An elephant squeezes into a rocket and uses its trunk to press the launch button."],"4-29":["At a launch competition, each team's rocket must land as close as possible to a target painted on the field.","A rocket pilot tries to hit a target painted on a distant planet, but a naughty comet keeps nudging it away."],"4-30":["A boy launches his rocket and flies his kite on the same windy day to see which one climbs higher.","A kite tied to the tail of a rocket pulls a hero through the clouds like a magical sleigh."],"4-31":["A girl's water rocket sprays a mist that makes a small rainbow in the afternoon sunshine.","A rocket zooms up a rainbow as if it were a road leading to the end of the sky."],"4-32":["At a science workshop, a boy uses a magnet to pick up the metal pieces of his model rocket from the grass.","A giant magnet on a nearby planet pulls the rocket sideways, and the crew must find a way to switch it off."],"4-33":["During a power cut, a girl lights a candle and reads aloud about the first rocket that reached space.","The crew's only light is a candle, and its flame grows wild whenever the rocket speeds up."],"4-34":["A boy cycles on his bicycle to the park every Saturday morning to launch his model rocket.","A girl's bicycle grows a rocket booster and zooms off the end of the cycling path and up into the clouds."],"4-35":["A night-time launch by the rocket club startles an owl out of the old tree beside the field.","An owl is the wisest pilot ever and steers the rocket through the stars while everyone else sleeps."],"4-36":["Hungry after the rocket launch, a class of children eats noodles together at the nearest hawker centre.","The rocket runs on noodle soup, so the crew has to stop at every planet's food stall."],"4-37":["The school rocket launch is postponed when heavy rain soaks the field and the launch pad.","A rocket flies through a cloud and brings back a bucket of rain for a thirsty desert planet."],"4-38":["A boy fixes a small rocket to his model sailboat to make it zoom across the pond.","A rocket tows a sailboat across the night sky to carry a nervous sailor to the moon."],"4-39":["On a camping night, a boy uses a torch to read the instructions for building his rocket.","The rocket loses all its lights in space, so a little robot shines a torch to guide it home."],"4-40":["A boy packs a suitcase for space camp and squeezes in his toy rocket at the very last minute.","A suitcase is secretly a rocket, and when its owner clicks the latches it blasts off."],"4-41":["A class makes a big poster showing a rocket flying to each planet in the solar system.","The rocket lands on a strange planet where the mountains, rivers and trees are all made of jelly."],"4-42":["At the aquarium shop, a girl holds a toy octopus in one hand and a toy rocket in the other and cannot decide which to buy.","An octopus uses all eight arms to press buttons and steer a rocket across an ocean of stars."],"4-43":["A boy fires his toy rocket from the car park, and it lands right on top of the circus tent.","The circus tent lifts off like a rocket, with the ringmaster and the clowns still inside."],"4-44":["A teacher holds up a diamond and explains that a rocket can carry diamond-tipped drills to dig up rocks in space.","The rocket crew discovers a diamond as big as a house and must work out how to bring it home."],"4-45":["A boy flips a coin to decide whether to build a rocket or a kite for the class contest.","The rocket starts only when a coin drops into its slot, so the crew empties their piggy banks."],"4-46":["A girl takes her teddy bear to the rocket museum and lifts it up to see the huge engines.","A brave teddy bear becomes the first bear to fly a rocket to the stars."],"4-47":["A rocket splashes down in the lake, and a girl paddles her canoe over to help the dizzy astronaut out.","A canoe is secretly a rocket, and when its owner paddles fast enough it lifts off the water."],"4-48":["A girl grows a sunflower as tall as her toy rocket for the school gardening contest.","A sunflower seed lands on a rocket and grows so fast that it blasts off, petals spinning like a propeller."],"4-49":["In the school play about space, a girl in a bee costume asks the rocket captain for a lift to the stars.","A bee builds a tiny rocket from a honey jar to collect nectar from the flowers on the moon."],"4-50":["A girl climbs a mountain with her dad to get a clear view of the rocket as it climbs into the evening sky.","A rocket lands on a mountain of cheese, and the crew must find out why it keeps shrinking."],"4-51":["A girl calls her grandad on the telephone to tell him that her class has launched a rocket.","A telephone on board the rocket rings from the stars, and the voice on the line knows the pilot's name."],"4-52":["At the space museum, a boy taps the reception bell to ask the staff to open the rocket display.","A rocket parks outside a hotel on Saturn, and the pilot taps the reception bell to check in."],"4-53":["A boy leaps up to cheer a rocket launch on TV and sends one flip-flop flying across the living room.","A rocket needs a spare heat shield, so the crew borrows a giant flip-flop from a friendly giant."],"5-6":["A girl holds her balloon under an umbrella so that the monsoon rain does not spoil the party decorations.","A boy clings to an umbrella with a balloon tied to it, and the wind carries him over the rooftops."],"5-7":["At a campsite, a girl holds an umbrella over the fire so that a sudden shower does not put it out.","A tiny fire spirit shelters under an umbrella, afraid of every single drop of rain."],"5-8":["A boy carries an umbrella to the wet market, where a seller teaches him how to pick the freshest fish.","It starts to rain fish, and a girl opens her umbrella to catch them as they flop in."],"5-9":["A butterfly lands on a girl's umbrella, and she stands very still, hoping it will stay.","A butterfly turns a plain umbrella into a rainbow of patterns with every flap of its wings."],"5-10":["On a school trip to a volcano, a boy opens his umbrella to shade himself from the blazing sun at the viewpoint.","A volcano erupts bubblegum, and a hero uses an umbrella to shield the town from sticky pink drops."],"5-11":["A girl reads her book under a beach umbrella so the sun does not glare on the pages.","Inside the umbrella is a hidden book, and every time it rains the pages fill with new stories."],"5-12":["After the drama show, the actors huddle under one umbrella with their theatre masks and wait for the bus.","A magic umbrella shows a laughing one of the theatre masks in sunshine and a crying one in storms."],"5-13":["A teacher tells everyone to close their umbrella and run indoors when lightning flashes over the field.","A girl opens her umbrella to catch a bolt of lightning and finds that it now glows like a lamp."],"5-14":["A girl shares her umbrella with a classmate who has forgotten his, and he thanks her with a crunchy apple.","An umbrella planted in the garden grows into a tree that drops apples instead of rain."],"5-15":["A boy waits under his umbrella outside the kopitiam door until the monsoon rain eases.","A hero jumps into a puddle holding an umbrella and finds a hidden door at the bottom."],"5-16":["Hikers hold an umbrella over their map while checking the compass in the drizzle.","A magic umbrella points its handle north like a compass, whichever way the wind blows."],"5-17":["A girl shelters a gift under her umbrella so that the rain does not ruin the wrapping on the way to a party.","A gift floats down from the sky beneath a tiny umbrella, with a tag saying it is for whoever finds it first."],"5-18":["On a rainy afternoon, a boy waits beneath his umbrella next to the clock tower for his mother to arrive.","A magic umbrella turns the clock back by one hour every time it is opened."],"5-19":["A gust of wind blows a girl's umbrella into the branches of a tree, and she must work out how to bring it down.","The tree is tired of getting wet, so it borrows an umbrella and wears it as a hat."],"5-20":["On a wet morning, a girl finds a turtle crossing the path and holds her umbrella over it until it reaches the pond.","A turtle opens an umbrella wide to catch the wind and sails over the treetops."],"5-21":["A girl uses her umbrella as a pretend magic wand while splashing through puddles on the way home.","A magician taps an umbrella with a magic wand, and it turns into a flying carpet."],"5-22":["When the bell rings at the end of school, the playground fills with umbrellas as pupils head out into the rain.","A tiny bell hangs from the tip of a magic umbrella, and whenever it rings, the storm stops."],"5-23":["A girl listens to the pitter-patter on her umbrella and writes down each music note to turn it into a song.","Every music note a hero sings hangs in the air like a raindrop, so she opens her umbrella to catch the whole song."],"5-24":["A boy keeps his paper crown dry under an umbrella at his birthday picnic when it begins to drizzle.","A crown blows off the king's head, and an umbrella floats after it like a parachute."],"5-25":["A girl finds a single puzzle piece under her umbrella at the bus stop and decides to find the person who dropped it.","Each panel of the umbrella is a puzzle piece, and it works only when all the pieces fit."],"5-26":["A girl checks her reflection in a shop mirror and sees that the wind has turned her umbrella inside out.","Whoever stands under the umbrella and looks into the mirror sees tomorrow's weather."],"5-27":["A family shelters under a beach umbrella on a tiny island while the afternoon storm passes.","A boy turns his umbrella upside down in a puddle that grows into a sea and sails it to a hidden island."],"5-28":["At the zoo, a girl holds up her umbrella to shade her little brother while they watch an elephant spray water.","An elephant carries a very small umbrella, and every jungle animal lines up to shelter underneath it."],"5-29":["Beside the archery range, a coach holds an umbrella over the paper target so that it stays dry in the drizzle.","A hero throws an umbrella like a boomerang, hits the target, and magically makes rain fall on the desert."],"5-30":["When the first drops fall, a girl hurries to bring in her kite and covers it with an umbrella.","A kite ties itself to an umbrella, and the two sail off together to find the end of the wind."],"5-31":["The sun comes out after a shower, and a girl lowers her umbrella to see a rainbow above the flats.","A girl opens an umbrella, and a rainbow pours out of it like a waterfall of colour."],"5-32":["A boy shows his science club that a magnet sticks to the metal ribs inside his umbrella.","A magnet in the handle of a magic umbrella pulls every raindrop back up into the clouds."],"5-33":["At an outdoor stall, the seller shields a candle with an umbrella to keep the wind from blowing it out.","A candle burns bravely under a tiny umbrella, and no storm in the world can put it out."],"5-34":["A boy parks his bicycle under the shelter and opens his umbrella to walk the rest of the way to school.","A hero pedals a bicycle so fast that an umbrella pops open above it and lifts it into the sky."],"5-35":["On a night walk, a girl spots an owl sitting on a fence and waits under her umbrella until it flies off.","An owl is the weather forecaster for the forest and hands an umbrella to every animal that listens."],"5-36":["A boy holds an umbrella over his bowl of noodles at an open-air stall when the monsoon begins.","An umbrella opens, and strands of noodles tumble down like rain while everyone runs out with bowls."],"5-37":["A boy opens an umbrella to walk his little sister home through the rain after school.","A magic umbrella stores every rain shower it catches and pours them onto dry gardens."],"5-38":["A boy shelters under an umbrella at the harbour while he waits for his dad's sailboat to return.","A girl uses an open umbrella as the sail of her sailboat, and the wind carries her to a secret sea."],"5-39":["During a monsoon blackout at the void deck, a girl holds an umbrella over her head and shines a torch to find the lift.","A hero opens the umbrella and finds the inside glowing like a night sky, lit by a tiny torch hidden in the handle."],"5-40":["Caught in a sudden downpour at the airport, a traveller shelters her suitcase under an umbrella to keep the presents inside dry.","The umbrella lifts a boy into the sky like a parachute while he clings to a suitcase that is secretly full of clouds."],"5-41":["At the science fair, a girl paints the planet Saturn on an old umbrella and spins it to show how it turns.","A tiny explorer lands on a planet where the rain falls upwards, so the only useful tool is an umbrella held upside down."],"5-42":["At the aquarium, a keeper shelters under an umbrella while an octopus squirts water from its tank over the glass.","An octopus borrows eight umbrellas, one for each arm, so it can finally go shopping on a rainy day."],"5-43":["A sudden storm sends the crowd scrambling into the circus tent, where a clown shares his big umbrella with a shivering child.","The circus tent is really a giant umbrella that opens whenever the ringmaster claps, covering the whole town."],"5-44":["A girl spots a diamond ring glittering in a puddle and hurries to hand it in, her umbrella dripping beside the counter.","Every raindrop landing on a magic umbrella freezes into a tiny diamond, and soon a boy is rich but soaked in sparkles."],"5-45":["A busker holds out his upturned umbrella on the street to catch coins from the passing shoppers.","Each coin dropped inside the umbrella makes it float a little higher, until its owner is carried above the rooftops."],"5-46":["Her teddy bear is left on the bus, so a girl runs through the rain with an umbrella to chase after it.","The teddy bear uses an umbrella as a parachute to leap off the shelf and escape before the toy shop closes."],"5-47":["When rain pours down on the lake, two campers prop an umbrella over their canoe and keep paddling towards the shore.","The old umbrella opens like a sail and sweeps a boy's canoe up from the river and across the clouds."],"5-48":["A boy props an umbrella beside a drooping sunflower in the school garden to shade it from the afternoon heat.","The giant sunflower opens like a living umbrella whenever rain falls, sheltering a family of tiny forest animals."],"5-49":["Rain sends a bee tumbling onto a girl's umbrella, so she carries it carefully to the flower bed to dry off.","A tiny bee unfolds a doll's umbrella and flies it like a helicopter to carry honey over the rooftops."],"5-50":["Hikers halfway up the mountain pop open an umbrella as mist and drizzle roll in from the valley.","The mountain is secretly a sleeping giant, and an umbrella tickling its nose makes it sneeze out a flurry of clouds."],"5-51":["Waiting under her umbrella, a girl hears the old telephone in the box beside the bus stop begin to ring.","A ringing telephone is hidden in the umbrella's handle, and the voice on the line is the weather itself."],"5-52":["Soaked by the monsoon, a guest shakes out her umbrella and taps the reception bell at the hotel desk.","Each time someone taps the reception bell, an umbrella pops out of the counter and floats up to shelter them."],"5-53":["Caught in monsoon rain, a boy tucks his umbrella under one arm and splashes home in his flip-flops.","A lost flip-flop sails down the drain like a boat while a girl chases it, holding her umbrella high like a flag."],"6-7":["Campers keep the balloon well away from the fire, but a gust tugs it closer and a girl dashes to grab the string.","The hero fills a balloon with warm air from a magical fire, and it rises gently over the treetops."],"6-8":["At the school carnival, a boy wins a fish in a plastic bag and a balloon as his consolation prize.","A fish floats out of its bowl inside a giant balloon and drifts over the town like a tiny airship."],"6-9":["A butterfly lands on a girl's balloon at the park, so she stands perfectly still to let it rest.","A butterfly swaps wings with a balloon, and the delighted balloon flutters away to visit all the flowers."],"6-10":["For the science fair, a boy stretches a balloon over the neck of his model volcano to catch the fizzing gas.","The volcano burps out a huge balloon carrying a message to the village below."],"6-11":["A librarian ties a balloon to the book of the week so that curious children can find the right shelf.","As the hero reads a book aloud, each word turns into a balloon that lifts the pages into the sky."],"6-12":["Before the school play, a girl blows up a balloon and paints a face on it to match her theatre masks.","The theatre masks laugh and cry so hard that a balloon grows from their breath and carries them off the stage."],"6-13":["Everyone at the fair rushes indoors as lightning flashes, leaving one lonely balloon drifting above the empty field.","A hero catches lightning inside a balloon, which glows like a giant lamp and lights up the whole night sky."],"6-14":["Pupils jump up to snatch an apple tied to a balloon string in a party game that gets very giggly.","An apple grows so round and light that it turns into a balloon and drifts away from the orchard."],"6-15":["A girl hangs a balloon on the door so her guests know which flat is hosting the party.","The balloon shrinks, slips through a tiny door in a tree trunk, and finds a village hidden inside."],"6-16":["The pilot of a hot-air balloon checks her compass to steer away from the dark storm clouds ahead.","A balloon follows a magic compass, whose needle points not north but towards whatever the hero wishes for most."],"6-17":["The guest of honour opens a gift and finds a deflated balloon with a note that says Blow me up.","A gift ticks and wobbles, then floats up like a balloon, with the surprise inside refusing to be caught."],"6-18":["Children watch the clock tick towards midnight, ready to release a balloon that carries all their New Year wishes.","Time stops when a magic balloon floats past the clock, freezing everyone except one curious boy."],"6-19":["A balloon string tangles in the branches of a tree, and a girl must find a clever way to rescue it.","In the enchanted forest, a tree grows balloons instead of fruit, and each one holds a different dream."],"6-20":["A turtle on the beach nibbles at a drifting balloon, so a girl runs over to scoop it away and keep the turtle safe.","A very slow turtle ties a balloon to its shell and, for once, wins the race by floating."],"6-21":["A party magician taps a balloon with his magic wand, and a shower of confetti bursts out.","One wave of the magic wand turns the balloon into a flying whale that carries the hero across the sea."],"6-22":["A bell jingles above the shop door as a boy walks in to buy a balloon for his little sister.","A balloon rings like a bell each time it bumps a cloud, and the whole town wakes up early."],"6-23":["In music class, a girl holds a balloon against a speaker and feels it buzz with every music note.","Each music note the hero sings becomes a balloon that floats up into the air and plays itself."],"6-24":["A boy wearing a paper crown at his birthday party chases after a balloon that is racing across the lawn.","A floating balloon puts on a crown and declares itself king of the sky, ordering the clouds to bow."],"6-25":["The very last puzzle piece lands on a balloon that floats up to the ceiling, so a girl fetches a ladder.","The balloon drifts to a gap in the clouds shaped like a puzzle piece, and snaps in to open a secret sky door."],"6-26":["A toddler sees the balloon reflected in the mirror at the party and giggles, thinking there are suddenly two.","Step through the mirror and every balloon on the other side is filled with laughter instead of air."],"6-27":["Passengers in a hot-air balloon gasp at the white beaches and green hills of the island below.","The island floats up from the sea tied to a giant balloon, carrying its palm trees and a stranded boy along."],"6-28":["A child waves a balloon at the zoo, and an elephant curiously stretches its trunk towards the bobbing string.","Convinced that elephants can fly, one ties a thousand balloons to its back and lifts off above the jungle."],"6-29":["At the fairground, a boy throws a ball at a target to pop a balloon and win a prize.","A runaway target hops across the fairground, always keeping a balloon dangling from its middle like a lollipop."],"6-30":["At the beach, a girl ties a balloon to her kite string to see how high the wind will carry it.","A kite and a balloon race across the sky, each bragging that it is the better flyer, until a storm joins in."],"6-31":["After the storm, children let go of a balloon each and watch them float towards the rainbow.","A balloon bounces along the rainbow as if it were a slide, leaving every colour smeared across the clouds."],"6-32":["In a science lesson, the teacher shows that a rubbed balloon sticks to the wall, while a magnet only picks up metal.","A giant magnet in the sky pulls every balloon in the city upwards, and the townsfolk float after them."],"6-33":["At her birthday party, a girl keeps the balloon well away from the candle while she makes a wish.","A balloon glows from within with a candle and floats over the sea as a lantern for lost sailors."],"6-34":["A boy cycles home with a balloon tied to the handlebar of his bicycle, hoping it survives the bumpy ride.","A bicycle sprouts a balloon on each wheel and pedals itself up into the clouds."],"6-35":["At the night safari, a balloon slips loose and an owl swoops down for a curious look.","A wise owl hires a balloon as a taxi to carry her over the hills to the Midnight Library."],"6-36":["To attract hungry children, a hawker blows up a balloon and ties it above his noodles stall.","A balloon filled with steaming noodles floats over the city, dripping dinner onto the surprised rooftops."],"6-37":["A sudden rain shower soaks the party, and a girl rushes the balloon indoors before it slips from her hand.","The sad rain cloud cries into a balloon until it grows so heavy that it sinks and splashes the whole town."],"6-38":["A girl ties a balloon to her sailboat so her family can spot it from the shore.","A balloon swaps places with the sail of a sailboat and carries the crew across the sky instead of the sea."],"6-39":["In the dark void deck, a boy shines a torch on the balloon to make giant shadows for his little brother.","A torch beam turns the balloon into a glowing moon that floats up and lights the sleepy village."],"6-40":["A girl packs a balloon in her suitcase for her cousin's surprise party overseas.","The suitcase is so full of air that it lifts off like a balloon, and its owner must hang on."],"6-41":["A teacher paints a balloon to look like a planet and hangs it from the ceiling for the space lesson.","A hero rides a balloon past the stars to a planet where everything is round and bouncy."],"6-42":["A clown twists a long balloon into an octopus for a girl waiting in line at the party.","An octopus puffs itself up like a balloon and bobs to the surface to watch the sunrise."],"6-43":["Outside the circus tent, a clown twists a balloon into a dog for the children waiting in the queue.","Hundreds of balloons lift the circus tent off the ground, and it floats to the next town on its own."],"6-44":["In a treasure hunt, a boy finds a plastic diamond hidden inside a balloon and pops it with a cheer.","When the magic balloon pops, it showers the hero with diamonds that sparkle like stars."],"6-45":["At the arcade, a boy swaps his last coin for a balloon from the prize counter.","A talking coin begs a balloon to carry it away from the dusty piggy bank."],"6-46":["A toddler ties a balloon to a teddy bear's paw so it will not get lost at the busy park.","At night, the teddy bear hugs a balloon and drifts out of the window to visit the moon."],"6-47":["At the lake, a boy ties a balloon to the front of the canoe so the other campers can follow him.","A canoe fills with balloons until it lifts off the river and paddles through the clouds."],"6-48":["A girl hangs a yellow balloon beside the tallest sunflower to measure how much it grows each week.","The sunflower grows taller each time it hears laughter, until it floats up like a balloon, dragging its roots."],"6-49":["A bee buzzes round a balloon at the picnic, and a girl stays calm until it flies away.","A busy bee builds a hive inside a giant balloon and sells honey to the birds that pass."],"6-50":["A hot-air balloon glides past the mountain at sunrise, giving the passengers a view of the sleepy valley.","A hero ties a balloon to a mountain, hoping to lift it aside so the village can finally see the sun."],"6-51":["A girl picks up the telephone to order a balloon bouquet for her grandmother's birthday.","A balloon drifts past the window and speaks into the telephone, delivering a message from the clouds."],"6-52":["A hotel clerk taps the reception bell and hands a balloon to a child for being so patient.","Each time the reception bell dings, a balloon inflates by itself, and soon the whole lobby is full."],"6-53":["At the pool, a girl ties a balloon to her flip-flop so it will float if it falls in.","A lost flip-flop grabs a balloon string and flies across the ocean searching for its missing partner."],"7-8":["At a night market, a hawker grills a fish over the fire while a queue of hungry customers waits.","A fish leaps through a hoop of fire without even a singe, the star act of the underwater circus."],"7-9":["A butterfly is drawn towards the warm glow of the fire, so a camper gently waves it away.","A butterfly with wings of fire flutters through the night, leaving a trail of warm sparks for lost travellers."],"7-10":["Pupils make a model volcano with red paper fire shooting from the top for the science display.","Deep inside the volcano, a fire spirit snores, and each breath lights up the lava in the crater."],"7-11":["After reading a book about firefighters, a boy helps his class plan a proper fire drill.","The hero opens an old book and warm, friendly fire leaps from the pages to spell out a secret message."],"7-12":["A stage crew waves orange silk in front of a fan to make fake fire for the theatre masks scene.","The happy theatre mask laughs so hard that a gentle fire flickers from its mouth, and the sad mask warms its hands."],"7-13":["After lightning lights a small fire in a dry field, a brave fire crew races to the rescue.","A hero catches lightning in a jar and drops it into the fire, making a rainbow blaze that grants a wish."],"7-14":["Campers roast an apple on a stick over the fire and share its sweet, sticky smell.","A golden apple never burns, even when thrown into the fire, and the hero wonders what powers it hides."],"7-15":["When the fire alarm rings, a pupil closes the classroom door and leads her class calmly to the field.","Behind a magic door lies a room of friendly fire that dances and tells fortunes."],"7-16":["Lost campers use a compass to head towards the glow of a distant fire.","A magic compass points not north but to the fire where lost friends are waiting."],"7-17":["After a small kitchen fire next door, the whole block leaves a gift of blankets outside the family's door.","A wrapped gift bursts into fire without burning, and out hatches a tiny phoenix chick."],"7-18":["A boy times the school fire drill with the classroom clock to see how quickly everyone gets out.","A clock burns with fire, and each tick of its hands rewinds the day by one minute."],"7-19":["A ranger teaches campers to keep every fire far from the nearest tree and its branches.","A talking tree glows with a tiny fire in its trunk, a lantern for lost forest animals."],"7-20":["A girl gently guides a turtle away from the beach fire so it can reach the sea.","The old turtle carries a tiny fire on its shell, and its slow walk lights a trail through the swamp."],"7-21":["A party magician waves a magic wand and produces a harmless flame from a clever trick prop.","A clumsy apprentice waves a magic wand, and a small fire appears that follows him around like a puppy."],"7-22":["A bell rings at the fire station, and the crew hurries out to help a neighbour in need.","The ancient bell glows like fire whenever it rings, calling every sleeping creature in the valley to wake."],"7-23":["Around the fire, campers sing a song, each adding one music note until they find a tune everyone loves.","Every music note the hero plays turns into a dancing flame, until the fire fills the whole stage with colour."],"7-24":["At a cultural show, a dancer wears a golden crown while another twirls a ribbon the colour of fire.","A crown of fire appears on a sleepy hill, and whoever wears it must learn to rule kindly."],"7-25":["At the fire station open day, children hunt for a missing puzzle piece to finish a poster of a fire engine.","A puzzle piece falls into the fire and comes out shaped like a key to a hidden city."],"7-26":["Spotting fire flicker in the hall mirror, a boy switches off the stove just in time.","In the mirror, a fire burns in a world that does not exist yet, and the hero must step through to light it."],"7-27":["Sailors waving from a small island light a fire so that passing ships can see them.","A tiny island rumbles and sends a joyful fire into the sky every night, like a lighthouse for sea creatures."],"7-28":["On a jungle trek, a guide lights a fire to keep mosquitoes e village warm all winter."],"7-49":["A beekeeper lights a small fire in a smoker to calm the bee before collecting honey.","A bee carries a spark of fire to light the sleepy sun each morning."],"7-50":["Hikers on the mountain gather round a fire to share hot drinks and stories before bed.","A mountain hiccups, and each hiccup sends a little ring of fire into the sky."],"7-51":["A girl dials 995 on the telephone to report a fire in the neighbourhood.","When the telephone rings, the hero finds a fire on the line, asking for directions to the sun."],"7-52":["A guest taps the reception bell to ask the hotel clerk where the fire exit is.","Tapping the reception bell wakes a sleepy fire sprite who is the hotel's night manager."],"7-53":["Wearing flip-flops, a boy keeps well away from the fire at the beach barbecue and cheers for the chef.","A giant flip-flop stamps along the sand, and every step blooms into a little fire that warms the seagulls."],"8-9":["A butterfly rests on a lily pad, and a hungry fish leaps up, startling it away.","A fish dreams of flying, so a butterfly lends it wings for one magical night."],"8-10":["Divers study a fish that lives near an underwater volcano, where the water stays warm all year.","A fish swims into the crater of a sleeping volcano and discovers a hidden city of glowing coral."],"8-11":["A boy borrows a book about fish from the library for his class project.","A fish swims out of a magical book and leaves a trail of wet words across the floor."],"8-12":["Pupils make theatre masks shaped like fish for their ocean play.","A fish finds the theatre masks on the seabed and puts one on, becoming the star of the coral reef play."],"8-13":["A fisherman hurries home with his fish as lightning flashes across the dark sky.","A fish swallows a bolt of lightning and glows like a lamp, lighting up the deep sea."],"8-14":["At the wet market, a mother buys a fish for dinner and an apple for dessert.","A fish plants an apple seed on the seabed, and soon a tree grows whose apples are bubbles."],"8-15":["A neighbour knocks on the door and hands over a bowl with a fish to look after for a week.","A tiny door at the bottom of the pond leads a fish to a secret castle."],"8-16":["On a fishing trip, a girl checks the compass so the boat can find its way home with the fish.","A fish carries a compass in its mouth and leads sailors to hidden islands."],"8-17":["A girl buys a fish as a birthday gift for her little brother and carries it home very carefully.","The gift wiggles, and when it is opened, a fish leaps out and grants one wish."],"8-18":["A boy glances at the clock because it is nearly time to feed the fish.","A fish swims through the clock face, and each time it passes the hands, the hour changes."],"8-19":["A girl sits in the shade of a tree by the river, waiting for a fish to bite.","A fish learns to climb a tree because the river has dried up, and surprises a nesting bird."],"8-20":["When a heron appears, a turtle and a fish take turns to hide under the same lily pad.","A fish and a turtle swap places: the fish crawls ashore while the turtle tries to swim fast."],"8-21":["A magician at a party pulls a toy fish out of his hat with a flick of his magic wand.","A wave of the magic wand turns a little fish into a whale for exactly one day."],"8-22":["A fisherman hangs a bell on his rod so he can hear when a fish bites.","A fish rings a bell at the bottom of the sea, and every sea creature gathers for an urgent meeting."],"8-23":["A girl plays her flute by the pond, and a fish swims up as if listening to each music note.","A fish blows bubbles that pop into music notes, so the whole sea begins to sing."],"8-24":["At the carnival, a boy wins a plastic crown for catching the most fish in the game.","The crown sinks to the seabed, where a fish finds it and is declared ruler of the ocean."],"8-25":["A boy finishes a jigsaw of a fish but discovers that one puzzle piece is missing.","A puzzle piece grows fins, turns in ving flowers to the clouds."],"9-22":["A girl rings the bell on her bicycle, and a startled butterfly flutters off the handlebar into the sunshine.","Each time the bell rings, a new butterfly pops out of it, until the sky is full of rainbow wings."],"9-23":["A butterfly drifts through the window as a boy practises his music note on the piano, and he hums along.","The butterfly traces a music note in the air with its wings, and the flowers dance to the tune."],"9-24":["A butterfly lands on the crown of a school play princess, and the audience whispers that the show has a real star.","A butterfly wearing a tiny crown becomes the queen of the meadow and rules from a dandelion throne."],"9-25":["A girl finishes a puzzle piece by piece and finds the last piece shaped like a butterfly on the picture.","The last puzzle piece flaps away as a butterfly, and the children chase it through the house to finish their picture."],"9-26":["A butterfly sees its own reflection in a mirror and flutters around it, thinking it has found a friend.","The butterfly flies into the mirror and finds a world where all the colours are swapped."],"9-27":["A butterfly rests on a palm leaf on a tiny island, far from the mainland, after a long journey across the sea.","An island turns out to be the sleeping back of a giant butterfly, which stretches its wings and sets sail at dawn."],"9-28":["A butterfly lands on the ear of an elephant at the zoo, and a child giggles when the elephant flaps its ear.","The elephant is scared of a butterfly, and the butterfly teaches it to fly by flapping its big ears."],"9-29":["A butterfly lands on a target at the archery range, and the coach pauses the lesson until it flies away.","A butterfly paints bright spots across a target, and the arrow flies off like a bird to follow it."],"9-30":["A butterfly follows a boy's kite across the field, mistaking its bright colours for a giant flower.","The kite flaps its wings and becomes a butterfly the size of a bus, carrying the children over the clouds."],"9-31":["A butterfly rests beneath a rainbow after a monsoon shower, drying its wings in the warm sun.","The butterfly flies along the rainbow and dips its wings in every colour until it shines like a jewel."],"9-32":["A butterfly lands on a fridge magnet in the kitchen, and a boy takes a photo before it escapes through the window.","The butterfly is secretly magnetic and gets stuck to a magnet, so the other insects must dream up a rescue."],"9-33":["A butterfly circles a candle at the table during a power cut, drawn by its warm, flickering glow.","The candle flame turns into a butterfly and flutters into the dark, lighting a path through the forest."],"9-34":["A girl cycles along the park path on her bicycle while a butterfly flutters beside her all the way to school.","The butterfly hitches a ride in the bicycle basket and steers the girl to a field of glowing flowers."],"9-35":["A butterfly hides on tree bark during the day to dodge an owl that wakes up at dusk.","An owl and a butterfly swap places, so the owl flutters through the garden and the butterfly hoots at the moon."],"9-36":["A butterfly lands near a bowl of noodles at the hawker centre, and a hawker gently shoos it away from the food.","The butterfly wriggles into the noodles and comes out with wings that smell of delicious soup."],"9-37":["A butterfly shelters under a big leaf as rain begins to fall, waiting for the drizzle to stop.","The butterfly flaps its wings and the rain turns into confetti, which showers the whole village."],"9-38":["A butterfly lands on the sail of a sailboat far out at sea, resting before it flies on to the shore.","A butterfly sails the sailboat across the pond using only the wind from its wings."],"9-39":["A girl shines a torch into the dark garden and spots a pale butterfly sleeping under a leaf.","The torch beam makes butterflies glow gold, and they follow the girl home like a floating lantern parade."],"9-40":["A butterfly hides inside an ost in the mist.","The compass spins wildly near the volcano, pointing to a cave filled with rumbling treasure."],"10-17":["A boy brings a gift to the volcano research centre as a thank-you to the scientist who showed him the crater.","A volcano receives a birthday gift and blows a huge cake of warm ash into the sky out of joy."],"10-18":["A scientist checks the clock beside the volcano monitor and counts the minutes between each small tremor.","The clock stops at midnight and the volcano falls asleep, until a child winds it up again."],"10-19":["A lone tree stands on the black slope of the volcano, and the children wonder how it survived.","The tree is the volcano's secret guardian, and its leaves warn when the fire is about to wake."],"10-20":["A turtle crawls across the warm black sand beside a sleepy volcano to lay eggs under the stars.","The turtle carries a volcano on its shell and wonders why its back gets hot when it grows angry."],"10-21":["A teacher uses a magic wand pointer to show where the volcano erupts on the classroom map.","A wizard waves a magic wand to calm the volcano, but it blows a smoke ring instead."],"10-22":["A bell rings at the foot of the volcano to warn tourists it is time to leave the crater viewing area.","The volcano coughs out a giant bell, and its deep ring wakes every dragon in the world."],"10-23":["A music note drifts from the radio of a hiker who sits near a quiet volcano and hums along.","The volcano sings one low music note, and every rock for miles starts to hum along."],"10-24":["A history class learns that a king built his crown-shaped castle beside a volcano long ago.","The volcano belches out a golden crown, and the first creature to wear it becomes ruler of the mountain."],"10-25":["A pupil assembles a puzzle piece by piece to reveal a picture of a volcano glowing in the night.","A missing puzzle piece rolls into the volcano, and the picture on the box stops erupting until it returns."],"10-26":["A mirror in the museum s me a page of the book is turned, a bell rings and a surprise character steps out."],"11-23":["A music teacher opens a book of songs and writes a music note on the board for the class to sing.","A music note slips out of the book and bounces around the library, making the shelves dance."],"11-24":["A girl reads a book about a king and tries on a paper crown she made for the school fair.","The crown hides inside a very old book, and whoever reads aloud becomes the ruler of the story."],"11-25":["A pupil finds a puzzle piece pressed between the pages of a library book and wonders who lost it.","The last puzzle piece is a tiny book, and when it clicks into place, the whole story reveals itself."],"11-26":["A girl holds up a book to a mirror and finds that the words are written backwards.","The mirror shows a different story from the book, and a child steps in to change the ending."],"11-27":["A boy reads a book about an island and sketches a treasure map to take along on the family trip.","The book opens up into a tiny island, with palm trees and a castle in the middle of the pages."],"11-28":["A zoo keeper reads a book about elephants to a group of pupils and then shows them the real animals.","An elephant never forgets anything, so it memorises every word in the book and recites it to the zoo."],"11-29":["A girl reads a book about archery and then lines up her arrow at the target in the school field.","An arrow leaps out of a book and always hits the target, bringing a surprise prize along with it."],"11-30":["A boy reads a book about flying kites and builds one to test on the windy field after school.","A kite carries a book high above the clouds so that birds can learn to read."],"11-31":["A girl finishes a book about the weather and runs outside to see a rainbow after the afternoon shower.","A rainbow slides out of the pages of the book, and each colour tells a different story to the reader."],"11-32":["A boy reads a book about magnets and tries a small magnet on h ["A boy gets a gift of circus tickets and queues up excitedly outside the circus tent.","Inside the circus tent, the biggest gift of all rolls into the ring and nobody can guess what is in it."],"17-44":["A girl finds a sparkling diamond-shaped stone in her gift and wonders whether it is real or glass.","The gift holds a diamond that shows the future when it is held up to the light."],"17-45":["A boy receives a rare coin as a gift from his grandfather and keeps it safe in a tin.","Drop a coin into the gift and it grants one wish, but the wish always comes with a twist."],"17-46":["A girl wraps up her old teddy bear as a gift for her little cousin.","The gift box wriggles and a teddy bear hops out, asking for a hug before it will say who sent it."],"17-47":["For his birthday, a boy gets a gift of a river trip and paddles a canoe for the first time.","A gift floats down the river in a canoe with nobody paddling, drifting towards the right child."],"17-48":["A girl grows a sunflower from a seed and gives it to her teacher as a gift.","The gift bursts open and a sunflower the size of a house grows up through the ceiling."],"17-49":["After watching a bee in the school garden, a boy gives his mum a jar of honey as a gift.","A bee carries a tiny gift from flower to flower, trying to deliver it to the queen."],"17-50":["A boy hikes up a mountain carrying a gift for his grandmother, who is waiting at the top.","The mountain opens like a lid, and inside lies the biggest gift the village has ever seen."],"17-51":["A girl uses the telephone to ask her friends what gift to buy for their teacher.","A telephone rings and a voice whispers that a gift is hiding in the house, getting warmer or colder with each ring."],"17-52":["A guest taps the reception bell to collect the gift that his grandmother left at the desk.","Each tap on the reception bell makes a gift appear on the counter, but every one is meant for somebody else."],"17-53":["A boy opens a gift of new flip-flop sandals and accidentally wears them to school.","Inside the gift is a flip-flop that lets its wearer skip across water like a flat stone."],"18-19":["When the clock on the school wall stops, a girl tells the time by the shadow of a tree.","A clock hangs from a branch, and each tick makes the tree grow one new leaf."],"18-20":["A turtle crosses the path so slowly that a girl checks the clock and finds it takes a whole hour.","A turtle is so ancient that the clock on its shell counts centuries instead of minutes."],"18-21":["A magician at a party checks the clock, then uses a magic wand to hide its minute hand as part of a trick.","One wave of a magic wand makes the clock tick backwards, and the hero gets a second chance at the day."],"18-22":["When the clock strikes three, the school bell rings and pupils spill out into the corridor.","The clock and the bell quarrel over who is right about the time, and only the hero can settle it."],"18-23":["A girl watches the clock while practising a song, hoping to finish before dinner.","The clock plays a tune instead of chiming, and everyone who hears it forgets what hour it is."],"18-24":["Backstage in the school play, a girl in a paper crown checks the clock, ready for her big entrance.","A king's crown stops the clock at midnight so that his birthday party never has to end."],"18-25":["A boy races the clock to finish his jigsaw before bedtime, but one puzzle piece is missing.","The missing puzzle piece is the hour hand of the clock, and time stands still until it is found."],"18-26":["A boy sees the clock in a mirror and wrongly thinks he is late for school.","The clock in the mirror runs backwards, and anyone who steps through arrives in yesterday."],"18-27":["Ferry passengers keep an eye on the clock, hoping to reach the island before the last boat back.","On an island where the clock never moves, it is always teatime and nobody gets older."],"18-28":["A zookeeper checks the clock so that the elephant is fed right on time.","An elephant swallows the clock, and every time it hiccups the hours jump forward."],"18-29":["In archery class, a girl watches the clock because she has just one minute left to hit the target.","Every arrow that hits the target makes the clock jump one hour forward."],"18-30":["A boy checks the clock and dashes to fly his kite before the wind drops at sunset.","The tail of a kite is a string of tiny clocks that chime whenever the wind blows."],"18-31":["Glancing at the clock, a girl waits for the rain to stop so she can catch the rainbow before school.","A rainbow appears only when the clock strikes thirteen, the hour that does not exist."],"18-32":["A boy discovers that a strong magnet makes the old clock run fast, and he tries to work out why.","A giant magnet tugs at the hands of a clock, so the hours either crawl or fly."],"18-33":["During a power cut, a girl lights a candle and checks the clock to see how long until the lights return.","The candle burns down only when the clock ticks, so when the flame goes out, time stops."],"18-34":["A boy pedals his bicycle flat out past the clock tower, hoping he is not late.","A bicycle that pedals backwards turns the hands of the clock back with it."],"18-35":["A girl who cannot sleep watches the clock and listens to an owl hooting in the park.","A wise owl lives inside the clock and wakes up whenever anyone wastes time."],"18-36":["A hawker keeps one eye on the clock, since the noodles must cook for exactly three minutes.","The hand of the clock gets tangled in a bowl of noodles, so the hour stretches out and out."],"18-37":["A girl glances at the clock and hopes the rain will stop before the bus arrives.","The clock freezes whenever it rains and starts again only when the sun comes out."],"18-38":["A boy checks the clock tower from his sailboat to be sure he is back at the harbour by lunch.","The sailboat glides into a sea of time, where the hands of the clock rise and fall like waves."],"18-39":["In a dark corridor, a boy shines his torch on the clock to see if it is still night.","Whatever the torch lights up, the clock pauses for a moment and the whole world holds still."],"18-40":["A girl stares at the clock while she packs her suitcase for the airport.","The suitcase holds a whole day in storage, and a small clock inside tells which one."],"18-41":["A teacher uses a clock and a model planet to show the class how day and night happen.","A planet shaped like a giant clock ticks above the town, and each tick changes the season."],"18-42":["An aquarium keeper checks the clock to make sure the octopus gets its dinner on time.","An octopus wears eight clocks, each showing a different time, and keeps mixing up its mealtimes."],"18-43":["The clock says ten to seven, so a boy runs to catch the first act in the circus tent.","A juggler in the circus tent tosses a clock so high that time slows as it falls."],"18-44":["A jeweller sets a diamond in a clock case for the shop window and polishes it until it shines.","The diamond at the centre of the clock gives its owner extra hours whenever they are needed."],"18-45":["A girl saves every coin in a jar so she can buy a clock for her room.","A coin dropped into the clock buys one extra hour, but only for the person who tossed it."],"18-46":["A boy checks the clock and realises it is long past bedtime for him and his teddy bear.","A teddy bear nudges the hands of the clock forward so that bedtime comes early and the toys can play."],"18-47":["A coach watches the clock as a boy paddles his canoe across the lake in a race.","A canoe glides down a river where every tick of the clock echoes and the water flows backwards."],"18-48":["A sunflower turns with the sun all day like the hand of a clock, and a girl charts the hours.","A clock sits in the middle of the sunflower, and its petals fall one by one to tell the hours."],"18-49":["A bee buzzes into the classroom as the clock creeps towards break, and the pupils stay very still.","A bee builds a hive inside the clock, so every hour tastes of honey."],"18-50":["A hiker checks the clock to be sure she reaches the mountain summit before dark.","The mountain wears a giant clock face, and when its hands meet, a secret cave opens."],"18-51":["The clock says midnight when the telephone rings, and a boy wonders who would call so late.","The telephone rings at thirteen o'clock on the clock, and the voice on the line is the hero's older self."],"18-52":["A hotel clerk looks at the clock, sighs, and hurries over to the guest tapping the reception bell.","The clock chimes whenever someone taps the reception bell, and the hotel jumps to a new century."],"18-53":["A boy races the clock to find his missing flip-flop before the school bus leaves.","A giant flip-flop smacks the clock and the hours scatter like sand across the floor."],"19-20":["A turtle rests in the shade of a tree by the pond while a class watches quietly.","A turtle starts to climb the tree to visit the moon and arrives a hundred years later."],"19-21":["A girl picks up a fallen branch from a tree and pretends it is a magic wand.","A magic wand grows at the top of the tree, and whoever plucks it gets one wish."],"19-22":["A boy ties a bell to the tree so he can call his friends over for a picnic.","The tree rings like a bell whenever someone tells the truth."],"19-23":["A girl sits under a tree and writes down the music of a song she hears from a bird.","Music notes hang from the tree like fruit, and anyone who tastes one hums a brand new tune."],"19-24":["In the school play, a girl dressed as a tree wears a crown of leaves.","The oldest tree in the forest wears a crown and bows to anyone who shows kindness."],"19-25":["A boy finds a puzzle piece among the roots of a tree and tries to work out which game it belongs to.","Every leaf on the tree is a puzzle piece, and the hero must fit them together to make a map."],"19-26":["A boy leans a mirror against the tree to check for a bird's nest that he cannot reach.","Walk behind the tree and its mirror bark shows a completely different place."],"19-27":["Pupils plant a young tree on the little island in the middle of the park pond.","A tree grows so tall that it lifts the whole island up into the sky."],"19-28":["At the zoo, an elephant uses its trunk to shake apples loose from a tree.","An elephant hides behind a tree and thinks nobody can see it, until the hero spots its tail."],"19-29":["At camp, an instructor hangs a target from a tree for the archery lesson.","The tree bends its branches so that every arrow lands in the centre of the target."],"19-30":["A kite gets stuck in a tree, and a boy has to find a clever way to bring it down.","A tree catches a kite and refuses to let go until the hero tells it a story."],"19-31":["After the storm, a rainbow arches over the tree where a boy has been sheltering.","A tree grows leaves in every colour of the rainbow each time someone smiles beneath it."],"19-32":["A boy ties a magnet to a branch of the tree to see what bits of metal it can catch.","A magnetic tree pulls every key and spoon in town towards it, and a girl must find out why."],"19-33":["At the lantern festival, a family sits under a tree with a candle in every lantern.","The tree grows candles instead of leaves and glows to guide lost travellers."],"19-34":["A girl leaves her bicycle beneath a tree and comes back to find a bird's nest in the basket.","The bicycle rides straight up the trunk of the tree and out along a branch into the clouds."],"19-35":["An owl lives in a hole in the tree, and a boy listens for it every night.","The owl in the tree guards all the secrets of the forest and trades one for a good riddle."],"19-36":["Workers eat their noodles in the shade of a tree during their lunch break.","A tree sprouts noodles instead of leaves, and a hungry traveller must decide whether to pick them."],"19-37":["A boy shelters under a tree from the rain until it gets too heavy and he has to run home.","Rain falls on only one tree in the whole forest, and the hero must find out why."],"19-38":["A girl makes a toy sailboat from the bark of a fallen tree and races it down the stream.","A tree pulls up its roots, spreads its branches like a sail, and sets off across the sea."],"19-39":["A boy shines his torch up into the tree to find out which bird is making the strange noise.","The torch beam shows a hidden door in the trunk of the tree."],"19-40":["A girl finds an old suitcase at the foot of a tree in the park and wonders who left it.","Every autumn the tree packs its leaves in a suitcase and heads south for the winter."],"19-41":["On Earth Day, a school plants a tree to show how much they care for the planet.","A tiny planet spins at the top of the tree, and its people beg the hero for help."],"19-42":["A girl spots a tree whose roots look like the arms of an octopus and draws a picture of it.","An octopus climbs the tree, using all eight arms to pick the fruit."],"19-43":["A circus tent is pitched beside a tree in the park, and its shade keeps the performers cool.","A tree wriggles its roots out of the ground and joins the circus tent as the star act."],"19-44":["A boy finds a sparkling diamond-shaped crystal at the bottom of a tree and hands it in to the teacher.","The tree grows a diamond instead of fruit, and every creature in the forest wants it."],"19-45":["A boy digs near a tree in the park and finds an old coin that he takes to a museum.","A coin thrown into a hollow in the tree is answered by a voice that grants a wish."],"19-46":["A boy finds a teddy bear that a classmate left under a tree and returns it the next day.","A teddy bear lives in the hollow of a tree and throws a tea party for the passing animals."],"19-47":["A girl paddles a canoe under the branches of a tree that hangs low over the river.","A canoe carved from a magic tree floats down the river, humming the songs of the forest."],"19-48":["A girl plants a sunflower seed beside the old tree, and it stretches up to catch sunlight through the branches.","The tree grows one giant sunflower instead of leaves, and every petal whispers tomorrow's weather to the village."],"19-49":["A boy follows a bee to a hollow in the tree and discovers a hidden honeycomb dripping with honey.","The bee is the tree's tiny postman, carrying secret letters from branch to branch before sunset."],"19-50":["Hikers rest under a lone tree halfway up the mountain, where its shade is the only cool spot for hours.","The tree is really the mountain's hair, and it shakes its leaves whenever the mountain sneezes."],"19-51":["A fallen tree blocks the road, so a worried driver uses a telephone to call the town council for help.","A telephone hangs from a branch of the tree and rings whenever the forest animals need advice."],"19-52":["A forest campsite hangs a reception bell on a tree so late visitors can tap it to wake the warden.","Each time someone taps the reception bell at the foot of the tree, a door opens in the trunk and a tiny hotel appears."],"19-53":["A boy climbing a tree loses a flip-flop, and it drops onto the roof of the kopitiam below.","The tree grows a new flip-flop on every branch, and each one takes its wearer for a walk."],"20-21":["A girl waves a toy wand at her pet turtle, hoping it will do a trick for her little cousin.","The turtle taps the magic wand with its nose, and its shell grows a tiny glowing house."],"20-22":["A bell is tied round the turtle's shell so its owner can hear it crawling about the garden.","When the turtle rings the bell, every slow thing in town speeds up for exactly one minute."],"20-23":["A boy plays a single music note on his recorder, and the shy turtle slowly pokes its head out to listen.","Each music note the turtle hums turns into a stepping stone across the river."],"20-24":["A boy enters his pet turtle in a fun race at the fair and wins a paper crown for the slowest, steadiest runner.","The turtle finds a golden crown and is declared ruler of the pond, much to the fish's confusion."],"20-25":["A girl finds a puzzle piece with a turtle shell pattern under the sofa and hunts for the rest of the box.","The turtle carries the last puzzle piece on its back, and the picture completes itself into a doorway."],"20-26":["A pet turtle stares at its reflection in a mirror and thinks another turtle has come to visit.","The turtle steps through the mirror into a world where every slow animal is the fastest."],"20-27":["A turtle slowly crawls up the beach of a tiny island while a girl watches quietly from a distance.","The island is actually a giant turtle asleep in the sea, and it wakes up when a boy waves."],"20-28":["At the zoo, a turtle and an elephant share one shady pond and take turns cooling off.","The turtle and the elephant begin a race that lasts a whole year, and nobody can tell who wins."],"20-29":["A turtle plods across the field and stops right on an archery target, so the contest has to wait.","The turtle wears a target on its shell and dares the quickest birds to drop a feather on it."],"20-30":["A girl flying a kite on the beach watches a turtle crawl towards the sea and runs after it.","The turtle holds the kite string and floats over the city on the slowest flight ever."],"20-31":["After a monsoon shower, a turtle crawls out onto the path just as a rainbow appears over the pond.","The turtle sets off along the rainbow to find its treasure and arrives only after a thousand years."],"20-32":["A boy holds a magnet near his pet turtle's tank and learns that its shell is not magnetic.","A giant magnet drags the turtle across the sea to a secret island made of metal."],"20-33":["During a power cut, a girl lights a candle and watches her pet turtle's shadow crawl across the wall.","The turtle carries a candle on its shell, and the flame never goes out however slowly it walks."],"20-34":["A boy cycling home stops his bicycle to help a turtle cross the road beside the park.","The turtle pedals a bicycle with square s diamond on the beach, and a curious turtle crawls over to inspect it.","The turtle's shell turns into a giant diamond whenever it feels embarrassed."],"20-45":["A boy tosses a coin into the pond for a wish, and a turtle paddles over to check it out.","The turtle collects every coin in the pond and builds itself a golden shell to become the richest swimmer."],"20-46":["A girl sits her teddy bear beside her pet turtle so neither feels lonely at bedtime.","When everyone sleeps, the teddy bear climbs onto the turtle's back and they set off on a slow midnight adventure."],"20-47":["A girl paddles her canoe down the river and spots a turtle sunbathing on a log.","The turtle shrinks to the size of a seed and uses a leaf as a canoe to sail down a dripping tap."],"20-48":["A turtle munches lettuce in the garden and rests in the shade of a tall sunflower.","The turtle follows the sunflower round the garden all day, convinced it is a small yellow sun."],"20-49":["A bee buzzes around the flowers by the pond, so the turtle patiently waits for it to leave before eating.","The turtle and the bee make a deal: the bee gives it rides, and the turtle gives the bee a safe home on its shell."],"20-50":["A hiker is surprised to see a turtle on a mountain path, far from any pond, and carries it back to the stream.","The turtle sets out to climb the mountain and only reaches the top after a thousand sunrises."],"20-51":["A girl calls the zoo on the telephone to report that a turtle has escaped from its tank.","The turtle's shell rings like a telephone, and the caller turns out to be the moon asking for help."],"20-52":["A hotel keeps a turtle in its lobby pond, and guests tap the reception bell to say hello to it.","Whenever someone taps the reception bell, the turtle pops out of its shell and checks them into a hotel under the sea."],"20-53":["A girl wearing flip-flops strolls along the shore and stops to let a turtle crawl past.","The turtle wears four flip-flops to win the slowest, funniest beach race ever."],"21-22":["In the school play, a girl holds a toy wand and waits for the bell to signal her big entrance.","Each time the bell rings, the wand grants a wish that nobody expected."],"21-23":["A music teacher points a thin baton, which the pupils call a wand, at each music note on the board.","Every music note that leaves the magic wand floats off and turns into a butterfly."],"21-24":["In the school play, a girl holds a toy wand and wears a paper crown to act as the fairy queen.","The magic wand taps the crown, and the crown starts to sing a royal song and refuses to stop."],"21-25":["A boy waves a toy wand for luck as he searches for the last puzzle piece that vanished under the sofa.","The wand taps a puzzle piece, and the missing bits of the whole town jump back into place."],"21-26":["A girl practises a magic trick with her wand in front of a mirror before the talent show.","When the magic wand touches the mirror, the reflection steps out and offers to do the homework."],"21-27":["At a beach party, children wave glittery wands while building a sand island at the water's edge.","One flick of the magic wand makes a floating island rise out of the sea with a castle on top."],"21-28":["A magician at a birthday party waves a wand, and a balloon elephant pops out of a box to cheers.","The magic wand shrinks an elephant to the size of a mouse, and it hides inside a boy's schoolbag."],"21-29":["A girl uses her toy wand to point at the target at the school fair's game stall.","The magic wand never misses the target, even when the girl closes her eyes and spins around."],"21-30":["A boy uses a long wand-like stick to unhook his kite from a branch.","The wand turns a plain kite into a flying carpet that carries a boy over the rooftops."],"21-31":["A girl waves her sparkly wand at a rainbow after the rain and wishes the colours would stay forever.","The magic wand paints a new rainbow across the sky, and anyone who slides down it lands in a sweet shop."],"21-32":["A teacher shows how a magnet picks up pins, then waves a toy wand and jokes that it is magic.","The magic wand turns into a giant magnet and pulls every lost sock in town onto the school field."],"21-33":["In a power cut, a boy lights a candle and plays wizard, using a chopstick as his wand.","A flick of the magic wand lights a candle that burns with colourful flames and shows hidden messages."],"21-34":["A girl rides her bicycle to the party with a sparkly wand tucked into her basket for her fairy costume.","The magic wand turns a plain bicycle into a flying one that zooms above the MRT tracks."],"21-35":["At a costume party, a boy dressed as a wizard carries a wand and a toy owl on his shoulder.","The owl carries the magic wand in its beak and delivers it to the one child who needs it most."],"21-36":["A boy pretends his chopsticks are a wand while he waits for his noodles at the hawker centre.","The magic wand turns a bowl of noodles into a hundred wriggling ribbons that dance around the table."],"21-37":["When rain starts pouring during the school play, the girl with the toy wand ducks under the stage roof.","The magic wand stops the rain in mid air, so every drop hangs like a glass bead."],"21-38":["A boy waves a toy wand at his model sailboat to wish it luck before the pond race.","With a flick of the magic wand, the sailboat sprouts wings and sails off into the sunset sky."],"21-39":["In a dark storeroom, a girl holds a torch in one hand and a toy wand in the other to find the stage props.","The torch turns into a magic wand whenever it shines on something that is hiding."],"21-40":["A magician packs his wand into a suitcase before catching the MRT to his next show.","The suitcase is bigger on the inside, and the magic wand within can open any door in the world."],"21-41":["A teacher uses a wand-like pointer to show the planet Mars on a poster in class.","The magic wand flicks a tiny planet out of the sky and into a boy's pocket as a pet."],"21-42":["At the aquarium show, a guide holds up a wand to point out the octopus hiding behind the rocks.","The octopus grabs eight magic wands at once and accidentally turns the whole sea pink."],"21-43":["A clown at the circus tent hands out toy wands to the children waiting in line.","The magic wand shrinks the circus tent until it fits inside a hat."],"21-44":["A girl's toy wand has a plastic diamond on top, and she loses it on the way to school.","The magic wand turns one diamond into a hundred glowing stars to light up the night."],"21-45":["A magician makes a coin vanish with a wave of his wand, much to a boy's amazement.","The magic wand turns every coin in the piggy bank into a tiny golden fish."],"21-46":["A girl waves her toy wand over her teddy bear to cheer it up after it loses a button.","A flick of the magic wand brings the teddy bear to life, and the first thing it asks for is honey."],"21-47":["A girl keeps a wand she made from a stick in her canoe as it glides down the river at camp.","The magic wand turns a leaf into a canoe that paddles itself towards a hidden waterfall."],"21-48":["A boy uses a thin stick as a wand to point out the biggest sunflower in the school garden.","The magic wand makes the sunflower grow as high as a skyscraper in a single minute."],"21-49":["A girl dressed as a fairy with a wand notices a bee buzzing around her flower crown.","The bee carries the magic wand back to its hive, where it turns honey into a drink that makes you float."],"21-50":["A hiker points a wand-like walking stick at the far mountain and says that is where the group will camp.","The magic wand makes the mountain bow down so tired climbers can walk right to the top."],"21-51":["In the school play, a girl pretends her wand is a telephone to call her fairy godmother.","When the telephone rings, a magic wand pops out of the speaker and asks who needs help."],"21-52":["A hotel magician taps the reception bell with his wand to begin his trick for the guests.","
