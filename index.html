<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No Tech English Games</title>
<style>
:root{--scale:1;--bg:#fbf7ee;--ink:#1d2433;--mute:#5b6478;--card:#fff;--line:#e6dfcd;--good:#1f9d55;--bad:#d64545;--c:#1d2433}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--scale))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
header.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;display:flex;gap:.5rem;align-items:center;padding:.55rem 1rem;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0;flex:1;min-width:9rem}
.tb{background:#ffffff26;border:0;color:#fff;border-radius:.5rem;padding:.35rem .7rem;cursor:pointer}
.tb:hover{background:#ffffff40}
main{max-width:74rem;margin:0 auto;padding:1rem}
.hero h2{font-size:1.9rem;margin:.3rem 0}
.hero p{color:var(--mute);margin:.2rem 0 .9rem}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.controls input{flex:1;min-width:12rem;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.7rem;background:#fff}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:2rem;padding:.25rem .8rem;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.catname{margin:1.2rem 0 .5rem;font-size:1.05rem;color:var(--c);border-bottom:2px solid var(--c);padding-bottom:.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.9rem}
.gcard{background:var(--card);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:1rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.2rem}
.gcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0001}
.gcard .n{font-size:.8rem;color:var(--c);font-weight:700}
.gcard .t{font-size:1.15rem;font-weight:700}
.gcard .p{font-size:.85rem;color:var(--mute)}
.gcard .d{font-size:.9rem}
.ghead{background:var(--c);color:#fff;border-radius:1rem;padding:1rem 1.2rem;margin-bottom:1rem}
.ghead h2{margin:0;font-size:2rem}
.ghead .meta{opacity:.92}
.nav{display:flex;justify-content:space-between;gap:.5rem;margin:.6rem 0;flex-wrap:wrap}
.nav a,.back{background:#fff;border:2px solid var(--line);border-radius:.6rem;padding:.3rem .8rem;font-size:.9rem;display:inline-block}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:.8rem;padding:.6rem;cursor:pointer;font-weight:700}
.tab.on{background:var(--c);color:#fff;border-color:var(--c)}
.steps{font-size:1.25rem;padding-left:1.6rem}
.steps li{margin:.5rem 0}
.note{background:#fff;border-left:6px solid var(--c);border-radius:.5rem;padding:.6rem .9rem;margin:.7rem 0;font-size:1.05rem}
.toolgrid{display:grid;grid-template-columns:1fr 19rem;gap:1rem;align-items:start}
@media(max-width:820px){.toolgrid{grid-template-columns:1fr}}
.panel{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.8rem;margin-bottom:.9rem}
.panel h4{margin:0 0 .4rem;font-size:.95rem;color:var(--mute)}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.btn{background:var(--c);color:#fff;border:0;border-radius:.7rem;padding:.6rem 1.1rem;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#fff;color:var(--c);border:2px solid var(--c)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bigcard{background:#fff;border:3px solid var(--c);border-radius:1.2rem;padding:1.4rem;min-height:12rem;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:.8rem}
.bigcard.empty{color:var(--mute);border-style:dashed;font-size:1.2rem}
.big{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;line-height:1.1}
.mid{font-size:clamp(1.3rem,3.5vw,2.1rem);font-weight:700}
.ph{font-size:1.4rem;color:var(--mute)}
.muted{color:var(--mute)}
.ans{font-size:1.5rem;color:var(--good);font-weight:700}
.tag{display:inline-block;border-radius:2rem;padding:.2rem .8rem;margin:.15rem;font-size:1.2rem;background:#eee}
.tag.bad{background:#fde4e4;color:#a12525;font-weight:700}
.forbid{display:flex;flex-wrap:wrap;justify-content:center}
.catlabel{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--c);font-weight:700}
.time{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:.5rem;background:#eee;border-radius:1rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.timer.low .time{color:var(--bad)}
.timer.done{animation:flash .6s 4}
@keyframes flash{50%{background:#fde4e4}}
.team{display:flex;align-items:center;gap:.4rem;margin:.3rem 0}
.team input{flex:1;min-width:0;border:2px solid var(--line);border-radius:.5rem;padding:.3rem .5rem}
.team .pts{font-size:1.6rem;font-weight:800;min-width:2.2rem;text-align:center}
.team button,.sbtn{border:2px solid var(--line);background:#fff;border-radius:.5rem;width:2.2rem;height:2.2rem;cursor:pointer;font-weight:800}
.cnum{font-size:3rem;font-weight:800;text-align:center}
.cmsg{text-align:center;color:var(--mute);margin:.3rem 0}
.low .cnum{color:var(--bad)}
details.bank{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.6rem .9rem;margin-top:1rem}
details.bank summary{cursor:pointer;font-weight:700}
details.bank ul{columns:2 14rem;padding-left:1.2rem;margin:.6rem 0 0}
details.bank li{margin:.2rem 0;break-inside:avoid}
.hands{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.8rem;margin-top:.8rem}
.cards{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
.cards.blur{filter:blur(8px);pointer-events:none;user-select:none}
.cd{border:2px solid var(--line);border-radius:.6rem;padding:.25rem .6rem;cursor:pointer;background:#fff;font-size:.95rem}
.cd.chr{background:#e8f0ff}.cd.itm{background:#fff4d6}.cd.plc{background:#e4f6e8}.cd.evt{background:#fde8f0}.cd.end{background:#2b2f3f;color:#ffd96a}.cd.red{background:#fde8e8}
.cd.vcb{background:#efe6ff}.cd.used{opacity:.35;text-decoration:line-through}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-width:26rem;margin:0 auto}
.bgrid.blur .tile{filter:blur(10px)}
.tile{aspect-ratio:1;background:#fffbe8;border:3px solid var(--c);border-radius:.8rem;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,6vw,3rem);font-weight:800}
.dice{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.die{width:5.2rem;height:5.2rem;border:3px solid var(--c);border-radius:1rem;background:#fff;font-size:2.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cn{display:grid;gap:.4rem}
.cn-c{overflow-wrap:anywhere;border:2px solid var(--line);background:#fff;border-radius:.6rem;padding:.9rem .2rem;font-weight:700;font-size:clamp(.85rem,2.2vw,1.3rem);cursor:pointer;text-transform:uppercase}
.cn-c.key{border-width:5px}
.cn-c.red.key,.cn-c.red.up{border-color:#d64545}.cn-c.blue.key,.cn-c.blue.up{border-color:#2a6fd1}
.cn-c.neutral.key{border-color:#c8b88a}.cn-c.assassin.key{border-color:#111}
.cn-c.up.red{background:#d64545;color:#fff}.cn-c.up.blue{background:#2a6fd1;color:#fff}.cn-c.up.neutral{background:#e9dfc2}.cn-c.up.assassin{background:#111;color:#fff}
.gal{width:12rem;height:12rem;stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.gal .pt{stroke:var(--bad)}
.hw{display:inline-flex;gap:.25rem;margin:.3rem .8rem}
.hl{min-width:2rem;height:2.6rem;border-bottom:4px solid var(--ink);text-align:center;font-size:1.8rem;font-weight:800}
.hl.punct{border-bottom:0}.hl.miss{color:var(--bad)}
.kb{display:flex;flex-direction:column;align-items:center;gap:.3rem;margin:.6rem 0}
.kb div{display:flex;gap:.3rem}
.kb button{width:2.4rem;height:2.8rem;border:2px solid var(--line);background:#fff;border-radius:.5rem;font-weight:800;cursor:pointer}
.kb button.ok{background:#d9f4e2}.kb button.no{background:#fde4e4;opacity:.6}
.chain{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chain span{background:#fff;border:2px solid var(--c);border-radius:2rem;padding:.2rem .8rem;font-size:1.2rem}
.fu{font-size:clamp(2rem,7vw,4rem);font-weight:800}
.fu.f{color:var(--good)}.fu.u{color:var(--bad)}
.sent{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:700;min-height:4rem}
input.txt{padding:.6rem .8rem;border:2px solid var(--line);border-radius:.7rem;font-size:1.1rem;flex:1;min-width:8rem}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:.35rem .6rem;text-align:left}
.vrow{display:grid;grid-template-columns:2.6rem 11rem 1fr;gap:.6rem;border-bottom:1px solid var(--line);padding:.45rem .2rem;font-size:1.05rem}.vrow b{font-size:1.15rem}.vd.blur{filter:blur(7px);cursor:pointer}.vl{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.4rem .8rem}.lvl{font-size:.75rem;font-weight:700;border-radius:.4rem;padding:.1rem .4rem;color:#fff;align-self:start;text-align:center}.lvl5{background:#128a80}.lvl6{background:#6150d6}@media(max-width:600px){.vrow{grid-template-columns:2.6rem 1fr}.vrow .vd{grid-column:1/-1}}
footer{text-align:center;color:var(--mute);padding:2rem 1rem;font-size:.85rem}
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/">📚 English Games Hub · P5/6</a></h1>
  <button class="tb" id="smaller" title="Smaller text">A−</button>
  <button class="tb" id="larger" title="Larger text">A+</button>
  <button class="tb" id="fs" title="Fullscreen">⛶ Fullscreen</button>
</header>
<main id="app"></main>
<footer>Instructions and resources for 20 classroom English games. Works offline — no sign-in, no data stored.</footer>

<script>
/* ---------- helpers ---------- */
const h=(tag,props,...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const kid of kids.flat(2)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}return e;};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const makeDeck=a=>{let q=[];return{next(){if(!q.length)q=shuffle(a);return q.pop();}};};
let cleanups=[];const onLeave=f=>cleanups.push(f);
let ac;const audio=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}};
const beep=()=>{try{audio();[0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.15);});}catch(e){}};
const chipRow=(opts,initial,onPick)=>{const row=h('div',{class:'chips'});opts.forEach(([k,t])=>{const b=h('button',{class:'chip'+(k===initial?' on':''),onclick:()=>{[...row.children].forEach(x=>x.classList.toggle('on',x===b));onPick(k);}},t);row.append(b);});return row;};

/* ---------- widgets ---------- */
function Timer(presets=[60],o={}){
  let total=presets[0],left=total,iv=null,running=false,endAt=0;
  const disp=h('div',{class:'time'}),bar=h('div',{class:'bar'},h('i')),btn=h('button',{class:'btn',onclick:()=>toggle()},'▶ Start');
  const lab=p=>p<60?p+'s':(p%60?Math.floor(p/60)+':'+String(p%60).padStart(2,'0'):(p/60)+' min');
  const chips=presets.length>1?chipRow(presets.map(p=>[p,lab(p)]),total,p=>reset(p)):null;
  const root=h('div',{class:'panel timer'},h('h4',{},o.title||'⏱ Timer'),disp,bar,chips,h('div',{class:'btnrow'},btn,h('button',{class:'btn ghost',onclick:()=>reset()},'↺ Reset')));
  const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  function paint(){disp.textContent=fmt(left);bar.firstChild.style.width=(total?left/total*100:0)+'%';root.classList.toggle('low',running&&left<=10&&total>10);btn.textContent=running?'⏸ Pause':(left<total&&left>0?'▶ Resume':'▶ Start');}
  function tick(){left=(endAt-Date.now())/1000;if(left<=0){left=0;clearInterval(iv);running=false;paint();root.classList.add('done');beep();o.onEnd&&o.onEnd();}else paint();}
  function start(sec){if(sec!=null){total=sec;left=sec;}if(left<=0)left=total;root.classList.remove('done');endAt=Date.now()+left*1000;clearInterval(iv);iv=setInterval(tick,100);running=true;audio();paint();}
  function pause(){if(!running)return;left=(endAt-Date.now())/1000;clearInterval(iv);running=false;paint();}
  function reset(sec){clearInterval(iv);running=false;if(sec!=null)total=sec;left=total;root.classList.remove('done');paint();}
  function toggle(){running?pause():start();}
  onLeave(()=>clearInterval(iv));paint();
  return{root,start,pause,reset,toggle,get running(){return running;}};
}
function Scoreboard(o={}){
  const label=o.label||'Team',teams=[];const root=h('div',{class:'panel'});
  function draw(){root.replaceChildren(h('h4',{},'🏆 Scoreboard'),...teams.map(t=>h('div',{class:'team'},h('input',{value:t.name,'aria-label':'Name',oninput:e=>{t.name=e.target.value;}}),h('button',{onclick:()=>{t.pts--;draw();}},'−'),h('div',{class:'pts'},String(t.pts)),h('button',{onclick:()=>{t.pts++;draw();}},'+'))),h('div',{class:'btnrow'},h('button',{class:'btn ghost',onclick:()=>{teams.push({name:label+' '+(teams.length+1),pts:0});draw();}},'+ '+label),teams.length>1&&h('button',{class:'btn ghost',onclick:()=>{teams.pop();draw();}},'− Remove'),h('button',{class:'btn ghost',onclick:()=>{teams.forEach(t=>t.pts=0);draw();}},'Zero')));}
  for(let i=0;i<(o.n||2);i++)teams.push({name:label+' '+(i+1),pts:0});draw();return{root};
}
function Counter(o){
  let n=0,max=o.maxes?o.maxes[0]:o.max;const num=h('div',{class:'cnum'}),msg=h('div',{class:'cmsg'});
  const chips=o.maxes?chipRow(o.maxes.map(x=>[x,x+' max']),max,x=>{max=x;n=0;paint();}):null;
  const root=h('div',{class:'panel'},h('h4',{},o.title),chips,num,msg,h('div',{class:'btnrow'},h('button',{class:'btn',onclick:()=>{if(n<max){n++;paint();}}},o.btn||'+1'),h('button',{class:'btn ghost',onclick:()=>{n=0;paint();}},'↺ Reset')));
  function paint(){num.textContent=o.down?(max-n):n+' / '+max;msg.textContent=o.down?(n>=max?(o.endMsg||'Out of questions!'):'Asked '+n+' of '+max):(n>=max?(o.endMsg||'Limit reached!'):'');root.classList.toggle('low',n>=max);}
  paint();return{root};
}
function bank(m,title,list){m.append(h('details',{class:'bank'},h('summary',{},title+' ('+list.length+')'),h('ul',{},list.map(x=>h('li',{html:x})))));}
function cardTool(m,s,o){
  let items=o.items,deck=makeDeck(items),cur=null,shown=true;const refs={};
  if(o.cats)m.append(chipRow([['All','All'],...o.cats.map(c=>[c,c])],'All',c=>{items=c==='All'?o.items:o.items.filter(i=>i.c===c);deck=makeDeck(items);cur=null;paint();}));
  const card=h('div',{class:'bigcard'});
  const next=h('button',{class:'btn',onclick:()=>{const it=deck.next();cur=o.prep?o.prep(it):it;shown=!o.hidden;paint();}},o.btn||'Next card ▶');
  const rev=(o.hidden||o.partial)?h('button',{class:'btn alt',onclick:()=>{shown=!shown;paint();}},o.revealLabel||'👁 Reveal / hide'):null;
  function paint(){card.classList.toggle('empty',!cur);if(!cur){card.textContent=o.empty||'Press “'+(o.btn||'Next card ▶')+'” to begin';return;}card.replaceChildren(o.hidden&&!o.partial&&!shown?h('div',{class:'ph'},'🙈 Card hidden — only the player should look!'):o.render(cur,shown));}
  m.append(card,h('div',{class:'btnrow'},next,rev));paint();refs.paint=paint;
  if(o.timer){refs.timer=Timer(o.timer);s.append(refs.timer.root);}
  if(o.score){refs.score=Scoreboard(o.score);s.append(refs.score.root);}
  if(o.counter){refs.counter=Counter(o.counter);s.append(refs.counter.root);}
  if(o.bank)bank(m,o.bank.title,(o.bankItems||o.items).map(o.bank.fmt));
  return refs;
}
function dealer(m,o){
  let np=o.minP;
  const sel=h('select',{class:'chip',onchange:e=>{np=+e.target.value;}},range(o.minP,o.maxP).map(n=>h('option',{value:n},n+' players')));
  const out=h('div',{class:'hands'});
  function deal(){
    const per=o.perFn?o.perFn(np):o.per;const pool=shuffle(typeof o.pool==='function'?o.pool():o.pool),ex=o.extra?shuffle(o.extra):[],bn=o.bonus?shuffle(o.bonus.items):[];
    out.replaceChildren(...range(1,np).map(i=>{
      const cards=pool.splice(0,per).concat(bn.splice(0,o.bonus?o.bonus.per:0),ex.splice(0,1));
      const box=h('div',{class:'cards blur'},cards.map(c=>h('div',{class:'cd '+c.cls,onclick:e=>e.currentTarget.classList.toggle('used')},c.d?[c.t,h('small',{style:'display:block;opacity:.75;max-width:14rem'},c.d)]:c.t)));
      const b=h('button',{class:'btn ghost',onclick:()=>{box.classList.toggle('blur');b.textContent=box.classList.contains('blur')?'👁 Show hand':'🙈 Hide hand';}},'👁 Show hand');
      return h('div',{class:'panel'},h('h4',{},'Player '+i+' · '+cards.length+' cards'),box,b);
    }));
  }
  m.append(h('div',{class:'btnrow'},sel,h('button',{class:'btn',onclick:deal},'🃏 Deal cards')),h('div',{class:'muted'},'Tap a card to cross it off when it is played.'),out);
}

/* ---------- content ---------- */
const TABOO=[['TEACHER','school,student,educate,classroom,lesson'],['BICYCLE','pedal,wheels,ride,helmet,handlebar'],['LIBRARY','books,borrow,read,quiet,librarian'],['HAWKER CENTRE','food,stalls,eat,Singapore,cheap'],['MRT','train,station,commute,track,Singapore'],['VOLCANO','lava,mountain,erupt,hot,ash'],['ELECTRICITY','power,current,switch,plug,light'],['PRINCIPAL','school,headmaster,boss,office,teachers'],['HOMEWORK','school,assignment,teacher,do,take'],['BIRTHDAY','cake,candles,party,age,present'],['ASTRONAUT','space,rocket,moon,suit,NASA'],['SUPERMARKET','buy,groceries,trolley,shop,food'],['ENVIRONMENT','nature,pollution,green,recycle,planet'],['COURAGE','brave,fear,hero,bold,scared'],['RAINBOW','colours,rain,sky,arch,sun'],['DURIAN','fruit,smell,king,spiky,thorns'],['LIGHTHOUSE','ship,sea,light,tower,coast'],['FRIENDSHIP','friend,buddy,close,together,pal']].map(([w,f])=>({c:'General',w,f:f.split(',')}));

G(17,'Codenames','logic','4+ players (2 teams)','Give one-word clues that link several words.',['Lay out 25 word cards in a 5×5 grid.','Each team has a “spymaster” who can see which words belong to their team.','The spymaster gives ONE-WORD clue + a number: “Animals, 3.”','The team discusses and touches the cards they think match.','Correct = reveal your team colour; opponent’s card helps them; the assassin = instant loss.','First team to find all their words wins.'],[['Simplified P5/6 version','Use a 3×3 grid with 9 words and simpler vocabulary.']],'codenames'),
G(18,'Apples to Apples Junior','logic','4–8 players','Match a noun to the adjective — the judge decides.',['Each player holds 5 red cards (nouns).','The judge flips a green card (adjective): “Scary.”','All players choose the red card from their hand that matches best.','The judge shuffles the submitted cards and reads them aloud.','The judge picks a favourite (funny, literal or creative).','The winner keeps the green card; first to 4 green cards wins.','Rotate the judge each round.'],[['Example','“Scary” might be matched with “Spiders”, “Tests” or “Thunderstorms”.']],'apples'),
G(19,'Sentence Relay','logic','2+ teams (3–5 per team)','Build a long sentence one word at a time — grammar must hold.',['The teacher gives a simple sentence starter: “The cat sat”.','The first player from Team A adds a word or phrase: “The cat sat on”.','The first player from Team B continues: “The cat sat on the”.','Keep adding to make the sentence longer but <b>grammatically correct</b>.','If a player makes the sentence incorrect or cannot continue within 10 seconds, the other team wins the round.','Best of 5 rounds.'],[['Challenge version','Specify the part of speech to add (adjective, prepositional phrase, clause).']],'relay'),
G(20,'Singlish vs Standard English','sg','2+ teams','Translate between registers — and discuss when each fits.',['The teacher/host reads a Singlish phrase: “Can lah, no problem one.”','Teams write down the standard English equivalent.','First correct answer gets a point: “Yes, it’s no problem at all.”','Discuss when each register is appropriate.','<b>Reverse mode:</b> give standard English; convert it to natural Singlish.'],[['Learning value','Understanding code-switching for the PSLE oral exam.']],'singlish')
];
