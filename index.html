wave of relief washed over Hana when she saw her lost puppy waiting outside the door."],"bad":"The ant carried an immense crumb that was smaller than a grain of sand.","why":"Immense means extremely large, so it cannot describe a crumb smaller than a grain of sand."},"impartial":{"ex":["A referee must be impartial and treat both teams fairly.","The impartial judge listened carefully to both pupils before deciding who should get the last seat."],"bad":"The impartial umpire always helped his own son's team and ignored the other team.","why":"Impartial means fair to everyone, so an umpire who favours one team is not impartial."},"impulsive":{"ex":["Ben is impulsive and bought the toy without thinking about the price.","Being impulsive, Nisha jumped into the cold pool without checking its depth and gasped in shock."],"bad":"She is impulsive because she always plans every step very carefully for weeks beforehand.","why":"Impulsive means acting without thinking, so it cannot describe someone who plans carefully for weeks."},"incessant":{"ex":["The incessant rain kept us indoors for the whole weekend.","Alex could not sleep because of the incessant barking of the dog outside his flat all through the night."],"bad":"The incessant bell rang just once and then stopped for the rest of the day.","why":"Incessant means continuing without a break, so one single ring that stops is not incessant."},"indifferent":{"ex":["Tom seemed indifferent about which game we played at recess.","The indifferent audience yawned and looked at their phones while the speaker pleaded for volunteers."],"bad":"Mei was indifferent and cried loudly with excitement when she heard the wonderful news.","why":"Indifferent means not caring or interested, so it does not fit someone who is excited and crying out."},"indignant":{"ex":["Lily was indignant when her brother blamed her for his mess.","The indignant customer protested loudly that it was unfair for the stall to charge him twice."],"bad":"The indignant girl smiled happily because everyone had treated her very fairly.","why":"Indignant means angry about unfair treatment, so it does not fit a happy girl who was treated fairly."},"inevitable":{"ex":["It is inevitable that the ice will melt in the hot sun.","With the storm clouds growing darker, it was inevitable that our picnic would be washed out by the rain."],"bad":"It is inevitable that I will win the lottery, even though I have never bought a ticket.","why":"Inevitable means certain to happen and unavoidable, so it cannot describe something that is nearly impossible."},"inquisitive":{"ex":["The inquisitive toddler opened every cupboard to see what was inside.","Being inquisitive, Farah asked many questions about how the old clock worked and why its hands moved."],"bad":"The inquisitive boy never asked a single question and had no interest in anything.","why":"Inquisitive means curious and eager to learn, so it cannot describe a boy with no interest in anything."},"insight":{"ex":["Reading the book gave me insight into how bees live.","Her insight into the characters helped her write a thoughtful answer for the comprehension passage."],"bad":"I felt a sharp insight in my knee when I fell off the bicycle.","why":"Insight means a deep understanding of something, so it cannot describe a feeling of physical pain."},"insolent":{"ex":["The insolent boy rolled his eyes when the teacher spoke to him.","His insolent reply to the old man made the other passengers on the MRT frown in disapproval."],"bad":"She was insolent because she thanked the teacher politely and bowed with great respect.","why":"Insolent means rude and disrespectful, so thanking a teacher politely is the opposite."},"intend":{"ex":["I intend to finish my homework before dinner tonight.","Mei Fang intended to surprise her grandmother with a cake, so she quietly bought flour on the way home."],"bad":"I intend yesterday that I would eat the cake by accident, and I did.","why":"Intend means to plan to do something on purpose, so it cannot describe something done by accident."},"jeopardise":{"ex":["Skipping practice will jeopardise our chances of winning the match.","Leaving the gate open could jeopardise the safety of the little puppies by letting them run onto the road."],"bad":"Studying hard every day will jeopardise your results and help you to score full marks.","why":"Jeopardise means to put something at risk of harm, so it cannot mean helping to get better results."},"jubilant":{"ex":["The jubilant crowd cheered when our school won the trophy.","Jubilant shouts rang across the field as the relay team crossed the finish line first, arms raised high."],"bad":"The jubilant pupils sat quietly in tears after their team lost badly.","why":"Jubilant means joyful and triumphant, so it does not describe sad pupils who have just lost."},"loathe":{"ex":["I loathe the smell of durian, so I always sit far away from it.","Though Dev loathes waking up early, he still gets up at six every day to walk his dog."],"bad":"I loathe chocolate ice cream so much that I always ask for a second scoop.","why":"Loathe means to dislike intensely, so someone who loathes something would not ask for more of it."},"lucrative":{"ex":["Selling cold drinks on a hot day can be a lucrative business.","Aunty Lim's popular bakery proved so lucrative that she soon opened a second shop near the MRT station."],"bad":"The shop was lucrative because it lost money every week and soon had to close.","why":"Lucrative means producing a lot of profit, so a shop that loses money every week is not lucrative."},"melancholy":{"ex":["A feeling of melancholy came over Mei as she watched the rain fall.","The old song filled Uncle Raj with melancholy, and he stared quietly out of the window for a long time."],"bad":"The melancholy clown danced around happily and made all the children laugh loudly.","why":"Melancholy means quiet sadness, so it does not describe a clown who is happy and laughing."},"mimic":{"ex":["My little brother likes to mimic the way our dog barks.","Using a squeaky voice, Jamal could mimic the teacher so well that the class burst out laughing."],"bad":"The parrot mimicked my voice by singing a completely different song in its own style.","why":"To mimic is to copy someone's words or actions, so making up something different is not mimicking."},"accumulate":{"ex":["If you save two dollars every week, your coins will accumulate in the piggy bank.","Over the monsoon season, brown leaves began to accumulate in the drain outside our HDB block."],"bad":"Money will accumulate in my piggy bank if I spend all of it on sweets every day.","why":"Accumulate means to gather a growing amount over time, so spending everything cannot make money build up."},"diminish":{"ex":["As the sun went down, the light in the classroom began to diminish.","Her fear did not diminish until she saw that the dog behind the fence was friendly."],"bad":"We will diminish the cake by adding more icing and extra layers until it is much bigger.","why":"Diminish means to make smaller or weaker, so adding more to make something bigger is the opposite."},"lament":{"ex":["Mei Ling began to lament the loss of her favourite pencil case.","At the hawker centre, the old stallholder would lament that fewer customers came after the rain started."],"bad":"The students lament loudly when they win the class prize and hear their names called.","why":"Lament means to express sadness or regret, so it does not suit celebrating a prize."},"vividly":{"ex":["I can still vividly remember the bright red kite flying above the field.","She described the storm so vividly that we could almost hear the thunder in the classroom."],"bad":"He vividly forgot his homework and could not remember a single thing about it.","why":"Vividly means in a clear and detailed way, so it cannot go with forgetting."},"accustomed":{"ex":["I am accustomed to waking up at six o'clock for school.","Having grown up near the MRT track, Ravi was accustomed to the rumble of passing trains at night."],"bad":"The new student was accustomed to the school, so he got lost on his very first day.","why":"Accustomed means used to something, so it cannot describe someone who is lost and new."},"catalyst":{"ex":["The teacher's kind words were the catalyst that made Ben start to love reading.","The flooded void deck was the catalyst for our neighbours to meet and plan a clean-up together."],"bad":"The catalyst of the story is the part where the author lists all the characters' names.","why":"A catalyst is something that causes a big change, not a simple list of names."},"adversity":{"ex":["Good friends help you stay strong when you face adversity.","Despite the adversity of losing his bag on the bus, Hafiz stayed calm and asked the driver for help."],"bad":"Our class enjoyed a day of great adversity at the fun fair, with games and sweets.","why":"Adversity means difficulties or bad luck, so it cannot describe a fun and happy day."},"perplexity":{"ex":["She looked at the maths question in perplexity because she could not understand it.","A look of perplexity crossed his face when the lift stopped on the wrong floor."],"bad":"He jumped for joy and shouted with perplexity when he won the swimming race.","why":"Perplexity means confusion, so it does not describe the joy of winning a race."},"unanimous":{"ex":["The vote was unanimous because every pupil put up a hand for the picnic.","After a short chat, the group made a unanimous decision to help the lost kitten at the void deck."],"bad":"The result was unanimous because half the class voted yes and half voted no.","why":"Unanimous means everyone agrees, so a split vote cannot be unanimous."},"frigid":{"ex":["The frigid water in the ice bucket made me shiver.","We hurried into the frigid air of the cold room at the supermarket and quickly put on our jackets."],"bad":"We sweated in the frigid desert sun as the sand burned our feet.","why":"Frigid means very cold, so it cannot describe a roasting hot desert."},"acknowledge":{"ex":["Please acknowledge the teacher by saying good morning when she walks in.","He had to acknowledge that he had broken the vase, even though he was afraid of being scolded."],"bad":"Jia Hui refused to acknowledge her mistake, so she said sorry and admitted it was her fault.","why":"Acknowledge means to admit something is true, so it does not go with refusing to admit it."},"acquaintance":{"ex":["The man at the bus stop is just an acquaintance, not a close friend.","At the school fair, Mum chatted with an acquaintance she had met only once at a parents' meeting."],"bad":"My acquaintance is my best friend, and we share all our secrets every day.","why":"An acquaintance is someone you know only slightly, not a best friend."},"adaptability":{"ex":["Her adaptability helped her settle quickly into her new school.","The team showed great adaptability when the rain forced the sports day to move into the school hall."],"bad":"The cat's adaptability is shown by how it sleeps all day and never changes anything.","why":"Adaptability means being able to change to fit new conditions, not staying the same."},"adhere":{"ex":["Please adhere to the school rules and walk along the corridor.","The sticker would not adhere to the wet window, so it slid down to the floor."],"bad":"The pupils adhere the rules by breaking them whenever the teacher looks away.","why":"Adhere to rules means to follow them, so it cannot describe breaking them."},"alleviate":{"ex":["A cool drink can alleviate a sore throat.","The kind neighbour brought umbrellas to alleviate the problem of the families waiting in the heavy rain."],"bad":"Running around in the hot sun will alleviate your headache and make it much worse.","why":"Alleviate means to make a problem less severe, so it cannot make something worse."},"ambiguity":{"ex":["The ambiguity in the sign made us unsure which door to use.","There was some ambiguity in the instructions, so two groups understood the game in different ways."],"bad":"The clear and simple recipe was praised for its ambiguity, so everyone understood it easily.","why":"Ambiguity means something can be understood in more than one way, so it cannot describe clear instructions."},"ample":{"ex":["We had ample time to finish the test before the bell rang.","There was ample food at the hawker centre, so every hungry family left with a full tummy."],"bad":"The tiny bowl of rice was ample, so the whole class stayed hungry afterwards.","why":"Ample means more than enough, so it cannot describe a tiny bowl that leaves people hungry."},"animosity":{"ex":["There was animosity between the two teams after the unfair game.","The animosity between the neighbours disappeared when they worked together to clean the corridor."],"bad":"The two best friends hugged each other warmly with animosity and giggled together.","why":"Animosity means strong dislike or hostility, so it does not suit warm hugs between friends."},"apathy":{"ex":["His apathy showed when he did not even look up during the lesson.","The apathy of the crowd surprised us, as nobody cared to join the clean-up at the park."],"bad":"The fans showed great apathy by cheering and jumping up and down at the match.","why":"Apathy means a lack of interest, so it cannot describe excited cheering."},"arduous":{"ex":["Climbing the hundred stairs to the top floor was an arduous task.","After an arduous hike up the hill, the tired scouts finally rested and drank some water."],"bad":"It was an arduous job to press the button once, so it took only a second.","why":"Arduous means very difficult and tiring, so it cannot describe a job that takes one second."},"astute":{"ex":["The astute shopkeeper noticed that the child had forgotten his change.","With an astute guess, Daniel worked out who had taken the missing book from the way people were behaving."],"bad":"The astute boy believed every silly rumour and was fooled by every trick.","why":"Astute means clever and quick to judge situations, so it cannot describe someone who is easily fooled."},"audacious":{"ex":["It was an audacious plan to cross the stream on a single log.","The audacious boy walked up to the principal and asked for a longer recess."],"bad":"The shy girl was audacious and hid behind her mother, afraid to say a word.","why":"Audacious means boldly daring, so it cannot describe a shy child who hides."},"authentic":{"ex":["This is an authentic painting by a famous artist, not a copy.","We ate authentic laksa at the hawker centre, made by a cook using her grandmother's recipe."],"bad":"The toy was an authentic copy made in a factory to look like the real thing.","why":"Authentic means real and genuine, so it does not describe a copy made to imitate something."},"benevolent":{"ex":["The benevolent old man gave free sweets to the children.","A benevolent neighbour quietly cooked meals for the family who had just moved into the flat."],"bad":"The benevolent bully pushed the younger children and took their pocket money.","why":"Benevolent means kind and well meaning, so it cannot describe a bully."},"boisterous":{"ex":["The boisterous puppies ran around the garden barking happily.","The school canteen was boisterous at recess, filled with laughing children and clattering trays."],"bad":"We tiptoed into the boisterous library, where everyone was reading in total silence.","why":"Boisterous means noisy and lively, so it cannot describe a silent library."},"camouflage":{"ex":["The green insect can camouflage itself on a leaf.","The chameleon used camouflage to blend into the branch, so the bird flew past without seeing it."],"bad":"The bright red firework will camouflage in the night sky so that everyone can spot it.","why":"Camouflage means to hide by blending in, so it does not fit something made to stand out."},"chronological":{"ex":["Please write the events in chronological order, starting with the earliest.","Our teacher asked us to list the trip's events in chronological order, from the bus ride to the picnic."],"bad":"The chronological list ran from the biggest animal to the smallest animal in the zoo.","why":"Chronological means in time order, not in order of size."},"coerce":{"ex":["You should never coerce a friend to give you their lunch money.","The older boys tried to coerce the little boy into handing over his bag by threatening him."],"bad":"The teacher gently coerced the class by offering a kind smile and asking politely.","why":"Coerce means to force someone using threats, so it does not describe asking politely."},"cognizant":{"ex":["She was cognizant of the danger and walked carefully across the wet floor.","Cognizant of the deadline, Amir finished his project a day early."],"bad":"The boy was fully cognizant of the test, so he had no idea that it was happening.","why":"Cognizant means aware, so it cannot go with having no idea about something."},"collaborate":{"ex":["We will collaborate with our classmates to build a model bridge.","The two schools agreed to collaborate on a play, sharing ideas and costumes for the big show."],"bad":"The two boys collaborate by working alone in separate rooms and never talking.","why":"Collaborate means to work together, so working alone cannot be collaboration."},"complacent":{"ex":["Do not become complacent just because you did well on the last test.","The complacent runner had won so often that he stopped training, and a younger rival beat him."],"bad":"The complacent girl worked extremely hard every day because she doubted her own ability.","why":"Complacent means too satisfied with oneself, so it does not describe someone who works hard from self-doubt."},"comprehensive":{"ex":["The teacher gave us a comprehensive list of all the words for the test.","The librarian wrote a comprehensive guide to the school library, covering every shelf and rule."],"bad":"The comprehensive report had only one line and left out almost everything.","why":"Comprehensive means covering nearly everything, so it cannot describe a report that leaves out almost everything."},"condone":{"ex":["Our school will not condone cheating in any test.","The coach would never condone rude shouting at the referee, even if his team was losing."],"bad":"The principal condoned the bullying by punishing the pupils and telling them to stop.","why":"Condone means to accept bad behaviour, so it does not fit punishing it."},"conscientious":{"ex":["Mei is a conscientious pupil who always checks her homework twice.","The conscientious cleaner swept every corner of the void deck, even the places nobody would notice."],"bad":"The conscientious boy never did his work and left his tasks half finished.","why":"Conscientious means careful and thorough in doing one's duty, so it cannot describe a careless boy."},"contemporary":{"ex":["The museum has contemporary paintings by artists who are alive today.","Shakespeare and his contemporary writers lived at the same time, so they knew of each other's plays."],"bad":"Her phone is very contemporary because it is broken and cannot be used any more.","why":"Contemporary means modern or from the same time, so it does not mean broken or unusable."},"contradict":{"ex":["It is rude to contradict your teacher in front of the whole class.","His story seemed to contradict the video, because it showed him sitting at home, not at the shop."],"bad":"When Lina said the sky was blue, I contradicted her by saying yes, it is blue.","why":"Contradict means to say the opposite, so agreeing with someone is not contradicting."},"conundrum":{"ex":["The riddle was a real conundrum, and nobody in the class could solve it.","Choosing between the school play and the football match was a conundrum, as both were on the same afternoon."],"bad":"The conundrum was a sweet cake that we ate happily at the party.","why":"A conundrum is a confusing problem or puzzle, not a cake."},"curtail":{"ex":["The heavy rain made us curtail our picnic and go home early.","The school had to curtail the length of recess because of the thunderstorm."],"bad":"The teacher decided to curtail the lesson by making it two hours longer.","why":"Curtail means to cut short or reduce, so it cannot mean making something longer."},"deficient":{"ex":["The plant looked weak because the soil was deficient in water.","A diet deficient in vitamins can leave a child feeling tired and weak."],"bad":"The cupboard was deficient in food because it was full to the top with snacks.","why":"Deficient means not having enough, so it cannot describe a cupboard full of food."},"deleterious":{"ex":["Too much junk food can have a deleterious effect on your health.","The deleterious smoke from the factory harmed the plants growing along the road."],"bad":"Eating fresh fruit and vegetables has a deleterious effect, so we grow strong and healthy.","why":"Deleterious means harmful, so it cannot describe healthy food that helps you grow strong."},"demeanour":{"ex":["The new teacher had a calm and friendly demeanour.","Despite his nervous demeanour, the boy walked to the stage and read his poem clearly."],"bad":"The demeanour of the cake was chocolate, and it was baked in the oven for an hour.","why":"Demeanour means the way a person behaves, so it cannot describe a cake."},"denounce":{"ex":["The whole class will denounce cheating as wrong and unfair.","The villagers came together to denounce the littering that had spoilt their beautiful park."],"bad":"Everyone gathered to denounce the kind helper by praising her for her good deeds.","why":"Denounce means to publicly say something is wrong, so it does not mean praise."},"derelict":{"ex":["The derelict hut by the river had broken windows and a collapsed roof.","Nobody had visited the derelict building for years, and weeds had grown through its cracked floor."],"bad":"The new shopping mall was derelict, with shiny floors and freshly painted walls.","why":"Derelict means run down from neglect, so it cannot describe a shiny new building."},"despondent":{"ex":["She felt despondent when her kite flew away and she thought it was lost forever.","The despondent team sat quietly on the bench after losing every match in the tournament."],"bad":"He was despondent about winning the prize and danced happily around the room.","why":"Despondent means very low in spirits and without hope, so it does not describe happy dancing."},"deteriorate":{"ex":["The old bread will deteriorate and go mouldy if you leave it out.","The weather began to deteriorate in the afternoon, with dark clouds and strong winds."],"bad":"After lots of practice, his handwriting began to deteriorate and became neater and neater.","why":"Deteriorate means to get worse, so it cannot describe handwriting that is getting neater."},"devoid":{"ex":["The desert was devoid of trees, so we found no shade.","The room was devoid of furniture, and our footsteps echoed on the bare floor."],"bad":"The garden was devoid of flowers because roses and orchids grew everywhere.","why":"Devoid means completely without something, so it cannot describe a garden full of flowers."},"discrepancy":{"ex":["There was a discrepancy between the two lists, as one said ten and one said twelve.","The teacher noticed a discrepancy between Tom's story and the answer on his worksheet."],"bad":"There was a perfect discrepancy because the two copies matched in every single detail.","why":"A discrepancy is a difference between things that should match, so matching copies have no discrepancy."},"disdain":{"ex":["The cat looked at the cheap food with disdain and walked away.","He showed disdain for the other team's effort by laughing and turning his back."],"bad":"She greeted her grandmother with great disdain and a big, loving hug.","why":"Disdain means looking down on something as unworthy, so it cannot go with a loving hug."},"disillusioned":{"ex":["He felt disillusioned when he found out the famous restaurant was dirty.","Disillusioned by the broken promises of the club, the girl decided to leave it."],"bad":"She was disillusioned because the film was even better than she had hoped.","why":"Disillusioned means disappointed that something is worse than believed, not better."},"disparage":{"ex":["It is unkind to disparage a friend's drawing in front of others.","The boy would often disparage the other team's skills, saying they were hopeless players."],"bad":"The coach would disparage the team by praising them highly for their wonderful skills.","why":"Disparage means to speak of something as having little worth, so it does not mean praise."},"disseminate":{"ex":["The school will disseminate the new rules by sending a letter to every parent.","After the storm, the town council used loudspeakers and posters to disseminate safety advice to all the HDB blocks."],"bad":"Mum used a sponge to disseminate the sticky stain until the table was clean.","why":"Disseminate means to spread information widely, not to scrub or remove a stain."},"dormant":{"ex":["The bear stays dormant in its cave during the cold winter months.","For years, the volcano on the island lay dormant, so the villagers felt safe building their homes near it."],"bad":"The dormant football player ran across the field and scored three goals in ten minutes.","why":"Dormant means inactive or sleeping for a while, so it cannot describe someone running and scoring."},"dubious":{"ex":["I felt dubious about the shop's promise because the toy looked very cheap.","Mei Ling gave the stranger a dubious look, unsure whether his story about the lost puppy was true."],"bad":"Ravi was dubious about winning, so he jumped for joy and told everyone he was certain to win.","why":"Dubious means doubtful or unsure, so it does not fit someone who is certain and joyful."},"ebullient":{"ex":["My ebullient cousin laughed and chattered all the way to the zoo.","The ebullient crowd at the school carnival cheered, clapped and danced when the lion dance began."],"bad":"The ebullient boy sat alone in the corner, quiet and tired, with nothing to say.","why":"Ebullient means cheerful and full of energy, which is the opposite of quiet and tired."},"efficacy":{"ex":["The doctor tested the efficacy of the new cough syrup on many patients.","Our teacher doubted the efficacy of copying notes, because pupils who practised questions learnt much more."],"bad":"The efficacy of the swimming pool was fifty metres long and filled with clear water.","why":"Efficacy means how well something produces the result wanted, not the size or shape of a place."},"elusive":{"ex":["The elusive cat always slipped away before I could stroke it.","Finding a quiet seat on the crowded MRT during rush hour was an elusive goal for Ben."],"bad":"The elusive tree in our garden was so easy to spot that everyone saw it at once.","why":"Elusive means hard to find or catch, so it cannot describe something that is easy to spot."},"emanate":{"ex":["A warm smell of baking began to emanate from the kitchen.","Soft music seemed to emanate from the old radio at the hawker centre, filling the busy lunchtime air."],"bad":"The heavy school bag will emanate into the classroom if you buy it a new strap.","why":"Emanate means to spread out from a source, such as a smell or sound, not to enter or become."},"embellish":{"ex":["We used glitter and ribbons to embellish the birthday card for Grandma.","Mina tried to embellish her story with a talking parrot, but her friends knew the real tale was funnier."],"bad":"The painter used a rough brush to embellish the pretty picture until it was plain and bare.","why":"Embellish means to make something more attractive with extra details, not to make it plain."},"eminent":{"ex":["An eminent scientist visited our school to talk about stars.","The eminent doctor, well known across Singapore for her research, received a warm welcome from the audience."],"bad":"The eminent puddle on the floor was small, dirty and forgotten by everyone.","why":"Eminent describes a famous and respected person, not a small puddle or something forgotten."},"empirical":{"ex":["The class gathered empirical evidence by measuring how fast the plants grew each day.","Her empirical findings came from watching the birds at the park for a whole month, not from guessing."],"bad":"Her empirical story about dragons was entirely imagined and based on nothing she had ever seen.","why":"Empirical means based on observation or experience, so it cannot describe an imagined story."},"emulate":{"ex":["I want to emulate my big sister, who always works hard in school.","Many young swimmers try to emulate the national champion by copying her training and her focus."],"bad":"Sam wanted to emulate his friend, so he did the opposite of everything she did.","why":"Emulate means to match or surpass someone, usually by following their example, not by doing the opposite."},"enthrall":{"ex":["The magician's tricks will enthrall the little children at the party.","The storyteller's tale of a hidden island seemed to enthrall the whole class, who sat silent and wide-eyed."],"bad":"The long, boring speech began to enthrall the pupils, who yawned and checked the clock.","why":"Enthrall means to hold someone's attention in a fascinating way, not to bore them."},"ephemeral":{"ex":["The rainbow was ephemeral and faded after only a few minutes.","The sandcastle we built was ephemeral, because the waves washed it away before the sun set."],"bad":"The ephemeral mountain has stood in the same place for millions of years.","why":"Ephemeral means lasting a very short time, so it cannot describe a mountain that lasts for ages."},"epitome":{"ex":["Our kind neighbour is the epitome of friendliness, always greeting everyone with a smile.","With her tidy desk, neat work and early arrival, Aisha was the epitome of a well-organised pupil."],"bad":"He bought the epitome from the shop and ate it with rice for dinner.","why":"Epitome means a perfect example of a quality or type; it is not a food or an object to buy."},"equivocal":{"ex":["The teacher's equivocal answer left us unsure whether the test was on Monday or Tuesday.","The weather report was equivocal, saying it might rain or might stay sunny, so we packed an umbrella anyway."],"bad":"The sign gave an equivocal instruction that was very clear and had only one meaning.","why":"Equivocal means open to more than one meaning, so it cannot describe a clear instruction."},"erratic":{"ex":["The old bus gave an erratic ride, speeding up and slowing down for no reason.","The kite's erratic movements in the strong wind made it hard for Jun to guide it."],"bad":"The train kept an erratic schedule, arriving at exactly nine o'clock every single day.","why":"Erratic means uneven and unpredictable, so it cannot describe something that happens at the same time each day."},"erroneous":{"ex":["My answer was erroneous because I added the numbers instead of subtracting them.","The erroneous sign on the door said the library was closed, so many pupils went home without borrowing books."],"bad":"The teacher praised his erroneous work because every answer was right and neatly done.","why":"Erroneous means wrong or incorrect, so it cannot describe work in which every answer is right."},"exacerbate":{"ex":["Scratching a mosquito bite will only exacerbate the itch.","Walking on the sore ankle during the hike would exacerbate the pain, so the coach told Ali to rest."],"bad":"The cool drink helped to exacerbate my thirst until I felt much better.","why":"Exacerbate means to make a bad situation worse, so it cannot describe something that makes you feel better."},"exemplary":{"ex":["Her exemplary behaviour made her a good role model for the whole class.","The exemplary student council leader always arrived early, helped others and set a fine example for the juniors."],"bad":"The teacher scolded him for his exemplary behaviour of shouting and pushing in the queue.","why":"Exemplary means very good and worth copying, so it cannot describe shouting and pushing."},"exhilarated":{"ex":["I felt exhilarated after racing down the big slide at the playground.","The cyclists were exhilarated as they sped along the park connector with the wind rushing past their faces."],"bad":"She felt exhilarated and sad because the day was dull and nothing exciting happened at all.","why":"Exhilarated means very happy and excited, so it does not fit a dull day or feeling sad."},"fabricate":{"ex":["Do not fabricate an excuse about your homework; tell your teacher the truth.","The boy tried to fabricate a story about a giant bird to explain why he was late for school."],"bad":"The workers will fabricate the truth by telling everyone exactly what really happened.","why":"Fabricate means to invent something false, so it cannot mean telling the truth."},"facetious":{"ex":["Stop being facetious, because this is a serious talk about safety rules.","His facetious joke about the fire drill made some pupils laugh, but the teacher did not find it funny."],"bad":"The facetious doctor spoke in a calm, serious voice and gave careful advice about the illness.","why":"Facetious means joking at the wrong time about serious matters, not being calm and serious."},"fastidious":{"ex":["My fastidious brother checks every sum twice before he hands in his homework.","The fastidious baker measured each spoonful with care so that every cake came out exactly right."],"bad":"The fastidious boy never cared about details and left his messy work full of mistakes.","why":"Fastidious means very careful about details, so it cannot describe someone who ignores details."},"feasible":{"ex":["It is feasible to finish the project by Friday if we all help.","Building a tiny garden on the balcony was feasible, because the space was sunny and we already had pots."],"bad":"It is feasible that the plan is impossible and could never work, however hard we tried.","why":"Feasible means possible to do, so it contradicts the idea that a plan is impossible."},"ferocious":{"ex":["The ferocious dog growled and barked at the stranger at the gate.","A ferocious wind shook the trees outside our window during the monsoon storm and rattled the shutters."],"bad":"The ferocious kitten purred softly and curled up gently in my lap for a nap.","why":"Ferocious means fierce and wild, which is the opposite of a gentle, purring kitten."},"fickle":{"ex":["My fickle friend loves football one week and then hates it the next.","The weather in April can be fickle, with bright sunshine in the morning and heavy rain by afternoon."],"bad":"Dan was fickle because he stayed loyal to the same team and hobby for his whole life.","why":"Fickle means always changing one's mind or loyalty, so it cannot describe someone who stays the same."},"flabbergasted":{"ex":["I was flabbergasted when I won first prize in the drawing contest.","The pupils were flabbergasted to see a tiny monkey sitting calmly on the canteen table eating a banana."],"bad":"We were flabbergasted by the lesson because it was exactly what we had expected.","why":"Flabbergasted means greatly surprised, so it does not fit something that was exactly expected."},"formidable":{"ex":["The chess champion was a formidable opponent that nobody wanted to face.","A formidable wall of dark clouds rolled over the island, and everyone hurried home before the storm."],"bad":"The formidable puppy was tiny and weak, and nobody was afraid of it at all.","why":"Formidable means impressive in a way that causes fear or respect, so it cannot describe a weak puppy."},"fortitude":{"ex":["The runner showed great fortitude by finishing the race with a sore knee.","With fortitude and a brave smile, Mei carried on practising the piano even after many difficult weeks."],"bad":"He showed fortitude by giving up at the first problem and crying loudly in the corner.","why":"Fortitude means courage and strength in hard times, so giving up at once does not show it."},"futile":{"ex":["It is futile to shout at the television because the players cannot hear you.","Their effort to push the heavy van up the slope was futile, so they waited for help instead."],"bad":"Her futile effort was a great success, and she won every prize in the competition.","why":"Futile means pointless and without result, so it cannot describe an effort that wins prizes."},"gargantuan":{"ex":["We ate a gargantuan pizza that was bigger than the table.","A gargantuan crowd filled the stadium, so large that the end of the line was hard to see."],"bad":"I found a gargantuan ant on the floor that was smaller than a grain of rice.","why":"Gargantuan means enormously large, so it cannot describe something smaller than a grain of rice."},"gregarious":{"ex":["My gregarious uncle loves chatting with everyone at family parties.","The gregarious new pupil made friends quickly, sitting with a different group at the canteen each day."],"bad":"The gregarious girl hated company and spent every break hiding alone in the library.","why":"Gregarious means fond of company, so it cannot describe someone who hates being with others."},"haphazard":{"ex":["The toys were piled in a haphazard heap in the corner of the room.","Books lay in a haphazard way across the desk, with no order in how they had been placed."],"bad":"The soldiers marched in a haphazard line, with every person exactly in order and in step.","why":"Haphazard means random and without order, so it cannot describe neat, orderly marching."},"hypocrisy":{"ex":["It is hypocrisy to tell others not to litter and then drop your own rubbish.","The class laughed at his hypocrisy when he scolded a friend for being late, though he was late too."],"bad":"Everyone admired her hypocrisy because she always did exactly what she told others to do.","why":"Hypocrisy means saying one thing but doing another, so it does not describe someone who is consistent."},"idiosyncrasy":{"ex":["One idiosyncrasy of my grandfather is that he always wears a hat indoors.","Her odd idiosyncrasy of humming while she solved sums made her classmates smile, though it helped her think."],"bad":"Everyone in the world has the same idiosyncrasy, so nobody is different from anyone else.","why":"An idiosyncrasy is a habit or way of thinking peculiar to one person, so it cannot be shared by everyone."},"imminent":{"ex":["Dark clouds showed that rain was imminent, so we ran for the shelter.","With the final whistle imminent, the tired players gave one last push towards the goal."],"bad":"The festival happened last year, but its arrival is still imminent for everyone.","why":"Imminent means about to happen very soon, so it cannot describe something that already happened long ago."},"impeccable":{"ex":["Her handwriting is impeccable, with every letter neat and clear.","The waiter gave impeccable service, remembering every order and never making a single mistake at the hawker stall."],"bad":"The teacher said his impeccable essay was full of errors and needed to be rewritten.","why":"Impeccable means perfect and without fault, so it cannot describe an essay full of errors."},"impoverished":{"ex":["The impoverished village had little food and no clean water.","Volunteers brought books and warm meals to the impoverished families living in the poor area of the town."],"bad":"The impoverished man lived in a huge mansion and owned many cars and boats.","why":"Impoverished means very poor, so it cannot describe a man with a mansion and many cars."},"inadvertently":{"ex":["I inadvertently left my water bottle on the bus.","Kai inadvertently stepped on the cat's tail while walking in the dark and quickly said sorry."],"bad":"She inadvertently planned the whole surprise party for weeks and told everyone on purpose.","why":"Inadvertently means by accident without meaning to, so it cannot describe something done on purpose."},"invaluable":{"ex":["My dictionary is invaluable when I read hard words in stories.","The guide's advice was invaluable to the lost hikers, because it showed them the safe path home."],"bad":"The broken pencil was invaluable, so we threw it into the bin without a second thought.","why":"Invaluable means extremely useful, so it cannot describe something we throw away as useless."},"meticulous":{"ex":["He is meticulous about his homework and checks every answer with care.","The meticulous artist painted each tiny petal with a thin brush so that the flower looked real."],"bad":"The meticulous boy rushed through his work and did not check anything at all.","why":"Meticulous means very careful and precise, so it cannot describe rushing without checking."},"monotonous":{"ex":["Copying the same words fifty times was a monotonous task.","The monotonous hum of the air-conditioner and the long, unchanging road made the passengers sleepy."],"bad":"The monotonous fair was full of new games, bright shows and surprises at every turn.","why":"Monotonous means dull and repetitive, so it cannot describe a fair full of variety and surprises."},"obsolete":{"ex":["Old cassette players are obsolete because people now use phones for music.","The obsolete machine in the museum was once useful but is no longer made or used by anyone."],"bad":"The newest phone, released this morning, is already obsolete because it is the latest model.","why":"Obsolete means no longer used or out of date, so it cannot describe the very latest model."},"ominous":{"ex":["The ominous dark clouds made us worry that a storm was coming.","An ominous silence filled the empty void deck, and the flickering light made Lily hurry home."],"bad":"The ominous sunshine and gentle breeze made everyone feel sure that the day would be lovely.","why":"Ominous means giving a worrying sign that something bad will happen, not a pleasant, hopeful sign."},"plausible":{"ex":["His excuse that the bus broke down was plausible, so the teacher believed him.","It sounded plausible that the cat had knocked over the vase, since it was sitting right beside the mess."],"bad":"It is plausible that the moon is made of cheese, because that is clearly impossible.","why":"Plausible means seeming reasonable or likely, so it cannot describe something clearly impossible."},"pragmatic":{"ex":["Be pragmatic and bring an umbrella, because it often rains in the afternoon.","Taking a pragmatic approach, Mum chose the cheaper bag that worked well instead of the fancy one."],"bad":"The pragmatic girl made impractical plans that ignored real life and could never work.","why":"Pragmatic means sensible and practical, so it cannot describe plans that are impractical and unrealistic."},"resilient":{"ex":["Ming is a resilient boy who tries again after losing a game.","The resilient little plant grew back quickly after the heavy rain had flattened its leaves and stem."],"bad":"The resilient boy gave up forever and could never recover after one small mistake.","why":"Resilient means able to recover quickly from difficulty, so it cannot describe someone who never recovers."},"scrutinise":{"ex":["The teacher will scrutinise our work to look for small mistakes.","Dad had to scrutinise the map carefully before he found the narrow lane leading to the old temple."],"bad":"She did not scrutinise the contract at all and only gave it a quick, careless glance.","why":"Scrutinise means to examine closely and thoroughly, so a quick careless glance is not scrutinising."},"superfluous":{"ex":["A third spoon is superfluous because we only need two.","Cut every superfluous word from your story so that each sentence is short, clear and strong."],"bad":"The oxygen tank was superfluous, so the diver could not breathe underwater without it.","why":"Superfluous means more than is needed, so it cannot describe something that is absolutely necessary."},"turbulent":{"ex":["The turbulent sea tossed our small boat up and down.","It was a turbulent time in the class, with arguments and shouting breaking out every day."],"bad":"The turbulent lake was perfectly still and calm, with no ripples on the water at all.","why":"Turbulent means rough, unstable and full of disorder, so it cannot describe a calm, still lake."}};

const TOOLS={};
TOOLS.taboo=(m,s)=>cardTool(m,s,{items:TABOO,cats:['General','P5 vocab','P6 vocab'],timer:[60],score:{n:2,label:'Team'},render:c=>h('div',{},h('div',{class:'big'},c.w),h('div',{class:'forbid'},c.f.map(x=>h('span',{class:'tag bad'},'🚫 '+x)))),bank:{title:'All Taboo cards',fmt:c=>`<b>${c.w}</b> — not: ${c.f.join(', ')}`}});
TOOLS.balderdash=(m,s)=>{cardTool(m,s,{items:BALD,cats:['Classic obscure','P5 vocab','P6 vocab'],hidden:true,partial:true,btn:'New word ▶',revealLabel:'👁 Reveal real definition',render:(c,sh)=>h('div',{},h('div',{class:'catlabel'},'The word is'),h('div',{class:'big'},c.w),sh?h('div',{class:'ans'},'Real: '+c.d):h('div',{class:'ph'},'Definition hidden — players write fakes first')),bank:{title:'All words and real definitions',fmt:c=>`<b>${c.w}</b> — ${c.d}`}});s.append(Scoreboard({n:4,label:'Player'}).root,h('div',{class:'panel'},h('h4',{},'Scoring reminder'),'+1 for guessing the real definition',h('br'),'+1 for each vote your fake receives'));};
TOOLS.scatter=(m,s)=>{
  const L='ABCDEFGHIJKLMNOPRSTW'.split('');let cats=[],cur='',reveal=false;
  const letter=h('div',{class:'big',style:'font-size:6rem'},'?'),grid=h('div',{class:'cards',style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.5rem'});
  const timer=Timer([120,180]);
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
  const ansFor=(Lt,c)=>{const i=SC_ANS.cats.indexOf(c);const r=i<0||!SC_ANS[Lt]?null:SC_ANS[Lt][i];return r&&r.length?r.map(cap):null;};
  const rev=h('button',{class:'btn ghost',onclick:()=>{if(!cur||!cats.length){return;}reveal=!reveal;paint();}},'💡 Reveal possible answers');
  function paint(){
    letter.textContent=cur||'?';
    rev.textContent=reveal?'🙈 Hide possible answers':'💡 Reveal possible answers';
    grid.replaceChildren(...cats.map((c,i)=>{const a=reveal&&cur?ansFor(cur,c):null;return h('div',{class:'panel',style:'margin:0;font-size:1.15rem'},(i+1)+'. '+c,reveal&&cur?h('div',{class:'hint'},'💡 ',h('span',{},a?a.join(', '):'— no example —')):null);}));
  }
  const roll=()=>{cur=pick(L);reveal=false;paint();};
  const newCats=()=>{cats=shuffle(SC_CATS).slice(0,12);reveal=false;paint();};
  m.append(h('div',{class:'bigcard'},h('div',{class:'catlabel'},'Letter'),letter),h('div',{class:'btnrow'},h('button',{class:'btn',onclick:()=>{cur=pick(L);cats=shuffle(SC_CATS).slice(0,12);reveal=false;paint();timer.reset();timer.start();}},'▶ New round (letter + 12 categories + timer)'),h('button',{class:'btn alt',onclick:roll},'🎲 Re-roll letter'),h('button',{class:'btn alt',onclick:newCats},'↻ New categories'),rev),grid);
  // answer browser: every letter x category
  let bl='A';const bbox=h('ul',{});const bchips=chipRow(L.map(x=>[x,x]),bl,x=>{bl=x;fillBank();});
  function fillBank(){bbox.replaceChildren(...SC_CATS.map(c=>{const a=ansFor(bl,c);return h('li',{html:'<b>'+c+'</b> — '+(a?a.join(', '):'—')});}));}
  fillBank();
  m.append(h('details',{class:'bank'},h('summary',{},'Answer bank — every letter × category ('+(L.length*SC_CATS.length)+' combinations)'),bchips,bbox));
  bank(m,'All categories',SC_CATS);

/* ---------- games ---------- */
const G=(n,name,cat,players,tag,steps,notes,tool)=>({n,name,cat,players,tag,steps,notes,tool});
const GAMES=[
G(1,'Taboo','word','2+ teams (3–4 players each)','Describe the word without the forbidden ones.',['One player draws a card with a target word.','They must describe it <b>without</b> using the 5 forbidden words on the card.','The team has <b>60 seconds</b> to guess as many words as possible.','If a forbidden word is used, skip the card (no points).','Most words guessed wins.'],[['Example','Describe “TEACHER” without saying: school, student, educate, classroom, lesson']],'taboo'),
G(2,'Balderdash','word','4–8 players','Invent fake definitions and fool your friends.',['One player (the dasher) reads an obscure word.','Everyone else writes a fake definition on paper.','The dasher collects all definitions plus the real one and reads them aloud.','Players vote on which is real.','<b>Scoring:</b> 1 point for guessing correctly; 1 point for each vote your fake receives.','Rotate the dasher each round.'],[],'balderdash'),
G(3,'Scattergories','word','2–6 players','Race to list words by category — unique answers only.',['Roll the letter die (or randomly select a letter).','Set a timer for 2–3 minutes.','List words for 12 categories that start with that letter.','Example categories: Countries, Animals, Foods, Verbs, Authors.','<b>Scoring:</b> 1 point per unique answer; 0 if others wrote the same.','Most points after 3 rounds wins.'],[['Teacher tool','In <b>Play tools</b>, press <b>Reveal possible answers</b> to show sample answers for the current letter, or open the Answer bank to browse every letter × category.']],'scatter'),
G(4,'20 Questions','word','2+ players','Guess the secret person, place or thing.',['One player thinks of a person, place or thing.','Others ask up to <b>20 yes/no questions</b>.','Try “Is it alive?”, “Is it bigger than a car?”, “Can you eat it?”','Questioners try to guess before the 20 questions are used up.','If they guess correctly they win; otherwise the thinker wins.','Rotate who thinks of the object.'],[],'twenty'),
G(5,'Once Upon a Time','story','2–4 players (can adapt for more)','Tell a story and play your cards as you go.',['Each player gets story cards (characters, items, places, events).','Players take turns adding to a collaborative story.','Play a card from your hand when it is mentioned in the story.','First to use all their cards <b>and</b> play their “ending” card wins.','Others can interrupt if you pause or contradict yourself.'],[['No cards?','The Play tools tab deals digital hands. Or write topic cards on paper: characters, settings, objects, events.']],'ouat'),
G(6,'Just a Minute','story','3+ players','Speak for 60 seconds without hesitation, repetition or deviation.',['Give a player a random topic (“My favourite food”, “Robots”, “Rainy days”).','They must speak for 60 seconds without:<ul><li><b>Hesitation</b> (long pauses)</li><li><b>Repetition</b> (saying the same word/phrase)</li><li><b>Deviation</b> (going off-topic)</li></ul>','Other players challenge if a rule is broken.','If the challenge succeeds, the challenger continues speaking.','Whoever is speaking when 60 seconds ends gets a point.'],[],'jam'),
G(7,'Fortunately / Unfortunately','story','4+ players (whole class works)','Build a story that swings between good and bad luck.',['Start a story: “Once there was a boy who found a treasure map.”','Next player adds “Fortunately…” plus a positive development — “Fortunately, he had a shovel.”','Next adds “Unfortunately…” plus a problem — “Unfortunately, the map was in Chinese.”','Continue alternating.','The story builds collaboratively for 5–10 rounds.','No scoring — focus on creativity!'],[],'fortunately'),
G(8,'Two Truths and a Lie','comp','3+ players (whole class)','Spot the false statement.',['One player states three “facts” about themselves or a topic.','Two are true; one is false.','Others discuss and vote on which is the lie.','The player reveals the answer.','<b>Variation:</b> use curriculum facts (“Singapore facts”, “Science facts”).','Rotate to the next player.'],[],'truths'),
G(9,'Who Am I?','comp','2+ players','Guess the sticky note on your forehead.',['Write a character, famous person or vocabulary word on a sticky note.','Stick it on another player’s forehead (they cannot see it).','They ask yes/no questions: “Am I real?” “Am I from a book?”','Set a question limit (10–15) or a time limit.','If they guess correctly, they win.'],[['P5/6 adaptation','Use historical figures, book characters or vocabulary words.']],'whoami'),
G(10,'Boggle','quick','2–6 players','Find words in a 4×4 grid of letters.',['Shake 16 letter dice in a 4×4 grid tray.','Set a timer for 3 minutes.','Find words by connecting adjacent letters (horizontal, vertical, diagonal).','Letters must touch; you cannot reuse the same die in one word.','Words must be 3+ letters.','<b>Scoring:</b> 3-letter = 1pt, 4-letter = 1pt, 5-letter = 2pts, 6-letter = 3pts, etc.','Cross off duplicates; only unique words score.'],[['DIY version','Write random letters on a 4×4 grid.']],'boggle'),
G(11,'Contact','quick','4+ players','Guess the leader’s word before they can block you.',['One player (the leader) thinks of a word and reveals its first letter: “My word starts with C.”','Others try to guess by giving clues to each other. Player A: “Is it something you drive?”','If Player B understands, they say “CONTACT!”, both count to 3 and say their guess together.','If they match (“CAR! CAR!”), the leader must reveal the next letter.','The leader can “block” by guessing what they are thinking and saying it first.','Continue until the word is fully revealed or guessed.'],[],'contact'),
G(12,'Word Association Chain','quick','3+ players (whole class)','Keep the chain going without repeating or pausing.',['The first player says a word (e.g. “ocean”).','The next says a related word (“waves”).','The next continues the chain (“surfing”).','<b>Rules:</b><ul><li>Must be clearly related to the previous word</li><li>No repeating words already said</li><li>Hesitate more than 3 seconds and you are out</li></ul>','Last player standing wins.','<b>Challenge mode:</b> players explain their connection if challenged.'],[],'chain'),
G(13,'Hangman (Enhanced)','quick','2+ players / teams','Guess the word before the hangman is drawn.',['One player thinks of a word or phrase and draws blanks for each letter.','Others guess letters one at a time.','Correct guess = letter filled in; wrong guess = a body part is drawn.','Win by completing the word before the hangman is finished (typically 6–8 wrong guesses).'],[['P5/6 enhancements','Use themed word lists (idioms, PSLE vocabulary, book titles). Add hints after 3 wrong guesses. Team version: teams alternate guessing.']],'hangman'),
G(14,'Pictionary','create','4+ players (2+ teams)','Draw it — no words, letters or numbers.',['Divide into teams.','One player draws a word from a card (no speaking, no writing letters or numbers).','Their team has 60 seconds to guess.','The drawer can only draw pictures.','Correct guess = 1 point.','Rotate the drawer; the team with the most points wins.'],[['Categories','Objects, Actions, Difficult (idioms / abstract concepts)']],'pictionary'),
G(15,'Charades','create','4+ players (2+ teams)','Act it out silently.',['A player draws a card (book title, phrase, movie, action).','They act it out silently in front of their team.','Use the standard signals (see Play tools tab).','The team has 2–3 minutes to guess.','No speaking, pointing at objects, or mouthing words.','The team with the most correct guesses wins.'],[['Signals','Book = hands together like opening a book · Movie = crank an old camera · Number of words = hold up fingers · Syllables = lay fingers on arm · “Sounds like” = pull ear']],'charades'),
G(16,'Story Cubes','create','1+ players (great for groups)','Roll the images and weave them into one story.',['Roll 6–9 dice with images on each side.','The player must create a story using <b>ALL</b> the images shown.','The story should connect the images logically.'],[['Variations','<b>Solo:</b> create the best story you can · <b>Competitive:</b> a judge votes for the best · <b>Collaborative:</b> each person adds one sentence using one cube · <b>Timed:</b> 3-minute storytelling challenge'],['DIY','Draw simple icons on wooden cubes or paper dice templates.'],['Play tools','✨ <b>Spark</b> builds a story starter · 🔗 <b>Link mode</b> gives two ideas for connecting any two pictures · 🔤 <b>Vocab word</b> adds a challenge word with a model sentence.']],'cubes'),
G(17,'Codenames','logic','4+ players (2 teams)','Give one-word clues that link several words.',['Lay out 25 word cards in a 5×5 grid.','Each team has a “spymaster” who can see which words belong to their team.','The spymaster gives ONE-WORD clue + a number: “Animals, 3.”','The team discusses and touches the cards they think match.','Correct = reveal your team colour; opponent’s card helps them; the assassin = instant loss.','First team to find all their words wins.'],[['Simplified P5/6 version','Use a 3×3 grid with 9 words and simpler vocabulary.']],'codenames'),
G(18,'Apples to Apples Junior','logic','4–8 players','Match a noun to the adjective — the judge decides.',['Each player holds 5 red cards (nouns).','The judge flips a green card (adjective): “Scary.”','All players choose the red card from their hand that matches best.','The judge shuffles the submitted cards and reads them aloud.','The judge picks a favourite (funny, literal or creative).','The winner keeps the green card; first to 4 green cards wins.','Rotate the judge each round.'],[['Example','“Scary” might be matched with “Spiders”, “Tests” or “Thunderstorms”.']],'apples'),
G(19,'Sentence Relay','logic','2+ teams (3–5 per team)','Build a long sentence one word at a time — grammar must hold.',['The teacher gives a simple sentence starter: “The cat sat”.','The first player from Team A adds a word or phrase: “The cat sat on”.','The first player from Team B continues: “The cat sat on the”.','Keep adding to make the sentence longer but <b>grammatically correct</b>.','If a player makes the sentence incorrect or cannot continue within 10 seconds, the other team wins the round.','Best of 5 rounds.'],[['Challenge version','Specify the part of speech to add (adjective, prepositional phrase, clause).']],'relay'),
G(20,'Singlish vs Standard English','sg','2+ teams','Translate between registers — and discuss when each fits.',['The teacher/host reads a Singlish phrase: “Can lah, no problem one.”','Teams write down the standard English equivalent.','First correct answer gets a point: “Yes, it’s no problem at all.”','Discuss when each register is appropriate.','<b>Reverse mode:</b> give standard English; convert it to natural Singlish.'],[['Learning value','Understanding code-switching for the PSLE oral exam.']],'singlish')
];
