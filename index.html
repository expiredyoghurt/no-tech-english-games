s feet on the floor.","A flip-flop falls into a bell and rings it with a flap-flap sound that wakes the neighbours."],"23-24":["A girl wearing a paper crown sings one long music note at the school concert to end the show.","A music note lands on the crown, and the crown begins to play a royal tune."],"23-25":["A girl finds a puzzle piece with a music note printed on it, and the rest of the box turns out to be a piano jigsaw.","Each music note she plays makes a puzzle piece fly into place, building a picture of a hidden city."],"23-26":["A girl practises a high music note in front of a mirror to check the shape of her mouth.","The mirror sings back each music note, but always a little backwards."],"23-27":["A boy hears a music note drifting from a radio on a tiny island and follows it to a fishing boat.","The island hums a single music note, and anyone who hears it forgets how to feel sad."],"23-28":["An elephant at the zoo hears a music note from a flute and swings its trunk in time.","The elephant trumpets a music note so big that it paints the sky purple."],"23-29":["A girl draws a music note on a paper target to learn the notes for her recorder lesson.","A music note flies like an arrow and hits the target with a perfect ding."],"23-30":["On a breezy afternoon, the wind makes the strings of a kite hum a music note.","A music note rides the kite up to the clouds, where it joins a choir of thunderclaps."],"23-31":["A girl sings a music note as a rainbow appears over the playground after the shower.","Every colour of the rainbow plays a different music note, and together they make a song for the whole sky."],"23-32":["A boy uses a magnet to hold a paper music note on the whiteboard during the lesson.","A giant magnet pulls every music note out of the radio, and the town goes silent."],"23-33":["A girl blows out her birthday candle right after everyone sings the last music note of the song.","The flame of the candle dances to each music note, and its shadow sings back."],"23-34":["A boy rides his bicycle past the music school and hears a music note drifting from a window.","Each time the bicycle wheel turns, it plays a music note, so every ride becomes a song."],"23-35":["At night, an owl hoots a low music note that a girl copies on her flute.","The owl swallows a music note and then hoots out an entire orchestra."],"23-36":["A hawker whistles one happy music note as he swings the noodles in the wok.","The noodles curl themselves into a music note, and anyone who eats them sings for a week."],"23-37":["Each drop of rain on the tin roof makes a music note for a boy to hum.","The rain falls in the shape of a music note and turns every puddle into a drum."],"23-38":["A girl plays a music note on her violin on the deck of a sailboat as it leaves the harbour.","A single music note is the only wind the sailboat needs to cross the sea."],"23-39":["A boy shines a torch on his sheet music so he can read the next music note in the dark.","The torch lights up each music note in the air, and they flutter away like fireflies."],"23-40":["A girl packs a book of music note cards in her suitcase for the trip to the choir contest.","A suitcase hums a music note when opened, and a tiny band pops out to play."],"23-41":["An astronomer plays one music note on a keyboard for each planet in her class show.","A planet sings one music note, and the whole galaxy joins in with the song."],"23-42":["At the aquarium, a pianist plays a music note while an octopus waves its arms behind the glass.","The octopus plays eight instruments at once, and each music note comes out as a bubble."],"23-43":["A band at the circus tent plays a loud music note to start the show.","The circus tent is a giant instrument, and each music note makes it wobble and dance."],"23-44":["A girl draws a diamond shape around a music note on her sheet to mark where to pause.","A diamond rings with a music note when it is tapped, and the sound opens hidden doors."],"23-45":["A busker plays a music note on his guitar, and a boy drops a coin into his hat.","A coin that lands in the fountain turns into a music note and floats away."],"23-46":["A girl presses her teddy bear's tummy and it plays a music note.","The teddy bear sings a music note so soft that it puts the whole classroom to sleep."],"23-47":["A girl sings a music note across the lake and hears it echo back to her canoe.","A music note floats down the river, and the canoe follows it to a choir of mermaids."],"23-48":["A boy hums a music note as he waters the sunflower in the school garden.","The sunflower turns towards each music note as if it were a tiny sun."],"23-49":["A bee buzzes a steady music note as a girl listens from the garden bench.","The bee collects each music note like nectar and stores it as sweet songs in its hive."],"23-50":["A hiker shouts a music note at the mountain and hears it echo back across the valley.","A music note is hidden at the top of the mountain, and finding it makes the mountain sing."],"23-51":["A girl hears a music note as the telephone rings and realises it is her grandma's ringtone.","The telephone only rings with a music note, and the caller is the moon asking for a lullaby."],"23-52":["A hotel guest taps the reception bell, and the clerk smiles at the clear music note it makes.","Each tap on the reception bell sends a music note floating up the staircase to dance."],"23-53":["A boy's flip-flop squeaks a funny music note with every step on the wet tiles by the pool.","A flip-flop slaps out a music note, and the whole beach joins in with a flip-flap dance."],"24-25":["A girl solving a jigsaw of a king finds that the puzzle piece with the crown on it is missing.","The crown breaks into a hundred puzzle pieces, and only a clever child can put the king back together."],"24-26":["A boy tries a paper crown on in front of the mirror before his school play.","The mirror shows a girl wearing a crown, and the very next day it appears on her head."],"24-27":["A boy wins a crown made of shells at a beach party on the island.","The island is a sleeping king, and the crown of palm trees on its head wakes up when a child waves."],"24-28":["A boy dresses a paper elephant in a crown for the school parade float.","The elephant is crowned king of the jungle because it trumpets the loudest."],"24-29":["At the archery contest, the winner hits the target and takes home a golden crown trophy.","A crown appears on the target each time it is hit, and the hero must collect a hundred."],"24-30":["A girl decorates her kite with a gold crown shape for the kite festival.","A kite snatches the king's crown and flies off with it over the rooftops."],"24-31":["A girl draws a crown of rainbow colours for the school art contest.","The queen's crown is made from a rainbow, and each colour gives her a different power."],"24-32":["A teacher shows that a magnet cannot pick up a plastic crown but can lift a metal one.","A magnet pulls the crown from the king's head and it zooms across the room."],"24-33":["A girl wears a crown at her birthday party while she blows out the candle.","The candle melts into a crown shape, and whoever wears it can talk to dragons."],"24-34":["A boy wins the crown for the fastest bicycle in the school race.","The king rides a bicycle to the throne room with his crown tilted to one side."],"24-35":["At night, an owl lands on the statue's crown in the park and hoots at the people passing by.","The owl is the wise king of the night, and its crown glows in the dark."],"24-36":["A boy wears a paper crown at his birthday dinner and slurps the long noodles that wish him a long life.","The king orders noodles so long that his crown falls off while he slurps."],"24-37":["A school pageant crown is carried to the stage in the rain, so a girl shelters it under her jacket to keep it shiny.","Every time the crown is placed on a head, the rain stops, so the whole village fights over who wears it."],"24-38":["A boy wins a toy crown at the fair and sails home on the sailboat ferry, holding it tightly against the wind.","A tiny king steers his sailboat across the pond, wearing a crown made from a golden bottle cap."],"24-39":["During a power cut, a girl shines a torch around the attic and spots a dusty crown from an old school play.","The hero lights a torch inside a dark cave, and its beam makes the buried crown glow and hum."],"24-40":["At the airport, a suitcase bursts open and a glittering crown from a drama costume rolls across the floor.","A suitcase is so heavy that a crown inside it turns out to be the secret key to a hidden kingdom."],"24-41":["A boy builds a model planet for science fair and tops it with a paper crown as the ruler of space.","A crown floats through space until it lands on a lonely planet, where every creature bows to the first visitor."],"24-42":["At the aquarium, an octopus slides a plastic crown off a display and wears it proudly on its head.","An octopus rules the sea floor, and eight tiny servants polish its crown every morning."],"24-43":["A circus tent is packed for a show, where a clown wears a paper crown and pretends to be king for a day.","A lost crown lands in the circus tent, and whoever puts it on instantly becomes the star of the show."],"24-44":["A jeweller carefully fixes a loose diamond into a crown that is needed for the school concert tonight.","A wizard shrinks the largest diamond in the cave and sets it in a crown that grants one wish."],"24-45":["A girl finds a coin on the pavement and swaps it for a cardboard crown at the charity sale.","Each time a coin touches the crown, it grows heavier and heavier, until the king can barely lift it."],"24-46":["A teddy bear with a paper crown sits on the stage as the star of a toddler's birthday party.","The teddy bear wakes at midnight, puts on the crown and holds a royal meeting for all the toys."],"24-47":["On a camping trip, a boy paddles the canoe to an island to rescue a crown prop dropped overboard.","A river spirit lends a canoe to whoever carries the crown to the sea, so the journey takes only a night."],"24-48":["A girl weaves a crown from petals and stems and wears it beside the giant sunflower in the school garden.","The sunflower grows so tall that it lifts a small crown into the clouds, where a sky king waits."],"24-49":["A bee buzzes around the shiny crown at the school fair, thinking it is a giant flower full of nectar.","The queen bee wants a crown of her own, so the swarm flies off to borrow the king's."],"24-50":["Hikers reach the top of the mountain and a boy puts on a paper crown to celebrate being the king of the climb.","At the peak of the mountain, an ancient crown waits for someone brave enough to carry it back down."],"24-51":["The telephone rings during rehearsal, and a girl in a paper crown answers in her best royal voice.","A crown rings like a telephone, and the voice on the line gives the wearer a secret royal mission."],"24-52":["At a hotel front desk, a guest taps the reception bell and asks for a lost crown from the fancy dress party.","A king taps the reception bell and a crown floats out of the ceiling, demanding a room for the night."],"24-53":["A boy rushes to the drama club wearing one flip-flop, and a paper crown on his head makes him a funny king.","A king loses a flip-flop while running from his own palace, and the crown on his head rolls off after it."],"25-26":["A girl finds one puzzle piece stuck behind a mirror, and its picture completes the jigsaw that has been missing for weeks.","Whenever a puzzle piece touches the mirror, the glass ripples and shows a room that does not exist."],"25-27":["Pupils build a jigsaw of an island, but the last puzzle piece is missing and it takes a hunt to find it.","A giant puzzle piece washes ashore and, when it fits the island, the whole shoreline moves."],"25-28":["A boy is sorting a giant jigsaw at the zoo shop when an elephant picture needs just one more puzzle piece.","An elephant sneezes out ddles."],"25-38":["On a family trip, a toddler throws a puzzle piece into the sea, and a sailboat has to turn around to get it.","A sailboat made of puzzle pieces falls apart on the waves, and the crew must put it back together to sail on."],"25-39":["A boy shines a torch under the bed and finds the missing puzzle piece for the jigsaw he started last week.","When a torch lights up a puzzle piece, a tiny glowing path appears across the floor and leads to treasure."],"25-40":["A girl opens her suitcase after a holiday and finds a puzzle piece from her cousin's jigsaw tucked inside.","A suitcase swallows one puzzle piece, and once the case is full, it opens a door to a hidden world."],"25-41":["A teacher sets a space project where each pupil makes a puzzle piece of the solar system, and a boy chooses a planet.","A puzzle piece falls from the sky onto the planet, and it tells the aliens the whole world is part of a bigger picture."],"25-42":["A diver at the aquarium shows how an octopus can solve puzzles by opening a jar with a puzzle piece inside.","An octopus juggles eight puzzle pieces at once and assembles a treasure map before the tide comes in."],"25-43":["At the circus tent, a clown balances a puzzle piece on his nose as part of a funny new act.","The circus tent is a puzzle piece away from being complete, and a missing piece makes the whole show disappear."],"25-44":["A girl fits a puzzle piece into a jigsaw of a mine and then finds a real diamond among the cut-out shapes.","Each puzzle piece hides a tiny diamond, so putting them together makes the jigsaw sparkle brighter than the sun."],"25-45":["A boy trades a coin for a puzzle piece at the school bazaar so that he can finish his jigsaw.","A coin slips into a magic slot, and a puzzle piece pops out that nobody has ever seen before."],"25-46":["A toddler hides a puzzle piece in the arm of her teddy bear, and her brother searches everywhere for it.","The teddy bear is stuffed with puzzle pieces, and when someone hugs it, it can piece together any secret."],"25-47":["A boy paddles the canoe across a lake to deliver a puzzle piece that his friend left at camp.","A puzzle piece floats on the water like a canoe, carrying a tiny explorer towards a hidden waterfall."],"25-48":["A bee lands on a sunflower and a girl notices that its petals look like a puzzle piece from a game.","A puzzle piece grows out of a sunflower seed, and each night it rearranges itself to make a new picture."],"25-49":["A bee flies into the classroom and lands on a puzzle piece, so everyone freezes to avoid disturbing it.","A bee carries one puzzle piece back to its hive, where the queen needs it to open a golden door."],"25-50":["Hikers collect a puzzle piece from the mountain trail map and discover it fits the notice board at the top.","A puzzle piece falls from the sky and lands on the mountain, which begins to change shape to fit it."],"25-51":["The telephone rings, and a puzzle piece on the table lights up to tell a girl where the missing jigsaw is.","A puzzle piece answers the telephone, and the caller is a giant looking for the last piece of the moon."],"25-52":["At the front desk, a girl taps the reception bell and asks if anyone has seen a puzzle piece left behind.","Each tap of the reception bell makes a puzzle piece appear from nowhere, and the hotel slowly builds itself."],"25-53":["A boy finds a puzzle piece stuck to the bottom of a flip-flop and wonders where in the house it came from.","A giant flip-flop stomps into town and leaves one puzzle piece behind with each step it takes."],"26-27":["A boy looks into a mirror at the beach and sees a reflection of an island far away across the bay.","When the girl looks into the mirror, she sees an island that appears in the sea as soon as she looks away."],"26-28":["At the zoo, an elephant stands before a mirror and appears to meet its twin for the first time.","The mirror shows an elephant that is much bigger than the real one, and it steps out of the glass."],"26-29":["A girl uses a mirror to angle a ray of sunlight onto a target so that her friend can aim at it.","When the hero hits the target, the mirror cracks open and a secret passage appears behind it."],"26-30":["A boy holds up a mirror to flash the sun at his kite so his friend can find it in the sky.","The kite flies into the mirror and comes out the other side, trailing a tail made of silver light."],"26-31":["After the storm, a girl holds a mirror up to the sky and bounces a rainbow onto the classroom wall.","The mirror catches a rainbow and the hero steps through it into a land where everything is multicoloured."],"26-32":["A boy finds that a magnet sticks to the back of an old mirror, which hides a small metal safe.","A magnet pulls on the mirror, and the glass begins to pull the reflection of everyone nearby out into the room."],"26-33":["A girl moves a candle near a mirror and the room looks twice as bright, scaring away the shadows of the dark.","The candle burns without any wax, and in the mirror it shows a flame that predicts tomorrow."],"26-34":["A boy rides his bicycle past a shop window and sees himself in a mirror, noticing that his helmet is crooked.","A bicycle rolls into the mirror, and a second rider on the other side pedals backwards to meet it."],"26-35":["An owl perches in front of a mirror in the attic and ruffles its feathers at its own reflection.","The mirror shows an owl that gives wise advice, but only to those who ask it three questions."],"26-36":["A hawker gazes into a mirror behind the stall and sees noodles splashing onto his shirt, so he cleans up before serving.","When a girl blows steam from the noodles across the mirror, a secret message appears in the mist."],"26-37":["The rain splashes the mirror in the corridor, and a girl sees a rainy reflection that looks like a blurred painting.","The rain falls upward in the mirror world, and a boy must jump through to bring it back down."],"26-38":["A girl spots a sailboat re e beach of a quiet island, a boy flies his kite high above the palm trees to signal a passing boat.","A kite lifts the entire island off the sea and floats it up into the sky, with all the fish swimming below."],"27-31":["After a sudden storm, a rainbow arcs over the island and a girl hopes it points to something buried in the sand.","A rainbow lands on the island like a bridge, and the colours slide down to paint every rock and leaf."],"27-32":["A boy walks around an island with a magnet and picks up bottle caps and nails until the whole beach is tidy.","A magnet hidden under the island pulls every ship towards its shore, and the sailors cannot sail away."],"27-33":["A family on a camping trip light a candle on the island when the lamp runs out, and its glow shows a cave.","Every night a candle appears on the island, and a ship comes in from the sea to follow its glow."],"27-34":["A boy rides a bicycle around the small island, discovering a hidden cove that he had not seen before.","A bicycle with huge wheels rolls from island to island across the waves, and a girl has to hold on tight."],"27-35":["An owl lives in the only tree on the island and watches over each fishing boat that comes home at night.","An owl wearing a captain's hat flies the whole island to a new place each night while everyone sleeps."],"27-36":["A hawker on the island cooks a bowl of noodles for hungry visitors off the ferry.","The island is shaped like a bowl of noodles, and the steam rises from a hidden volcano."],"27-37":["The rain pours down on the island all week, so the villagers begin to build a tiny dam to catch the water.","The rain falls on the island only, and the clouds follow the hero wherever he walks."],"27-38":["A girl on the sailboat spots a new island, and the crew decide to land and explore its beach.","A sailboat floats across the sky and drops anchor on an island that is really a sleeping whale."],"27-39":["A girl lights a torch to cross the dark island after sunset and finds a message carved in the rocks.","The torch is the only thing that glows on the island, so the creatures follow it everywhere it goes."],"27-40":["A girl drags her heavy suitcase across the sand on the island, wondering if she packed too much.","A suitcase washes up on the island, and out of it steps a tiny town with its own streets and shops."],"27-41":["A scientist on a lonely island watches a planet through a telescope and guesses it is closer than ever.","The island is actually a small planet that fell from space, and the sea is full of stars."],"27-42":["A boy snorkels near the island and sees an octopus changing colour to hide among the rocks and seaweed.","An octopus builds an island from shells, and every arm holds a different tiny house."],"27-43":["A travelling circus tent is set up on the island, and the whole village comes down to the beach to watch.","The island is really a giant circus tent that sank, and its top pokes out of the sea."],"27-44":["A diver finds a diamond near the island's reef and takes it to the museum to find out whether it is real.","The diamond sparkles so brightly that the whole island glows, and the sea creatures gather round to see."],"27-45":["A boy digs in the sand on the island and unearths an old coin that might belong to a long-lost ship.","A coin tossed into the sea near the island makes the whole island rise up and float."],"27-46":["A little girl's teddy bear is washed ashore on the island, and a kind fisherman returns it to her.","The teddy bear is the leader of the island and gives out orders to the crabs and parrots."],"27-47":["A pair of friends paddle a canoe to a small island and decide to camp out for the night.","A canoe carries a tiny explorer to an island made of clouds that floats above the sea."],"27-48":["A single sunflower grows in the middle of the island, and a boy plants more seeds so it is not lonely.","A sunflower on the island turns to follow the sun, and slowly it tilts the whole island with it."]," n in a storm."],"28-34":["A boy on a bicycle rides alongside the zoo fence, and an elephant leans over as if racing him.","An elephant rides a tiny bicycle in the circus, but its wheels squash flat each time it pedals."],"28-35":["At the night safari, an elephant walks slowly past a tree where a large owl watches from a branch.","An owl whispers to the elephant that it can fly, so the elephant climbs a tree to try."],"28-36":["A hawker feeds an elephant statue a bowl of noodles as part of a parade in the festival.","An elephant slurps up a bowl of noodles with its trunk and accidentally sucks up the whole kitchen."],"28-37":["When the rain comes down in the jungle, an elephant shelters under a huge leaf and waits for it to stop.","An elephant dances in the rain, and every puddle it steps in becomes a deep blue lake."],"28-38":["On a family holiday, a boy sees an elephant bathing near a sailboat in the shallow water.","An elephant is the captain of a sailboat, using its big ears as sails to catch the wind."],"28-39":["At night in the zoo, a keeper shines a torch to check on an elephant, who blinks sleepily in the light.","An elephant uses its trunk as a torch, and the beam of light leads lost animals home."],"28-40":["A zookeeper carries a suitcase full of peanuts to feed the elephant, which has been waiting by the gate.","An elephant fits inside a small suitcase, and nobody at the airport can work out how it got there."],"28-41":["A boy reads about an elephant who is brave enough to visit a faraway planet in a space story.","An elephant is shot into space and lands on a planet where everything is tiny."],"28-42":["At the aquarium, an elephant statue sits by a tank where an octopus waves one arm at it.","An elephant and an octopus swap places, so one is stuck in the sea and the other is lost in the jungle."],"28-43":["An elephant performs in the circus tent, standing on a stool while a crowd cheers loudly.","The elephant is so big that the circus tent turns into a hat when it sits down."],"28-44":["A museum guard finds a diamond stuck to the tusk of an elephant statue, and the clue leads to a thief.","An elephant swallows a diamond by mistake, and the whole jungle must help to get it back."],"28-45":["A boy gives a coin to a man who lets him ride on the elephant at the festival.","Every time the elephant stamps, a coin pops out of the ground and rolls away."],"28-46":["A little girl falls asleep hugging a teddy bear, and in her dream, an elephant takes them both for a walk.","A teddy bear tames a wild elephant by sharing a honey sandwich, and now they are best friends."],"28-47":["On a river trip, a boy paddles a canoe past an elephant that is cooling off in the muddy water.","An elephant uses its trunk to paddle a canoe up a waterfall to find the source of the river."],"28-48":["An elephant at the zoo eats a sunflower that a girl has brought as a gift and seems to enjoy it.","The sunflower is as tall as the elephant, and the two of them swap hats every morning."],"28-49":["A bee buzzes near an elephant's ear at the zoo, and the elephant flaps it away with a big swish.","A bee and an elephant swap sizes after a spell, and the bee has to find a way to cope."],"28-50":["A herd of elephants walks slowly down the mountain trail to find water before the dry season ends.","An elephant carries the whole mountain on its back, and whenever it sneezes, snow falls."],"28-51":["A telephone rings in the zoo office, and a keeper learns that an elephant has wandered out of its enclosure.","An elephant answers the telephone with its trunk and is asked to look after the moon for the night."],"28-52":["At the zoo's front desk, a boy taps the reception bell, and a keeper bursts out to say the elephant is hungry.","An elephant stands at the reception bell of a hotel and books the biggest room in the building."],"28-53":["A boy finds a giant flip-flop at the zoo and wonders if it could ever belong to the elephant.","An elephant wears a flip-flop on m at it.","The torch only works when pointed at the target, and then its beam bends around corners."],"29-40":["A boy packs the target and its stand into a suitcase and carries it to the school sports day.","A suitcase is the only target a cunning magician cannot hit, because it vanishes whenever he aims."],"29-41":["A teacher paints a target on the wall and asks pupils to guess where a planet sits among the stars.","An archer aims at a planet that is shaped like a bullseye, and her arrow turns into a comet."],"29-42":["At the aquarium, an octopus squirts ink at a target on the glass to win a fish treat.","An octopus holds eight bows at once and hits eight targets before anyone can blink."],"29-43":["In the circus tent, a performer hits the target blindfolded and the crowd claps in amazement.","The circus tent is covered in targets, and the juggler must hit each one with a flying hat."],"29-44":["A girl wins a prize for hitting the target at the fair, and it turns out to be a plastic diamond.","A real diamond hangs in the middle of the target, and nobody can hit it without making a wish."],"29-45":["A boy flicks a coin at the target at the fair and wins a prize if it lands in the centre.","Every time the arrow hits the target, a golden coin pops out, and the archer grows richer by the minute."],"29-46":["At the fair, a girl hits the target and wins a giant teddy bear as her prize.","A teddy bear stands in front of the target, and each arrow that hits it bounces back and tickles the archer."],"29-47":["At camp, a boy paddles a canoe past the target on the shore and hits it with a bean bag.","A canoe races down a rapid and the paddler has to hit the target on the other bank before the end of the river."],"29-48":["A girl paints a target on the wall of the school garden beside a tall sunflower and plays a ball game.","The sunflower turns to follow the target, and every arrow that lands in it makes it grow taller."],"29-49":["A bee lands on the bullseye of the target an t at the end of the rainbow and a wish-granting fairy floats out of the flame."],"31-34":["A boy cycles through the sprinkler spray on his bicycle and sees a rainbow appear in the mist.","The rider pedals the bicycle along the rainbow, and each colour makes the wheels glow brighter."],"31-35":["After a rain shower, an owl sits on a branch and watches a rainbow fade as the sun goes down.","A sleepy owl guards the rainbow at night and hoots whenever a colour tries to escape."],"31-36":["A girl steams a bowl of noodles at the kopitiam window and sees a rainbow arching over the car park.","The rainbow lands in a bowl of noodles and every strand turns into a different flavour."],"31-37":["When the sun comes out after heavy rain, a rainbow appears and the whole class rushes to the window.","Each drop of rain becomes a tiny rainbow, and the town glitters like a jewel box."],"31-38":["A sailboat crosses the harbour just as a rainbow appears, and the sailors snap photos of it.","A sailboat sails under the rainbow as if it were a bridge, and it comes out the other side in a new world."],"31-39":["A hiker lifts a torch towards the misty waterfall and sees a small rainbow shimmer in the beam.","A torch beam splits into the seven colours of a rainbow, and the hero must follow each one to find the hidden treasure."],"31-40":["A girl packs a suitcase for the trip, and the last thing she pins on it is a rainbow sticker.","A suitcase opens, and a rainbow shoots out, painting the room in every colour at once."],"31-41":["An astronomy club looks at a planet through a telescope and notices its rings glow like a rainbow.","A planet's surface is a giant rainbow, and travellers slide between its colour zones in a space tram."],"31-42":["At a science museum, an octopus in the tank changes colour like a rainbow while pupils watch and draw.","An octopus paints a rainbow across the ocean with its ink, one colourful arm at a time."],"31-43":["A rainbow appears above the circus tent as the show  night, a gardener points a torch at a sunflower to check whether it is blooming early.","The sunflower turns toward the beam of the torch, thinking the light is a new sun."],"39-49":["A beekeeper uses a red torch at night so that the bee hive stays calm while she works.","A bee follows the torch beam like a tiny runway, and lands to carry secret messages in it."],"39-50":["Hikers walk up the mountain before sunrise with a torch strapped to each forehead, hoping to see the first light.","The torch is the key to the mountain, and shining it on the right rock opens a cave."],"39-51":["When the power fails, a girl uses the torch to find the telephone and report the blackout.","A torch rings like a telephone, and the voice from its beam tells the hero where the lost city is."],"39-52":["On a dark night, a clerk uses a torch to find the reception bell on the desk.","When the torch shines on the reception bell, a ghostly butler appears and offers to carry bags."],"39-53":["A camper loses a flip-flop at night, and finds it with the help of a torch near the tent.","A flip-flop glows when it is touched by the torch, and it leaves bright footprints behind."],"40-41":["An astronaut packs her suitcase for the first school trip to a space museum, hoping to see a real planet model.","The suitcase is a doorway to another planet, and every time it clicks open, a new world waits."],"40-42":["At the airport, a suitcase is opened to find a toy octopus that a girl bought as a gift.","An octopus hides inside a suitcase, and each arm grabs a different piece of luggage from the carousel."],"40-43":["A family drives to see the circus tent, and the boy carries a small suitcase of snacks for the show.","The suitcase is a tiny circus tent that unfolds when opened, and the performers tumble out."],"40-44":["A jeweller carries a diamond in a small suitcase, so the pupils must find the shop in a busy mall.","A suitcase filled with diamonds is lost on the MRT, and the finder must work out whose it is."],"40-45":["A boy saves every coin in a suitcase under his bed to pay for a trip to see his cousin.","A suitcase swallows each coin dropped into it and rewards the giver with a surprising souvenir."],"40-46":["A little girl cannot sleep without her teddy bear, so she squeezes it into the suitcase before the trip.","The teddy bear packs itself inside a suitcase and mails itself to the person who needs a hug most."],"40-47":["On the camping trip, the group packs a suitcase of snacks into the canoe and paddles across the lake.","A canoe floats on a puddle, and a suitcase hops out, ready to explore a new country."],"40-48":["A florist carries a suitcase full of seeds and plants a sunflower in the school garden.","A sunflower grows right out of the suitcase, and its petals open to show a tiny map."],"40-49":["A bee sneaks into the suitcase at the hotel, and the traveller carries it unseen to a new city.","The bee buzzes the suitcase upstairs and refuses to let anyone unpack until they say please."],"40-50":["Climbers pack a suitcase with warm clothes and set off to the mountain for a cold weekend.","The mountain has a secret door, and inside is a giant suitcase that holds the whole sky."],"40-51":["A man leaves his suitcase at the airport and uses the telephone to ask if anyone has found it.","The suitcase rings like a telephone, and a faint voice inside begs someone to let it out."],"40-52":["After a long journey, a family drags the suitcase to the front desk and taps the reception bell.","The reception bell chimes by itself, and the suitcase marches to the counter on little legs."],"40-53":["A boy rushes to catch a flight with one flip-flop in his suitcase and the other on his foot.","The flip-flop jumps out of the suitcase and flaps away along the airport floor like a fish."],"41-42":["Scientists compare the planet in the textbook with an octopus model, because both have clever, odd features.","A giant octopus lives on a faraway planet and holds the whole world "A boy wearing flip-flops walks into the dome and is told to put on shoes before the planet show.","A flip-flop falls off a rocket and lands on a faraway planet, where it becomes a boat."],"42-43":["The aquarium sets up a circus tent for the school fair, and an octopus show is the main act.","An octopus juggles eight balls in the circus tent, and the crowd cheers louder with every throw."],"42-44":["A diver brings up a diamond ring from the sea floor and finds an octopus resting inside it.","The octopus guards a diamond in its cave and gives a riddle to every visitor who tries to take it."],"42-45":["At the aquarium, children throw a coin into the fountain, and the octopus slowly reaches up to catch it.","The octopus collects every coin that falls into the sea and uses them to build a golden palace."],"42-46":["A toy octopus sits beside the teddy bear on a shelf, and a girl pretends they are best friends.","The teddy bear and the octopus swap places at night, and no one notices in the morning."],"42-47":["A marine biologist paddles a canoe over the reef to watch an octopus change colour near the rocks.","A giant octopus lifts a canoe on its back and carries the paddler across the ocean."],"42-48":["A girl draws an octopus with petals for arms, and her teacher says it looks like a sunflower.","An octopus plants a sunflower in the sand, and the flower grows towards the surface of the sea."],"42-49":["A bee flies over the sea, and a curious octopus watches it from below the waves.","A bee lands on the octopus and tries to sip nectar from its head, so the octopus laughs."],"42-50":["Scientists dive near the mountain under the sea and discover an octopus living in a crack.","An octopus climbs the mountain using all eight arms and plants a flag at the very top."],"42-51":["A phone call from the aquarium warns that an octopus has escaped its tank, so the telephone rings for the keeper.","The octopus answers the telephone with one arm and uses the other seven to do its homework."],"42-52":["An octopus at the hotel aquarium taps the reception bell with an arm, and the guests laugh and clap.","The octopus rings the reception bell with all eight arms, so a whole hotel of sea creatures checks in."],"42-53":["A boy loses his flip-flop at the beach, and an octopus tucks it into its den.","An octopus wears eight flip-flops, and the whole sea can hear it slapping along the floor."],"43-44":["A thief pretends to be a clown in the circus tent, and the police find a hidden diamond in his hat.","A diamond is the star of the circus tent, and acrobats flip and spin around it in the dark."],"43-45":["A boy saves every coin to buy a ticket to the circus tent for his birthday.","The ringmaster of the circus tent pays the performers with one magic coin that never runs out."],"43-46":["At the circus tent, a girl wins a teddy bear at a game stall and carries it home.","The teddy bear sneaks into the circus tent at night and learns to walk the tightrope."],"43-47":["A circus tent is set up by the river, and the performers arrive by canoe with their props.","The circus tent floats away like a canoe, and the clowns paddle with giant spoons."],"43-48":["A circus tent stands in a sunflower field, and the clown picks one to give to a small girl.","The sunflower grows so tall that it holds up the circus tent like a giant pole."],"43-49":["A bee flies inside the circus tent and lands on the clown's nose, so the crowd laughs.","The bee is the ringmaster, and every insect in the circus tent follows its buzzing orders."],"43-50":["The circus tent is packed up and carried over the mountain to the next town by trucks.","A mountain turns into a circus tent when the sun sets, and the rocks perform acrobatic tricks."],"43-51":["A telephone rings backstage in the circus tent, and the manager hears that the star act is late.","The telephone rings inside the circus tent, and the clown realises the caller is the moon."],"43-52":["The circus tent opens, and a clerk taps the reception bell to start selling tickets.","The reception bell grows as big as the circus tent, and its chime wakes all the sleeping elephants."],"43-53":["A clown loses his giant flip-flop in the circus tent, so everyone helps to search the seats.","The flip-flop bounces on the circus tent like a trampoline, and the clown flies higher than the roof."],"44-45":["A shopkeeper asks a girl whether a shiny diamond or an old coin is worth more.","A coin turns into a diamond when it is polished with a rainbow, but only for one night."],"44-46":["A little boy finds a diamond in the pocket of his old teddy bear and hands it to his mum.","The teddy bear has a diamond heart, and its glow shows kids the way when they are scared."],"44-47":["Explorers paddle a canoe up a quiet river hoping to reach a cave where a diamond sparkles.","A diamond rides in a canoe, and each time it sparkles, the river carries it faster."],"44-48":["A girl finds a diamond ring in a sunflower patch, and she hands it to the school gardener.","The sunflower has a diamond in its centre instead of seeds, and it sparkles whenever the sun is out."],"44-49":["A bee lands on a diamond, thinking it is a drop of dew, and tickles a girl's hand.","The bee makes honey from a diamond, so its sweet taste lasts forever."],"44-50":["A mining team finds a diamond deep inside the mountain and shares the news in the town.","The mountain is a giant diamond, and it hides under a coat of snow to stay secret."],"44-51":["A shop assistant uses the telephone to tell the owner that a diamond has gone missing.","A diamond rings like a telephone, and the voice inside it asks to be taken home."],"44-52":["A guest hands a diamond to the hotel clerk, who taps the reception bell for security.","Whenever the reception bell is rung, a diamond appears on the counter, but only for polite guests."],"44-53":["A girl wearing a flip-flop kicks something shiny on the beach, and it turns out to be a diamond.","A flip-flop with a diamond on the strap is the missing prize, and the hero hops around to find its twin."],"45-46":["A boy finds a coin inside his teddy bear and uses it to buy a gift for his sister.","The teddy bear collects coins and hides them in a tree, so squirrels call it the bank."],"45-47":["A girl tosses a coin into the river from a canoe and makes a wish for rain.","A coin is the paddle for a tiny canoe, and the boat travels as fast as a spinning top."],"45-48":["A girl sells sunflower seeds at the market and saves every coin she earns for her school fees.","When a coin is planted under a sunflower, a money tree sprouts, so the whole village grows rich."],"45-49":["A bee hovers above a coin on the grass, and a boy sees that it has a bee on one side.","The bee pays for nectar with a golden coin, and flowers hold a tiny shop where they sell it."],"45-50":["Hikers leave a coin at the top of the mountain for luck, as people have done for years.","A coin rolls down the mountain and grows into a wheel the size of a house."],"45-51":["A boy puts a coin into an old telephone booth and rings his grandma to say hello.","The telephone only works when it is fed a magic coin, and then it connects you to the past."],"45-52":["A guest drops a coin on the counter, then taps the reception bell for the clerk.","The reception bell eats the coin and pays back with a shout that echoes through the hotel."],"45-53":["A coin falls out of a flip-flop as a boy walks, and he hears it clink on the pavement.","A coin hides inside a flip-flop and jingles whenever a boy skips, so the whole street hears."],"46-47":["A teddy bear sits in the bow of a toy canoe as a child pushes it across the paddling pool.","The teddy bear paddles a canoe down a river of honey to find the sweetest cave of all."],"46-48":["A girl plants a sunflower and puts her teddy bear beside it to watch the garden grow.","The teddy bear rides on the sunflower like a swing, and they both spin in the wind."],"46-49":["A bee lands on a teddy bear in the garden, and the girl worries it will sting.","The teddy bear loves honey so much that a bee brings it a pot every day."],"46-50":["A boy takes his teddy bear to the top of the mountain, and they both gaze at the clouds.","The teddy bear grows to the size of a mountain and gives a hug to the whole town."],"46-51":["A girl calls her grandma on the telephone to tell her that the teddy bear has gone missing.","The teddy bear answers the telephone every night and tells a long story to the person who calls."],"46-52":["A boy leaves his teddy bear at the hotel, and he taps the reception bell to ask if it has been found.","The teddy bear rings the reception bell and orders a thousand pots of honey for its friends."],"46-53":["A puppy runs off with a flip-flop and the girl chases it and finds her teddy bear too.","The teddy bear wears a flip-flop as a hat, and every time it slaps on its head, it sings."],"47-48":["A family paddles a canoe past a field of sunflower plants and stops to take a photo.","The canoe is full of sunflower seeds, and when the river flows, a golden garden grows on its banks."],"47-49":["A bee lands on the end of the canoe paddle, and a boy keeps very still until it flies off.","A swarm of bee friends pull a canoe over the sand, and they sing as they go."],"47-50":["Two friends paddle the canoe along a river that curves around the mountain to a camp site.","The canoe slides up the mountain on a waterfall that flows upwards and drops the paddlers at the peak."],"47-51":["On a canoe trip, a scout has no signal on his telephone, so he waves a flag for help.","The telephone rings from inside the canoe, and a frog asks for a lift across the pond."],"47-52":["At the canoe hire hut, a boy taps the reception bell and asks for a paddle.","The reception bell rings itself whenever a canoe floats past, and a river sprite waves a thank-you."],"47-53":["A girl loses her flip-flop in the river and chases it downstream in a canoe.","A flip-flop turns into a canoe and carries a small boy across the waves to his lost hat."],"48-49":["A bee visits a sunflower in the garden and pollen sticks to its legs.","The sunflower sings a song that calls every bee in the land to a secret feast."],"48-50":["A sunflower grows on the slope of the mountain, where it receives the first morning sunlight.","A giant sunflower grows at the top of the mountain, and the sun comes down to rest on it."],"48-51":["A farmer uses the telephone to book a lorry for her sunflower harvest next week.","The sunflower is a telephone, and its petals ring whenever a bee lands to sip."],"48-52":["A florist taps the reception bell to deliver a bunch of sunflower to a hotel guest.","When the reception bell is rung, a sunflower pops up from behind the counter and says hello."],"48-53":["A girl wearing flip-flops walks through a sunflower field and the petals brush her toes.","A sunflower wears a flip-flop on each leaf and stomps through the field when no one is looking."],"49-50":["A bee flies over the mountain and follows the flowers up the slope to find nectar.","A bee carries the entire mountain on its back, because the mountain is made of honey."],"49-51":["A beekeeper uses a telephone to ask an expert why the bee colony is moving house.","The telephone buzzes like a bee, and when it answers, the voice says the hive needs help."],"49-52":["A bee flies into the hotel lobby, and the clerk taps the reception bell to call for help.","The bee rings the reception bell with its stinger, and the clerk gives it a room full of flowers."],"49-53":["A bee lands on a flip-flop left by the pool, and a girl waits until it has flown away.","The bee wears a flip-flop as a hat, and the whole hive laughs at the funny sight."],"50-51":["On the mountain top, there is no signal, so a hiker climbs down until the telephone rings.","The mountain has a telephone at the top, and whoever answers can ask it for one wish."],"50-52":["At the mountain hut, tired hikers tap the reception bell to ask for beds and hot soup.","The reception bell on the mountain echoes through the valley, and a giant answers from the clouds."],"50-53":["A hiker wears a flip-flop on the mountain trail and has to go back for proper boots.","A giant flip-flop slides down the mountain like a sled, and the villagers scream with joy."],"51-52":["A hotel guest picks up the telephone to ask who tapped the reception bell at night.","The telephone and the reception bell chat to one another in the night about the guests they have met."],"51-53":["A girl hears the telephone ringing while she is outside, and she kicks off her flip-flop to run in.","A flip-flop rings like a telephone, and the voice in the sole says where the pair has gone."],"52-53":["A boy in a flip-flop taps the reception bell at the hotel to ask for a towel.","The reception bell is stolen by a flip-flop that hops away down the corridor, ringing as it goes."]};
const VEX={"rummage":{"ex":["I had to rummage through my school bag to find my ruler.","Grandma rummaged through the old drawers at the void deck sale, hoping to find a cheap wooden spoon."],"bad":"The teacher rummaged neatly through the folders, putting every paper back in perfect order.","why":"Rummage means to search in a messy, untidy way, so a neat and orderly search is not rummaging."},"ransack":{"ex":["The naughty cat ransacked the kitchen, knocking over pots and scattering food everywhere.","After the storm, the strangers ransacked the empty shop, tearing open boxes and taking whatever they could carry."],"bad":"I ransacked my pencil case for a few seconds and calmly picked out the blue pen.","why":"Ransack means to search a place wildly, stealing and causing damage, so it cannot describe a calm, careful search."},"dawned on":{"ex":["It suddenly dawned on me that today was my best friend's birthday.","As the MRT pulled away, it dawned on Mei Ling that her umbrella was still on the platform bench."],"bad":"The sun dawned on my homework, so I finished it quickly before dinner.","why":"Dawned on means a realisation came to someone's mind, so it cannot be used for the sun and homework."},"capacity":{"ex":["The lift has a capacity of ten people, so we waited for the next one.","The hawker centre was filled to capacity at lunchtime, and many hungry customers had to wait for tables."],"bad":"My capacity of the water bottle is blue and has a picture of a dolphin.","why":"Capacity means the greatest amount something can hold, so it cannot describe the colour or look of a bottle."},"dire":{"ex":["The farmer said the dry weather had put the crops in dire need of rain.","Stranded on the island without food or water, the travellers knew their situation was dire and rescue was urgent."],"bad":"We had a dire birthday party with lovely cake, fun games and many happy friends.","why":"Dire means extremely serious or urgent, so it cannot describe a happy, enjoyable party."},"atrocious":{"ex":["The cruel prank was atrocious, and the whole class felt sorry for the victim.","The bully's atrocious behaviour towards the stray kitten shocked everyone at the void deck."],"bad":"The atrocious chocolate cake tasted so delicious that everyone asked for a second slice.","why":"Atrocious means shockingly wicked or cruel, so it cannot be used to praise a delicious cake."},"contemplate":{"ex":["I sat quietly to contemplate which book I should borrow from the library.","Staring at the monsoon rain, Aisha began to contemplate whether she should admit her mistake to her teacher."],"bad":"I contemplated the ball quickly and kicked it across the field without thinking.","why":"Contemplate means to think deeply and carefully, so it cannot describe acting quickly without thinking."},"conservation":{"ex":["Our class joined a conservation project to protect the mangroves near the beach.","Wildlife conservation is important because it helps rare animals such as pangolins survive in our forests."],"bad":"We practised conservation by cutting down all the trees in the park for fun.","why":"Conservation means protecting and preserving nature, so cutting down trees for fun is the opposite."},"deforestation":{"ex":["Deforestation leaves animals without trees to live in.","Because of deforestation, the hillside that was once thick with green trees became bare brown soil."],"bad":"Deforestation happens when people plant thousands of new trees in an empty field.","why":"Deforestation means removing trees from forests, so planting new trees is the opposite."},"biodiversity":{"ex":["The pond is full of biodiversity, with fish, frogs, insects and many kinds of plants.","Singapore's nature reserves protect biodiversity by giving thousands of different animals and plants a safe home."],"bad":"The biodiversity of my school bag is very heavy because of all the textbooks.","why":"Biodiversity means the variety of living things in a place, so it cannot describe the weight of a bag."},"abundant":{"ex":["Mangoes are abundant in the market during the summer.","After the monsoon rain, fresh green grass became abundant in the park, and the cows grazed happily."],"bad":"Water is abundant in the desert, so the travellers were very thirsty and had hardly a drop.","why":"Abundant means available in large amounts, so it cannot describe a desert where travellers have hardly any water."},"accommodate":{"ex":["Our classroom can accommodate forty pupils if we squeeze in extra chairs.","The kind neighbour offered to accommodate the visitors in her spare room until the flood waters went down."],"bad":"The tall wardrobe accommodated the little boy by shouting at him angrily.","why":"Accommodate means to provide space or lodging for someone, so it cannot mean shouting at a person."},"aggressive":{"ex":["The aggressive dog barked loudly and tried to bite anyone who walked past.","Ben's aggressive shouting at the football match made the other players afraid to come near him."],"bad":"My aggressive grandmother gently hummed a lullaby and smiled warmly at everyone.","why":"Aggressive means ready to attack or confront, so it cannot describe someone who is gentle and kind."},"anticipate":{"ex":["We anticipate heavy rain tomorrow, so I will pack my umbrella.","Anticipating a long queue at the hawker centre, Dad suggested we go early before the lunch crowd arrived."],"bad":"I anticipate that I ate my breakfast an hour ago before leaving the house.","why":"Anticipate means to expect something in the future, so it cannot describe something that already happened."},"apprehensive":{"ex":["Sam felt apprehensive about the dentist appointment tomorrow.","Standing at the edge of the high diving board, Hui Min felt apprehensive and her hands trembled."],"bad":"I was apprehensive when I won the prize, and I jumped up cheering with joy.","why":"Apprehensive means worried that something bad will happen, so it does not fit the joy of winning a prize."},"astonished":{"ex":["I was astonished when my teacher gave the whole class extra playtime.","The crowd was astonished when the little magician pulled a live rabbit out of his empty hat."],"bad":"The astonished boy yawned and said that nothing about the trick was a surprise.","why":"Astonished means greatly surprised, so it cannot describe someone who says nothing was a surprise."},"bewildered":{"ex":["The new pupil looked bewildered because she could not find her classroom.","Bewildered by the maze of crowded corridors at the MRT interchange, the tourist stopped and turned in circles."],"bad":"The bewildered boy knew exactly where to go and walked straight to the room.","why":"Bewildered means completely puzzled or confused, so it cannot describe someone who knows exactly what to do."},"blunder":{"ex":["I made a blunder by writing my name on the wrong page.","Adding salt instead of sugar to the cake mixture was a terrible blunder that ruined our baking project."],"bad":"She won first prize for her brilliant blunder, which was a perfect piece of work.","why":"A blunder is a careless mistake, so it cannot be used for a brilliant, perfect piece of work."},"boast":{"ex":["Ravi likes to boast about how fast he can run.","Instead of thanking the team, Kevin would boast loudly that he had scored every goal by himself."],"bad":"My teacher asked us to boast quietly by whispering that we were very sorry.","why":"Boast means to talk proudly about your achievements, so it cannot mean apologising."},"calamity":{"ex":["The flood was a calamity for the villagers who lost their homes.","When the heavy storm destroyed the stalls at the night market, the traders mourned the calamity."],"bad":"Winning a trip to the zoo was a great calamity that made us all celebrate happily.","why":"A calamity is a disaster causing great distress, so it cannot describe happy news worth celebrating."},"cautious":{"ex":["Be cautious when you walk on the wet floor in the canteen.","The cautious cyclist slowed down at every corner of the park connector to check for oncoming joggers."],"bad":"The cautious boy ran across the busy road without looking and laughed loudly.","why":"Cautious means careful to avoid danger, so running across a busy road without looking is not cautious."},"commend":{"ex":["The principal wanted to commend the pupils for keeping the school clean.","Our coach commended Wei Jie in front of the whole team for helping the younger players with their drills."],"bad":"The teacher commended Ali by scolding him and telling him off in front of the class.","why":"Commend means to praise someone formally, so scolding a pupil cannot be commending."},"commotion":{"ex":["There was a commotion in the canteen when the fire alarm rang.","A loud commotion broke out at the void deck as the children chased a runaway puppy around the benches."],"bad":"The library was full of commotion, so everyone could read in complete silence.","why":"Commotion means noisy and confused disturbance, so it cannot describe complete silence."},"compel":{"ex":["The heavy rain compelled us to stay indoors during recess.","Feeling that he had no choice, the rules compelled Danish to hand in his phone at the school gate."],"bad":"My friend compelled me to a delicious plate of chicken rice with an invitation.","why":"Compel means to force someone to do something, so it cannot mean simply inviting a friend to eat."},"conceal":{"ex":["The little girl tried to conceal the present behind her back.","The chameleon can conceal itself against a leaf, so even sharp-eyed children walked right past it."],"bad":"He proudly concealed his trophy by placing it on the table for everyone to see.","why":"Conceal means to hide something from sight, so putting a trophy on display for everyone is the opposite."},"conclude":{"ex":["The teacher will conclude the lesson with a short quiz.","The school concert concluded with a lively song, and the proud parents stood up to clap."],"bad":"We concluded the race by running to the starting line and beginning it.","why":"Conclude means to bring something to an end, so it cannot describe the start of a race."},"confide":{"ex":["I can confide in my best friend because she never tells anyone my secrets.","Nervous about her exam results, Priya chose to confide in her older sister about how worried she felt."],"bad":"I confide my favourite colour to everyone by shouting it loudly across the playground.","why":"Confide means to share a secret with someone you trust, so shouting something to everyone is not confiding."},"congregate":{"ex":["Pupils congregate in the school hall every Monday for assembly.","As the rain poured down, shoppers began to congregate under the shelter at the bus stop."],"bad":"The birds congregated by flying away from each other in all directions.","why":"Congregate means to gather together in a group, so flying away from each other is the opposite."},"conspicuous":{"ex":["Her bright yellow raincoat was conspicuous among the grey umbrellas.","The tall, red flag was so conspicuous that the lost hikers spotted it from far across the field."],"bad":"The spy wore a conspicuous costume so that nobody would notice him at all.","why":"Conspicuous means easy to see, so it does not fit a costume meant to stop anyone noticing."},"cordially":{"ex":["Our principal cordially welcomed the visitors to our school.","The shopkeeper cordially greeted every customer with a warm smile and asked about their families."],"bad":"The two rivals cordially glared at each other and refused to say a word.","why":"Cordially means in a warm and friendly way, so glaring angrily at someone is not cordial."},"courteous":{"ex":["A courteous pupil says thank you to the bus driver.","The courteous boy gave up his seat on the crowded MRT for an elderly man with a walking stick."],"bad":"The courteous girl rudely pushed past everyone and never said sorry.","why":"Courteous means polite and considerate, so rudely pushing past people is not courteous."},"deceive":{"ex":["It is wrong to deceive your friends by telling them lies.","The fox tried to deceive the crow by pretending to admire her voice so that she would drop the cheese."],"bad":"I tried to deceive my friend by telling her the honest truth about the test.","why":"Deceive means to make someone believe something untrue, so telling the honest truth is not deceiving."},"decipher":{"ex":["I could not decipher my brother's messy handwriting.","The explorers worked for hours to decipher the faded map and finally understood where the treasure was hidden."],"bad":"The teacher helped me decipher the paper by tearing it up and throwing it away.","why":"Decipher means to work out the meaning of something unclear, so tearing paper up is not deciphering."},"defiant":{"ex":["The defiant boy refused to wear his school cap even after being told twice.","Standing with her arms folded, the defiant girl shook her head and would not leave the field when the whistle blew."],"bad":"The defiant pupil always obeyed every rule and did exactly what the teacher said.","why":"Defiant means openly refusing to obey, so it cannot describe a pupil who always obeys the rules."},"deliberate":{"ex":["It was not an accident; the spill was deliberate.","Hana made a deliberate choice to sit beside the new girl so that she would not feel lonely."],"bad":"The glass fell by deliberate accident when nobody meant to touch it.","why":"Deliberate means done on purpose, so it cannot be used with an accident that nobody meant."},"demolish":{"ex":["The workers will demolish the old building next month.","The children watched a huge machine demolish the empty block of flats near the school, brick by brick."],"bad":"We demolished a beautiful sandwich by building it carefully with layers of cheese and lettuce.","why":"Demolish means to knock a building or structure down, so it cannot describe building a sandwich."},"depict":{"ex":["The poster depicts a family having dinner together.","In her painting, Mei depicted the busy hawker centre, with steam rising from the stalls and children laughing."],"bad":"The photograph depicted the telephone by ringing loudly and waking the baby.","why":"Depict means to show something in a picture or artwork, so it cannot mean making a loud sound."},"desolate":{"ex":["The playground was desolate after everyone had gone home.","Late at night, the desolate void deck was silent and bare, with not a single person in sight."],"bad":"The desolate food court was crowded with noisy diners and long queues.","why":"Desolate means empty of people and bleak, so it cannot describe a crowded, noisy place."},"detest":{"ex":["I detest waking up early on Monday mornings.","Zara detests the smell of durian so much that she holds her nose whenever she walks past the stall."],"bad":"I detest my best friend, so I always invite her to my birthday party happily.","why":"Detest means to dislike something intensely, so it does not match inviting a best friend happily."},"devastate":{"ex":["The storm could devastate the whole village.","The fire devastated the small kampong, leaving nothing but blackened ground where the houses once stood."],"bad":"The gentle breeze devastated the garden by making the flowers sway slightly.","why":"Devastate means to destroy something completely, so a gentle breeze swaying flowers is not devastating."},"diligent":{"ex":["Jia Hao is a diligent pupil who always finishes his homework.","The diligent student revised her spelling list every evening, even when her friends were playing outside."],"bad":"The diligent boy was lazy and never bothered to do any of his work.","why":"Diligent means careful and hard-working, so it cannot describe a lazy pupil who does no work."},"diminutive":{"ex":["The diminutive puppy could fit in the palm of my hand.","Despite his diminutive size, the little boy kicked the ball with surprising power across the school field."],"bad":"The diminutive elephant was the largest animal at the zoo and towered over everyone.","why":"Diminutive means extremely small, so it cannot describe an elephant that towers over everyone."},"discard":{"ex":["Please discard your rubbish into the bin after recess.","After the old toy broke, Ben decided to discard it and use his pocket money to buy a new one."],"bad":"I carefully discarded my favourite toy by keeping it in a safe place forever.","why":"Discard means to throw away something no longer wanted, so carefully keeping a favourite toy is the opposite."},"disconsolate":{"ex":["The disconsolate girl cried when her pet hamster ran away.","Disconsolate after losing the final match, the team sat in silence on the bench and could not be cheered up."],"bad":"The disconsolate boy danced happily around the room because he had won a prize.","why":"Disconsolate means very unhappy and unable to be comforted, so it cannot describe a boy dancing with joy."},"disguise":{"ex":["He wore a funny wig as a disguise at the party.","The little cat tried to disguise itself among the leaves so the birds would not notice it creeping closer."],"bad":"She disguised herself by wearing her usual school uniform and her normal name tag.","why":"Disguise means to change your appearance to hide who you are, so wearing your normal uniform and name tag is not a disguise."},"dismay":{"ex":["Much to my dismay, the picnic was cancelled because of the rain.","The pupils looked at the broken window in dismay, worried about what the principal would say."],"bad":"Her dismay grew when she heard she had won first prize in the competition.","why":"Dismay is distress caused by something unexpected and bad, so it does not fit winning a prize."},"distinguish":{"ex":["It is hard to distinguish between the twins because they look alike.","Even in the dim light of the void deck, Farah could distinguish her mother's voice from all the others."],"bad":"I can distinguish two things by mixing them together until they look exactly the same.","why":"Distinguish means to tell that things are different, so mixing things until they look the same is the opposite."},"drench":{"ex":["The sudden rain will drench us if we have no umbrella.","The monsoon downpour drenched the children as they ran across the field, and water dripped from their hair."],"bad":"The desert sun drenched the sand until it was dry and dusty.","why":"Drench means to make something completely wet, so the sun making sand dry is not drenching."},"dwindle":{"ex":["Our supply of water began to dwindle on the long hike.","As the school term went on, the number of pupils joining the early morning club began to dwindle."],"bad":"The crowd dwindled when more and more people poured in until the hall was full.","why":"Dwindle means to become gradually smaller, so a crowd growing bigger and fuller is the opposite."},"eccentric":{"ex":["Our eccentric neighbour wears a bright hat and talks to his plants.","The eccentric inventor rode to the market on a bicycle with a tiny umbrella tied to its handlebars."],"bad":"The eccentric boy was completely ordinary and did everything just like everyone else.","why":"Eccentric means unconventional and slightly strange, so it cannot describe someone ordinary who acts like everyone else."},"elated":{"ex":["Mei Ling was elated when her teacher announced that she had won the spelling bee.","The elated boys leapt into the air and hugged each other as the final whistle blew."],"bad":"Mum was elated when she burnt the rice and the kitchen filled with smoke.","why":"Elated means extremely happy, so it does not fit a sad or upsetting event like burning the rice."},"eloquent":{"ex":["Our captain gave an eloquent speech, and everyone in the hall clapped loudly.","Although she was only twelve, Priya was so eloquent that the judges listened to every word with admiration."],"bad":"Ben was eloquent because he stood silently and could not find a single word to say.","why":"Eloquent means speaking fluently and persuasively, so it cannot describe someone who stays silent and speechless."},"empathy":{"ex":["Ravi showed empathy by sitting beside his friend and listening when she felt sad.","Because she felt real empathy for the lost toddler, Aisha stayed with him until his mother appeared."],"bad":"The teacher gave the class empathy to carry because the box was heavy.","why":"Empathy is understanding and sharing another person's feelings, so it is not an object that can be carried."},"encounter":{"ex":["We encounter many kinds of birds when we walk through the park in the morning.","While cycling home after the monsoon rain, Daniel suddenly had to encounter a huge puddle blocking the whole path."],"bad":"I plan to encounter my homework carefully by writing the answers on a blank sheet of paper.","why":"Encounter means to meet or face something unexpectedly, so it cannot mean to plan or carry out work on purpose."},"endeavour":{"ex":["I will endeavour to finish my science project before the weekend.","Despite the heavy rain, the volunteers continued to endeavour to clear the drain beside the void deck."],"bad":"Sam did not endeavour at all, so he easily passed the difficult test with full marks.","why":"Endeavour means to try hard, so it is wrong to use it for someone who makes no effort at all."},"enormous":{"ex":["The elephant at the zoo was enormous compared with the little boy standing beside it.","An enormous queue stretched past the hawker centre stall, so we decided to eat somewhere else."],"bad":"The enormous mouse was so tiny that it could hide inside a matchbox.","why":"Enormous means very large, so it cannot describe a tiny mouse that fits inside a matchbox."},"exaggerate":{"ex":["Do not exaggerate, because the fish you caught was only the size of my hand.","Hui Min liked to exaggerate, so her small cut on the knee became a terrible wound in her story."],"bad":"To exaggerate the answer, Jun Wei checked each sum again and wrote the exact figure.","why":"Exaggerate means to make something seem bigger or worse than it is, not to check or be accurate."},"exasperated":{"ex":["Mum felt exasperated when I forgot my water bottle for the third time this week.","The exasperated teacher sighed loudly as the class kept chatting even after she asked them three times to stop."],"bad":"Wei Jie felt exasperated and delighted when he won the lucky draw at the school fair.","why":"Exasperated means very annoyed and frustrated, so it does not fit the happy feeling of winning a prize."},"exotic":{"ex":["The market sold exotic fruits that I had never seen in Singapore before.","Lena stared at the exotic birds with brightly coloured feathers that had been brought from a faraway rainforest."],"bad":"Plain white rice from our own kitchen is an exotic food that we eat every day.","why":"Exotic means unusual and from a distant foreign land, so it cannot describe an ordinary food eaten daily at home."},"extinguish":{"ex":["The firemen used water to extinguish the small fire in the rubbish bin.","Before leaving the campsite, we had to extinguish the campfire completely so that no sparks remained."],"bad":"Please extinguish the lights so that the room becomes brighter for our reading lesson.","why":"Extinguish means to put out a fire or light, which makes a room darker, not brighter."},"famished":{"ex":["After football practice, I was famished and ate two bowls of noodles.","The famished children rushed to the school canteen as soon as the recess bell rang."],"bad":"Yesterday I felt famished because I had just finished three plates of chicken rice.","why":"Famished means extremely hungry, so it does not fit someone who has just eaten a lot of food."},"fatigue":{"ex":["Fatigue made Zhi Wei yawn during the last lesson of the day.","After hiking up the hill for three hours, the scouts were overcome by fatigue and dropped onto the grass."],"bad":"My fatigue made me jump about in excitement and run around the field all afternoon.","why":"Fatigue means extreme tiredness, so it does not cause lots of energy and excited running."},"feat":{"ex":["Climbing the tall mountain was a great feat for such a young girl.","Swimming across the lake without stopping was a remarkable feat that earned Hafiz a loud cheer from his classmates."],"bad":"Putting on my socks this morning was a great feat that everybody praised me for.","why":"A feat is a great achievement needing courage or skill, so an easy daily task like wearing socks is not one."},"fervently":{"ex":["The fans cheered fervently as their team scored the winning goal.","Mei Xin fervently hoped that the typhoon of rain would stop before her birthday picnic began."],"bad":"He fervently yawned and stared at the clock because he was bored with the lesson.","why":"Fervently means with strong passion and enthusiasm, so it cannot describe a bored yawn."},"flee":{"ex":["The pigeons flee whenever a child runs towards them in the park.","When the dark clouds burst, the shoppers had to flee from the open field to the nearest bus stop."],"bad":"The brave soldier decided to flee towards the loud noise so that he could meet it.","why":"Flee means to run away from danger, so it cannot mean running towards something on purpose."},"flourish":{"ex":["Plants flourish when they get enough sunlight and water.","Under Grandma's careful watering, the herbs on our HDB balcony began to flourish and grew thick and green."],"bad":"The flowers began to flourish and quickly turned brown and dried up in the heat.","why":"Flourish means to grow well and healthily, so it cannot describe plants drying up and dying."},"forbid":{"ex":["My parents forbid me from using the computer before I finish my homework.","The sign at the pool forbids anyone from running along the wet floor, since someone might slip."],"bad":"The teacher forbids us to enter the library, so we are encouraged to borrow many books.","why":"Forbid means to not allow something, so it contradicts being encouraged to go in."},"fragile":{"ex":["Be careful with the glass vase because it is fragile.","The fragile wings of the butterfly could easily be torn by even the lightest touch of a finger."],"bad":"The fragile steel bridge was strong enough to carry hundreds of heavy lorries every day.","why":"Fragile means easily broken, so it cannot describe a strong steel bridge that carries heavy lorries."},"frantic":{"ex":["Mum was frantic when she could not find her purse anywhere.","In a frantic search, Arjun turned over every cushion in the living room to find his missing homework."],"bad":"The frantic boy sat calmly under the tree and slowly sipped his cold drink.","why":"Frantic means wildly worried or panicking, so it does not describe a calm and relaxed person."},"frivolous":{"ex":["Buying ten toy cars in one day seems frivolous to my parents.","The principal said that spending the school's money on a frivolous gift would be a waste when the library needed new books."],"bad":"The doctor gave a frivolous warning about a very serious illness, so everyone listened carefully.","why":"Frivolous means silly and without serious purpose, so it does not fit an important serious warning."},"gaze":{"ex":["We gaze at the stars from the rooftop every clear night.","Standing at the window, Kai could only gaze at the rain falling over the empty playground."],"bad":"Sara had to gaze quickly through the door and was gone in a blink.","why":"Gaze means to look steadily for a long time, so it cannot describe a quick passing action."},"generous":{"ex":["My generous uncle gave each of us a big red packet.","The generous hawker uncle often added extra slices of fish to the bowls of hungry old folks."],"bad":"Selfish Dan was generous because he refused to share any of his sweets with others.","why":"Generous means giving freely and willingly, so someone who refuses to share is not generous."},"glimpse":{"ex":["I caught a glimpse of the kitten as it ran behind the cupboard.","Through the crowd at the MRT station, Jia Hui managed only a glimpse of her friend's red cap."],"bad":"We had a long glimpse of the painting for two whole hours in the museum.","why":"A glimpse is a very brief view, so it cannot last for two hours."},"gloom":{"ex":["Rain clouds filled the sky with gloom, and the playground was empty.","A feeling of gloom settled over the team after they lost the match by a large margin."],"bad":"The sunny classroom was full of gloom as bright light shone through every window.","why":"Gloom means darkness or sadness, so it does not describe a bright, cheerful and sunny room."},"grave":{"ex":["The doctor looked grave as he explained that the problem was serious.","With a grave face, the principal told the school that the flood damage needed immediate attention."],"bad":"Everyone laughed at the grave joke that made the whole class giggle with joy.","why":"Grave means serious and worrying, so it cannot describe a funny joke that makes people giggle."},"grievance":{"ex":["The pupils wrote down their grievance about the broken water cooler.","Mr Tan listened to every grievance from the neighbours who complained about the noise at the void deck."],"bad":"He received a prize for his grievance and thanked everyone for the happy surprise.","why":"A grievance is a complaint about something wrong, so it is not a prize or a happy gift."},"gullible":{"ex":["Gullible Tim believed it when his brother said that fish can fly.","The gullible customer handed over his money after the stranger promised that the plain stone would make him rich."],"bad":"Because she was gullible, Mei doubted everything and never trusted anything people told her.","why":"Gullible means too ready to believe things, so it cannot describe someone who doubts everything."},"hazardous":{"ex":["Wet floors can be hazardous, so please walk slowly.","The hazardous chemicals were kept in a locked cupboard so that no pupil could touch them."],"bad":"A soft pillow on a bed is hazardous because it is perfectly safe to sleep on.","why":"Hazardous means dangerous, so it cannot describe something safe like a soft pillow."},"hesitate":{"ex":["Please do not hesitate to ask me if you need help.","Ali began to hesitate at the edge of the high diving board, unsure whether he was brave enough to jump."],"bad":"Without any hesitate, Lin raced forward quickly and answered the question.","why":"Hesitate is a verb meaning to pause in doubt; the correct noun is hesitation, so the sentence is wrong."},"hinder":{"ex":["Heavy traffic can hinder the school bus from arriving on time.","The thick fog and slippery road began to hinder the cyclists, who had to slow down and push their bikes."],"bad":"Good friends hinder you so that you finish your project earlier and more easily.","why":"Hinder means to make something harder or slower, so it cannot mean to help someone finish more easily."},"identical":{"ex":["The twins wore identical uniforms, so I could not tell them apart.","Two identical cups sat on the shelf, and not even Grandma could tell the difference between them."],"bad":"Our two bags are identical because one is red and big and the other is small and blue.","why":"Identical means exactly alike in every detail, so two bags with different colours and sizes are not identical."},"illuminate":{"ex":["The torch will illuminate the dark path for us.","Hundreds of lanterns illuminate the park at night during the Mid-Autumn Festival and brighten the faces of the children."],"bad":"The thick black curtains illuminate the room and make it very dark inside.","why":"Illuminate means to light up, so it cannot describe something that makes a room dark."},"imitate":{"ex":["Parrots can imitate the sounds that they hear from people.","Little Wen liked to imitate her teacher by standing at the front and pointing at the board."],"bad":"I always imitate the answer by writing a completely different idea from my friend's.","why":"Imitate means to copy someone, so writing a completely different idea is the opposite of imitating."},"immense":{"ex":["The whale was immense and almost as long as our school hall.","An immense
